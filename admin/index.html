<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Asteris — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0C0D0E; --panel:#16181A; --panel2:#1E2124; --edge:#2E3337; --edge2:#41474C;
  --ink:#ECEEEC; --dim:#A2A8A5; --faint:#71776F;
  --gold:#C9A166; --gold-lo:rgba(201,161,102,.14);
  --pos:#3FD07A; --neg:#FF5B4C; --warn:#F5C518;
  --sans:"Hanken Grotesk",system-ui,sans-serif; --mono:"Space Mono",monospace;
}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased;font-size:13px}
a{color:var(--gold)}
button{font-family:var(--sans);cursor:pointer}
input,select,textarea{font-family:var(--sans);font-size:13px;background:var(--panel2);border:1px solid var(--edge);color:var(--ink);padding:9px 10px;border-radius:4px;width:100%}
input:focus,select,textarea:focus{outline:1px solid var(--gold);border-color:var(--gold)}
textarea{resize:vertical;min-height:64px;line-height:1.6}
label{display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:0 0 5px}
.wrap{max-width:940px;margin:0 auto;padding:26px 20px 90px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row > *{flex:1;min-width:180px}
.mono{font-family:var(--mono)}

.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--edge2);background:var(--panel);color:var(--ink);padding:9px 15px;border-radius:4px;font-size:12px;font-weight:600}
.btn:hover{border-color:var(--gold)}
.btn.gold{background:var(--gold);color:#0C0D0E;border-color:var(--gold)}
.btn.gold:hover{opacity:.9}
.btn.sm{padding:6px 10px;font-size:11px}
.btn.danger{border-color:var(--neg);color:var(--neg)}
.btn.danger:hover{background:var(--neg);color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--dim);padding:6px 8px}
.btn.ghost:hover{color:var(--ink)}

/* login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
#login .box{width:100%;max-width:320px;text-align:center}
#login svg,#login img{width:auto;height:40px;margin-bottom:18px}
#login h1{font-size:15px;letter-spacing:.3em;text-transform:uppercase;color:var(--dim);margin-bottom:22px}
#login .pw-wrap{position:relative;margin-bottom:10px}
#login .pw-wrap input{text-align:center;letter-spacing:.15em;padding-right:38px;margin:0}
#login .pw-eye{position:absolute;top:0;right:0;height:100%;width:36px;display:flex;align-items:center;justify-content:center;background:none;border:0;color:var(--faint);padding:0}
#login .pw-eye:hover{color:var(--ink)}
#login .pw-eye.on{color:var(--gold)}
#login .pw-eye svg{width:16px;height:16px}
#login .btn.gold{justify-content:center}
.err{color:var(--neg);font-size:11px;margin-top:8px;min-height:1em}

/* topo */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
.top h1{display:flex;align-items:center;gap:9px;font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--dim)}
.top h1 svg,.top h1 img{width:auto;height:17px}

/* ===== painel de estado / quotas ===== */
.dash-h{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);margin:0 0 11px}
.dash{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px}
@media(max-width:1000px){
  .dash{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;margin:0 -4px 12px;padding:0 4px 4px}
  .dash::-webkit-scrollbar{display:none}
  .qcard{flex:0 0 76%;scroll-snap-align:center}
}
.qcard{background:linear-gradient(158deg,rgba(46,51,55,.42),rgba(20,22,24,.5));border:1px solid var(--edge);border-radius:12px;padding:15px 16px;min-width:0}
.qcard.warn{border-color:rgba(245,197,24,.45)} .qcard.bad{border-color:rgba(255,91,76,.45)}
.qcard .qt{font-size:9px;letter-spacing:.17em;text-transform:uppercase;color:var(--faint);margin-bottom:10px}
.qcard .qbig{font-size:20px;font-weight:700;line-height:1.15}
.qcard .qbig small{font-size:11.5px;font-weight:500;color:var(--dim)}
.qcard .qmeta{font-size:10.5px;color:var(--dim);margin-top:5px}
.qbar{height:7px;border-radius:4px;background:var(--edge2);overflow:hidden;margin-top:11px;display:flex}
.qbar > i{display:block;height:100%}
.qbar > i.f{background:var(--gold)} .qbar > i.f.warn{background:var(--warn)} .qbar > i.f.bad{background:var(--neg)}
.qbar .s-prop{background:#8FB8D8}.qbar .s-ent{background:var(--gold)}.qbar .s-pf{background:#B79CE0}.qbar .s-sel{background:var(--pos)}
.qlegend{display:flex;flex-wrap:wrap;gap:9px;margin-top:9px;font-size:9.5px;color:var(--dim)}
.qlegend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:middle}
.qlegend .s-prop{background:#8FB8D8}.qlegend .s-ent{background:var(--gold)}.qlegend .s-pf{background:#B79CE0}.qlegend .s-sel{background:var(--pos)}
.qexp{font-size:10.5px;line-height:1.75;margin-top:7px}
.qexp .g{color:var(--neg);font-weight:700} .qexp .s{color:var(--warn);font-weight:700}
.sysbar{display:flex;flex-wrap:wrap;gap:16px;font-size:10px;color:var(--faint);border-top:1px solid var(--edge);padding-top:11px;margin-bottom:24px}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;vertical-align:middle}
.dot.ok{background:var(--pos)} .dot.off{background:var(--faint)} .dot.bad{background:var(--neg)}

/* ===== colunas por categoria ===== */
.mkcols{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:start}
@media(max-width:1080px){
  .mkcols{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;gap:12px;margin:0 -4px;padding:0 4px 8px}
  .mkcols::-webkit-scrollbar{display:none}
  .mkcol{flex:0 0 86%;scroll-snap-align:center}
}
.mkcol{min-width:0}
.mkcol > h2{position:sticky;top:8px;z-index:3;display:block;text-align:center;font-size:9.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#0C0D0E;background:linear-gradient(180deg,#D9B778,#C9A166);border-radius:7px;padding:9px 10px;margin-bottom:14px;box-shadow:0 4px 14px rgba(201,161,102,.22)}
.mkcol > h2 .cnt{opacity:.75;font-family:var(--mono);letter-spacing:0}
.mkcol .stack{display:flex;flex-direction:column;gap:12px}
.mkcol .empty{color:var(--faint);font-size:11px;padding:18px 4px;text-align:center}

/* ===== card vidro escuro ===== */
.mkitem{position:relative;background:linear-gradient(158deg,rgba(52,58,63,.5),rgba(20,22,24,.68));border:1px solid var(--edge2);border-radius:11px;padding:13px 14px;backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);box-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 8px 20px rgba(0,0,0,.3)}
.mkitem .code{font-family:var(--mono);font-weight:700;color:var(--gold);font-size:11px;letter-spacing:.05em}
.mkitem .nm{font-weight:700;font-size:13px;margin-top:5px;line-height:1.32;word-break:break-word;padding-right:22px}
.mkitem .ti{color:var(--dim);font-size:11px;margin-top:2px;word-break:break-word}
.mkitem .chip{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:9.5px;letter-spacing:.03em;padding:3px 9px;border-radius:20px;border:1px solid var(--edge2);color:var(--dim)}
.mkitem .chip .d{width:5px;height:5px;border-radius:50%;background:currentColor;flex-shrink:0}
.mkitem .chip.perm{border-color:rgba(63,208,122,.4);color:var(--pos)}
.mkitem .chip.soon{border-color:rgba(245,197,24,.45);color:var(--warn)}
.mkitem .chip.gone{border-color:rgba(255,91,76,.45);color:var(--neg)}
.mkitem .menu-btn{position:absolute;top:9px;right:8px;width:26px;height:22px;border-radius:6px;border:1px solid transparent;background:none;color:var(--dim);font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center;letter-spacing:1px}
.mkitem .menu-btn:hover,.mkitem .menu-btn.open{background:var(--panel2);border-color:var(--edge2);color:var(--ink)}

/* popover de ações */
.pop{position:fixed;z-index:60;min-width:184px;background:var(--panel2);border:1px solid var(--edge2);border-radius:11px;padding:5px;box-shadow:0 14px 40px rgba(0,0,0,.55)}
.pop button,.pop a{display:flex;width:100%;align-items:center;gap:9px;text-align:left;background:none;border:0;color:var(--ink);font-size:12px;padding:8px 10px;border-radius:7px;text-decoration:none}
.pop button:hover,.pop a:hover{background:var(--panel)}
.pop .sep{height:1px;background:var(--edge);margin:4px 3px}
.pop .head{font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);padding:7px 10px 3px}
.pop .danger{color:var(--neg)}

/* ===== modal do site ===== */
.modal-ov{position:fixed;inset:0;z-index:80;background:rgba(6,7,8,.74);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:20px}
.modal{width:100%;max-width:370px;max-height:88vh;overflow-y:auto;background:linear-gradient(160deg,rgba(44,49,53,.96),rgba(17,19,21,.98));border:1px solid var(--edge2);border-radius:15px;padding:22px;box-shadow:0 26px 66px rgba(0,0,0,.6)}
.modal h4{font-size:14.5px;font-weight:700;margin-bottom:9px}
.modal p{font-size:12px;color:var(--dim);line-height:1.6;margin-bottom:2px}
.modal .field{margin:14px 0 0}
.modal .err{min-height:0;margin-top:6px}
.modal .mrow{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.modal{position:relative}
.modal.lg{max-width:460px}
.modal .close-x{position:absolute;top:11px;right:11px;width:26px;height:26px;border:0;background:none;color:var(--faint);font-size:19px;line-height:1;border-radius:6px}
.modal .close-x:hover{color:var(--ink);background:var(--panel2)}
.modal h4{padding-right:24px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:90;background:var(--panel2);border:1px solid var(--edge2);color:var(--ink);font-size:12px;padding:10px 16px;border-radius:9px;box-shadow:0 10px 30px rgba(0,0,0,.5);opacity:0;transition:opacity .2s}
.toast.on{opacity:1}

/* nav de abas */
.navtabs{display:flex;gap:4px;margin-bottom:20px;border-bottom:1px solid var(--edge)}
.navtabs button{background:none;border:0;border-bottom:2px solid transparent;color:var(--dim);font-size:12px;font-weight:600;letter-spacing:.06em;padding:9px 12px;margin-bottom:-1px}
.navtabs button.on{color:var(--gold);border-bottom-color:var(--gold)}

/* nova página — escolha de tipo */
.np-types{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 2px}
.np-type{display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--panel2);border:1px solid var(--edge2);border-radius:9px;padding:10px 11px}
.np-type:hover{border-color:var(--gold)}
.np-type.on{border-color:var(--gold);background:var(--gold-lo)}
.np-type b{font-size:12px}
.np-type span{font-size:9.5px;color:var(--dim);line-height:1.35}
.np-code{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:13px;color:var(--gold);background:var(--panel2);border:1px solid var(--edge);border-radius:6px;padding:8px 10px;margin-top:4px}
.np-code button{margin-left:auto;font-size:10px;color:var(--dim);background:none;border:0;text-decoration:underline}
.radio-row{display:flex;gap:8px;margin-top:6px}
.radio-row label{flex:1;text-align:center;background:var(--panel2);border:1px solid var(--edge2);border-radius:7px;padding:9px 8px;font-size:11.5px;color:var(--ink);text-transform:none;letter-spacing:0;margin:0}
.radio-row label.on{border-color:var(--gold);color:var(--gold);background:var(--gold-lo)}
.np-fromlib{width:100%;background:var(--panel2);border:1px dashed var(--edge2);border-radius:8px;color:var(--dim);font-size:11.5px;padding:11px;margin-top:8px}
.np-fromlib:hover{border-color:var(--gold);color:var(--gold)}
.np-fromlib.picked{border-style:solid;border-color:var(--pos);color:var(--pos)}

/* biblioteca */
.lib-drop{border:1.5px dashed var(--edge2);border-radius:12px;padding:24px 16px;text-align:center;color:var(--faint);font-size:12px;margin-bottom:18px;transition:border-color .15s,color .15s,background .15s}
.lib-drop.over{border-color:var(--gold);color:var(--gold);background:var(--gold-lo)}
.lib-drop b{color:var(--ink);font-size:13px;display:block;margin-bottom:5px}
.lib-subtabs{display:flex;gap:6px;margin-bottom:14px}
.lib-subtabs button{background:var(--panel2);border:1px solid var(--edge2);color:var(--dim);font-size:11px;font-weight:600;padding:7px 14px;border-radius:20px}
.lib-subtabs button.on{background:var(--gold);color:#0C0D0E;border-color:var(--gold)}
.lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.lib-folder{position:relative;background:var(--panel);border:1px solid var(--edge2);border-radius:12px;overflow:hidden}
.lib-folder:hover{border-color:var(--edge2)}
.lib-folder .lf-cover{aspect-ratio:16/10;background:#0a0a0a center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:24px;border-bottom:1px solid var(--edge)}
.lib-folder .lf-body{padding:11px 12px}
.lib-folder .lf-name{font-weight:700;font-size:12.5px;word-break:break-word;line-height:1.3}
.lib-folder .lf-meta{font-size:10px;color:var(--dim);margin-top:3px}
.lib-folder .lf-menu{position:absolute;top:7px;right:7px;width:28px;height:24px;border-radius:6px;border:1px solid transparent;background:rgba(11,11,10,.62);color:#fff;font-size:14px;display:flex;align-items:center;justify-content:center;letter-spacing:1px;backdrop-filter:blur(4px)}
.lib-folder .lf-menu:hover,.lib-folder .lf-menu.open{background:var(--panel2);border-color:var(--edge2)}
.lib-empty{color:var(--faint);font-size:11px;padding:16px 2px;text-align:center}
.tag{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--edge2);border-radius:3px;padding:2px 6px;color:var(--dim)}
.tag.exp{border-color:var(--neg);color:var(--neg)}

/* editor */
.card{background:var(--panel);border:1px solid var(--edge);border-radius:8px;padding:18px;margin-bottom:16px}
.card > h3{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}
.field{margin-bottom:12px}
.hint{font-size:10.5px;color:var(--faint);margin-top:4px}
.check{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink)}
.check input{width:auto}

/* lista de imagens */
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(94px,1fr));gap:8px;margin-top:10px}
.imgc{position:relative;border:1px solid var(--edge);border-radius:4px;overflow:hidden;background:#0a0a0a;aspect-ratio:1}
.imgc img,.imgc video{width:100%;height:100%;object-fit:cover}
.imgc .x{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;border:0;background:rgba(0,0,0,.7);color:#fff;font-size:12px;line-height:1;display:flex;align-items:center;justify-content:center}
.imgc .mv{position:absolute;bottom:3px;left:3px;display:flex;gap:2px}
.imgc .mv button{width:18px;height:18px;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:11px;border-radius:3px}
.drop{border:1px dashed var(--edge2);border-radius:6px;padding:16px;text-align:center;color:var(--faint);font-size:11.5px;margin-top:10px}
.drop.over{border-color:var(--gold);color:var(--gold)}

/* secções da proposta */
.sec{background:var(--panel2);border:1px solid var(--edge);border-radius:6px;margin-bottom:10px}
.sec > .sh{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--edge)}
.sec > .sh .st{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.sec > .sh .sp{flex:1;color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec > .sb{padding:12px}
.addsec{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}

.cardrow{border:1px solid var(--edge);border-radius:5px;padding:10px;margin-bottom:8px;background:var(--panel)}
.cardrow .cr-top{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.cardrow .cr-top .grow{flex:1}

.savebar{position:fixed;left:0;right:0;bottom:0;background:rgba(12,13,14,.94);backdrop-filter:blur(8px);border-top:1px solid var(--edge);padding:11px 20px;display:flex;gap:10px;align-items:center;justify-content:flex-end;z-index:20}
.savebar .msg{margin-right:auto;font-size:11.5px;color:var(--faint)}
.savebar .msg.ok{color:var(--pos)} .savebar .msg.bad{color:var(--neg)}
[hidden]{display:none!important}
</style>
</head>
<body>

<div id="login">
  <div class="box">
    <img src="/assets/logos/asteris.png" alt="Asteris">
    <h1>Asteris Admin</h1>
    <form id="loginForm">
      <div class="pw-wrap">
        <input type="password" id="pw" placeholder="Password" autocomplete="current-password" required>
        <button type="button" class="pw-eye" id="pwEye" aria-label="Mostrar password">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
      </div>
      <button class="btn gold" style="width:100%" type="submit">Entrar</button>
      <div class="err" id="loginErr"></div>
    </form>
  </div>
</div>

<div id="app" class="wrap" hidden>
  <div class="top">
    <h1><img src="/assets/logos/asteris.png" alt=""> Asteris Admin</h1>
    <div style="display:flex;gap:8px">
      <button class="btn sm" id="btnLogout">Sair</button>
    </div>
  </div>
  <div id="view"></div>
</div>

<script>
/* ============================ helpers ============================ */
var $ = function(s,r){ return (r||document).querySelector(s); };
var el = function(t,c,h){ var e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e; };
function api(method, path, body){
  return fetch("/api/"+path, {
    method: method,
    headers: body ? { "content-type":"application/json" } : undefined,
    body: body ? JSON.stringify(body) : undefined
  }).then(function(r){ return r.json().then(function(j){ return { ok:r.ok, status:r.status, j:j }; }); });
}
function esc(s){ return (s==null?"":String(s)).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }

/* ============================ modal + popover do site ============================ */
function modal(build, opts){
  opts = opts || {};
  return new Promise(function(resolve){
    var ov = el("div","modal-ov"), box = el("div","modal" + (opts.cls ? " " + opts.cls : ""));
    ov.appendChild(box);
    function close(val){ ov.remove(); document.removeEventListener("keydown", onKey); resolve(val); }
    function onKey(e){ if(e.key === "Escape") close(undefined); }
    document.addEventListener("keydown", onKey);
    ov.addEventListener("mousedown", function(e){ if(e.target === ov) close(undefined); });
    build(box, close);
    var x = el("button","close-x"); x.innerHTML = "&times;"; x.setAttribute("aria-label","Fechar");
    x.onclick = function(){ close(undefined); };
    box.appendChild(x);
    document.body.appendChild(ov);
  });
}
function confirmModal(o){
  return modal(function(box, close){
    box.innerHTML = '<h4>'+esc(o.title)+'</h4>' + (o.message ? '<p>'+esc(o.message)+'</p>' : '');
    var row = el("div","mrow");
    var c = el("button","btn ghost", o.cancel || "Cancelar"); c.onclick = function(){ close(false); };
    var k = el("button","btn "+(o.danger ? "danger" : "gold"), o.ok || "Confirmar"); k.onclick = function(){ close(true); };
    row.appendChild(c); row.appendChild(k); box.appendChild(row);
    setTimeout(function(){ (o.danger ? c : k).focus(); }, 30);
  });
}
function promptModal(o){
  return modal(function(box, close){
    box.innerHTML = '<h4>'+esc(o.title)+'</h4>' + (o.message ? '<p>'+esc(o.message)+'</p>' : '');
    var f = el("div","field");
    if(o.label) f.appendChild(Object.assign(el("label"), { textContent: o.label }));
    var inp = el("input"); inp.type = o.type || "text"; inp.value = o.value || "";
    if(o.placeholder) inp.placeholder = o.placeholder;
    f.appendChild(inp); box.appendChild(f);
    var err = el("div","err"); box.appendChild(err);
    function submit(){
      var val = inp.value.trim();
      if(o.validate){ var e = o.validate(val); if(e){ err.textContent = e; return; } }
      close(val);
    }
    inp.addEventListener("keydown", function(e){ if(e.key === "Enter"){ e.preventDefault(); submit(); } });

    setTimeout(function(){ inp.focus(); }, 30);
  });

var _toastT = null;

  var t = $("#toast");

  t.textContent = msg;

function pageURL(code){ return location.origin + "/" + code; }
function copyLink(code){

}

function closeMenu(){ var p = $("#actpop"); if(p){ if(p._cleanup) p._cleanup(); p.remove(); } }
function openMenu(anchor, items){
  closeMenu();
  var pop = el("div","pop"); pop.id = "actpop";
  items.forEach(function(it){
    if(it.sep){ pop.appendChild(el("div","sep")); return; }
    if(it.head != null){ pop.appendChild(el("div","head", esc(it.head))); return; }
    var b;
    if(it.href){ b = el("a", it.danger ? "danger" : "", esc(it.label)); b.href = it.href; b.target = "_blank"; b.onclick = function(){ closeMenu(); }; }
    else { b = el("button", it.danger ? "danger" : "", esc(it.label)); b.onclick = function(){ closeMenu(); it.onClick(); }; }
    pop.appendChild(b);
  });
  document.body.appendChild(pop);
  var r = anchor.getBoundingClientRect(), w = pop.offsetWidth, h = pop.offsetHeight;
  var left = Math.max(8, Math.min(r.right - w, window.innerWidth - w - 8));
  var top = r.bottom + 6;
  if(top + h > window.innerHeight - 8) top = Math.max(8, r.top - h - 6);
  pop.style.left = left + "px"; pop.style.top = top + "px";
  anchor.classList.add("open");
  function onDown(e){ if(!pop.contains(e.target) && e.target !== anchor) closeMenu(); }
  function onScroll(){ closeMenu(); }
  setTimeout(function(){ document.addEventListener("mousedown", onDown); window.addEventListener("scroll", onScroll, true); }, 0);
  pop._cleanup = function(){ document.removeEventListener("mousedown", onDown); window.removeEventListener("scroll", onScroll, true); anchor.classList.remove("open"); };
}

function fmtBytes(b){
  if(b == null) return "—";
  if(b < 1024) return b + " B";
  if(b < 1048576) return (b/1024).toFixed(0) + " KB";
  if(b < 1073741824) return (b/1048576).toFixed(1) + " MB";
  return (b/1073741824).toFixed(2) + " GB";
}
function pctCls(p){ return p > 85 ? "bad" : (p > 60 ? "warn" : ""); }

function loadStats(dash){
  dash.innerHTML = '<div class="qcard"><div class="qt">a carregar…</div></div>';
  api("GET","stats").then(function(r){
    if(!r.ok){
      dash.innerHTML = '<div class="qcard bad"><div class="qt">Estado</div><div class="qmeta">indisponível — falta o último deploy</div></div>';
      return;
    }
    var s = r.j, pg = s.pages, GB = 1073741824;
    var expN = (pg.expired||[]).length, soonN = (pg.soon||[]).length;
    var byT = pg.byType || {};
    var html = "";

    /* 1 — R2 (entregas ao cliente) */
    var r2 = s.r2, r2maxB = s.limits.r2.storageGB * GB;
    if(r2.bound && r2.bytes != null){
      var r2pct = r2.bytes / r2maxB * 100, r2cls = pctCls(r2pct);
      html += '<div class="qcard '+r2cls+'">'
        + '<div class="qt">R2 · Entregas</div>'
        + '<div class="qbig">'+fmtBytes(r2.bytes)+' <small>/ '+s.limits.r2.storageGB+' GB</small></div>'
        + '<div class="qbar"><i class="f '+r2cls+'" style="width:'+Math.max(2, Math.min(100, r2pct)).toFixed(1)+'%"></i></div>'
        + '<div class="qmeta">'+fmtBytes(r2maxB - r2.bytes)+' livres · '+r2.objects+' ficheiro'+(r2.objects===1?'':'s')+(r2.truncated?'+':'')+' · downloads grátis</div>'
        + '</div>';
    } else {
      html += '<div class="qcard warn">'
        + '<div class="qt">R2 · Entregas</div>'
        + '<div class="qbig">não ligado</div>'
        + '<div class="qmeta">Falta criar o bucket + binding. Até lá, entregas por link colado.</div>'
        + '</div>';
    }

    /* 2 — Cloudinary (portfólio + seleção) */
    var cd = s.cloudinary || {};
    if(cd.configured && cd.credits && cd.credits.limit){
      var cpct = cd.credits.used_percent != null ? cd.credits.used_percent : (cd.credits.usage / cd.credits.limit * 100);
      var ccls = pctCls(cpct);
      html += '<div class="qcard '+ccls+'">'
        + '<div class="qt">Cloudinary · Portfólio + Seleção</div>'

        + '<div class="qbar"><i class="f '+ccls+'" style="width:'+Math.max(2, Math.min(100, cpct)).toFixed(1)+'%"></i></div>'
        + '<div class="qmeta">'+(cd.storageBytes!=null?fmtBytes(cd.storageBytes)+' guardados · ':'')+(cd.resources!=null?cd.resources+' ficheiros':'')+'</div>'
        + '</div>';
    } else if(cd.configured){
      html += '<div class="qcard'+(cd.error?' warn':'')+'">'
        + '<div class="qt">Cloudinary · Portfólio + Seleção</div>'
        + '<div class="qbig">ligado</div>'
        + '<div class="qmeta">'+(cd.error ? "uso não disponível ("+esc(cd.error)+")" : "uso a carregar…")+'</div>'
        + '</div>';
    } else {
      html += '<div class="qcard warn">'
        + '<div class="qt">Cloudinary · Portfólio + Seleção</div>'
        + '<div class="qbig">não ligado</div>'
        + '<div class="qmeta">Falta pôr as 3 variáveis CLOUDINARY_* no Pages.</div>'
        + '</div>';
    }

    /* 3 — links ativos + distribuição */
    var T = pg.total || 0;
    var seg = { proposta:byT.proposta||0, galeria:byT.galeria||0, portfolio:byT.portfolio||0, triagem:byT.triagem||0 };
    function w(n){ return T ? (n / T * 100).toFixed(1) : 0; }
    html += '<div class="qcard">'
      + '<div class="qt">Links ativos</div>'
      + '<div class="qbig">'+T+' <small>no total</small></div>'
      + '<div class="qbar">'
      +   '<i class="s-prop" style="width:'+w(seg.proposta)+'%"></i>'
      +   '<i class="s-ent" style="width:'+w(seg.galeria)+'%"></i>'
      +   '<i class="s-pf" style="width:'+w(seg.portfolio)+'%"></i>'
      +   '<i class="s-sel" style="width:'+w(seg.triagem)+'%"></i>'
      + '</div>'
      + '<div class="qlegend">'
      +   '<span><i class="s-prop"></i>Propostas '+seg.proposta+'</span>'
      +   '<span><i class="s-ent"></i>Entregas '+seg.galeria+'</span>'
      +   '<span><i class="s-pf"></i>Portfólio '+seg.portfolio+'</span>'
      +   '<span><i class="s-sel"></i>Seleções '+seg.triagem+'</span>'
      + '</div>'
      + '</div>';

    /* 4 — a expirar */
    var acls = expN ? "bad" : (soonN ? "warn" : "");
    var body = "";
    if(expN || soonN){
      pg.expired.forEach(function(x){ body += '<div><span class="g">✕</span> '+esc(x.code)+' expirou em '+x.expira+'</div>'; });
      pg.soon.forEach(function(x){ body += '<div><span class="s">!</span> '+esc(x.code)+' expira em '+x.dias+' dia'+(x.dias===1?'':'s')+'</div>'; });
    } else {

      + '<div class="qt">A expirar</div>'

    dash.innerHTML = html;

    var strip = dash.nextElementSibling;

  }).catch(function(){
    dash.innerHTML = '<div class="qcard bad"><div class="qt">Estado</div><div class="qmeta">erro ao ler o painel</div></div>';
  });
}

/* ---------- card de link ---------- */
function pageCard(p){
  var now = new Date();
  var expDate = p.expira ? new Date(p.expira + "T23:59:59") : null;
  var expirado = expDate && expDate < now;
  var restam = expDate ? daysBetween(expDate, now) : null;
  var it = el("div","mkitem");

  it.appendChild(Object.assign(el("div","code"), { textContent: p.code }));
  it.appendChild(Object.assign(el("div","nm"), { textContent: p.cliente || p.titulo || "—" }));
  if(p.titulo && p.cliente) it.appendChild(Object.assign(el("div","ti"), { textContent: p.titulo }));

  var chip;
  if(!p.expira) chip = el("span","chip perm", '<span class="d"></span>permanente');
  else if(expirado) chip = el("span","chip gone", '<span class="d"></span>expirou ' + p.expira);
  else if(restam <= 14) chip = el("span","chip soon", '<span class="d"></span>' + restam + 'd — ' + p.expira);
  else chip = el("span","chip", 'até ' + p.expira + ' (' + restam + 'd)');
  it.appendChild(chip);

  var mb = el("button","menu-btn", "&#8942;"); mb.setAttribute("aria-label","Ações");
  mb.onclick = function(e){ e.stopPropagation(); buildCardMenu(mb, p, expirado, expDate); };
  it.appendChild(mb);
  return it;
}

function buildCardMenu(anchor, p, expirado, expDate){
  var items = [
    { head: p.code },
    { label: "Abrir link", href: "/" + p.code },
    { label: "Copiar link", onClick: function(){ copyLink(p.code); } },
    { label: "Editar", onClick: function(){ editView(p.code); } },
    { sep: true },
    { head: "Prazo" }
  ];
  if(p.expira){
    items.push({ label: "Estender +30 dias", onClick: function(){ extendExpira(p.code, 30, expirado, expDate); } });
    items.push({ label: "Estender +90 dias", onClick: function(){ extendExpira(p.code, 90, expirado, expDate); } });
    items.push({ label: "Definir data…",     onClick: function(){ pickExpira(p); } });
    items.push({ label: "Tornar permanente", onClick: function(){ setExpira(p.code, ""); } });
  } else {
    items.push({ label: "Definir prazo…", onClick: function(){ pickExpira(p); } });
  }
  items.push({ sep: true });
  items.push({ label: "Excluir link", danger: true, onClick: function(){ askDeletePage(p); } });
  openMenu(anchor, items);
}
function extendExpira(code, days, expirado, expDate){
  var base = expirado ? new Date() : expDate;
  var nd = new Date(base.getTime() + days * 86400000);
  setExpira(code, nd.toISOString().slice(0, 10));
}
function pickExpira(p){
  promptModal({
    title: "Data de expiração",
    message: "O link " + (p.cliente || p.titulo || p.code) + " deixa de funcionar depois desta data.",
    label: "Data (AAAA-MM-DD)", type: "date", value: p.expira || "",
    ok: "Guardar",
    validate: function(v){ return /^\d{4}-\d{2}-\d{2}$/.test(v) ? "" : "Escolhe uma data."; }
  }).then(function(v){ if(v) setExpira(p.code, v); });
}
function askDeletePage(p){
  confirmModal({
    title: "Excluir " + p.code + "?",

var LIB_CACHE = null, LIB_TAB = "r2";
function loadLib(force){
  if(LIB_CACHE && !force) return Promise.resolve(LIB_CACHE);
  return api("GET","media").then(function(r){ LIB_CACHE = r.ok ? r.j : null; return LIB_CACHE; });
}
function allFolders(lib){
  if(!lib) return [];
  return [].concat((lib.r2 && lib.r2.folders) || [], (lib.cloudinary && lib.cloudinary.folders) || []);
}
function libraryView(){
  closeMenu();
  var v = $("#view"); v.innerHTML = "";
  v.appendChild(navBar("biblioteca"));

  var drop = el("div","lib-drop");
  drop.innerHTML = '<b>Arrasta ficheiros para aqui</b><button id="lib-pickfolder" style="color:var(--gold);background:none;border:0;text-decoration:underline">escolher uma pasta</button> · <button id="lib-pickfiles" style="color:var(--gold);background:none;border:0;text-decoration:underline">escolher ficheiros</button>';
  v.appendChild(drop);

  var body = el("div"); v.appendChild(body);
  body.innerHTML = '<div class="lib-empty">a carregar…</div>';

  var fdir = el("input"); fdir.type = "file"; fdir.multiple = true; fdir.setAttribute("webkitdirectory",""); fdir.style.display = "none"; v.appendChild(fdir);
  var ffil = el("input"); ffil.type = "file"; ffil.multiple = true; ffil.style.display = "none"; v.appendChild(ffil);
  drop.querySelector("#lib-pickfolder").onclick = function(){ fdir.click(); };
  drop.querySelector("#lib-pickfiles").onclick = function(){ ffil.click(); };
  function fromInput(inp){
    var files = [].slice.call(inp.files);
    if(!files.length) return;
    var hint = files[0].webkitRelativePath ? files[0].webkitRelativePath.split("/")[0] : "";
    startFolderUpload(files, hint);
    inp.value = "";
  }
  fdir.onchange = function(){ fromInput(fdir); };
  ffil.onchange = function(){ fromInput(ffil); };

  ["dragenter","dragover"].forEach(function(e){ drop.addEventListener(e, function(ev){ ev.preventDefault(); drop.classList.add("over"); }); });
  ["dragleave","drop"].forEach(function(e){ drop.addEventListener(e, function(ev){ ev.preventDefault(); drop.classList.remove("over"); }); });
  drop.addEventListener("drop", function(ev){
    var files = [].slice.call(ev.dataTransfer.files || []);
    if(files.length) startFolderUpload(files, guessName(ev.dataTransfer));
  });

  var subtabs = el("div","lib-subtabs"); v.appendChild(subtabs);

  loadLib(true).then(function(lib){
    body.innerHTML = "";
    if(!lib){ body.innerHTML = '<div class="lib-empty">Nenhuma nuvem ligada.</div>'; return; }
    var clouds = [
      { key:"r2", label:"R2 · Entregas", data: lib.r2 },
      { key:"cloudinary", label:"Cloudinary · Portfólio + Seleção", data: lib.cloudinary }
    ];
    function show(key){
      LIB_TAB = key;
      subtabs.querySelectorAll("button").forEach(function(b){ b.classList.toggle("on", b.dataset.k === key); });
      var cl = clouds.filter(function(c){ return c.key === key; })[0].data;
      body.innerHTML = "";
      if(!cl || (!cl.bound && !cl.configured)){ body.appendChild(el("div","lib-empty","Esta nuvem não está ligada.")); return; }
      if(cl.error) body.appendChild(el("div","lib-empty","aviso: " + esc(cl.error)));
      var folders = cl.folders || [];
      if(!folders.length){ body.appendChild(el("div","lib-empty","Ainda sem pastas. Envia ficheiros acima.")); return; }
      var grid = el("div","lib-grid"); body.appendChild(grid);
      folders.forEach(function(f){ grid.appendChild(libFolderCard(f)); });
    }
    clouds.forEach(function(c){
      var b = el("button","", c.label + "  " + (((c.data && c.data.folders) || []).length));
      b.dataset.k = c.key;
      b.onclick = function(){ closeMenu(); show(c.key); };

function guessName(dt){
  try{ if(dt.items && dt.items[0]){ var e = dt.items[0].webkitGetAsEntry && dt.items[0].webkitGetAsEntry(); if(e && e.isDirectory) return e.name; } }catch(e){}
  return "";
}
function folderLink(f){

}
function libFolderCard(f){

    ];

          .then(function(yes){ if(yes) api("DELETE","media/r2-folder/"+f.name.split("/").map(encodeURIComponent).join("/")).then(function(){ LIB_CACHE=null; libraryView(); }); });
      } });

function startFolderUpload(files, nameHint){
  // 1 pergunta: nome + tipo
  modal(function(box, close){
    box.innerHTML =
      '<h4>Enviar ' + files.length + ' ficheiro' + (files.length===1?"":"s") + '</h4>'
      + '<div class="field"><label>Nome da pasta</label><input id="fu-name" value="' + esc(nameHint || "") + '" placeholder="ex. everton-institucional"></div>'
      + '<label style="margin-top:12px">Para que é</label><div class="radio-row" id="fu-kind">'
      +   '<label data-k="entregas">Entrega</label><label data-k="selecao">Seleção</label><label data-k="portfolio">Portfólio</label>'
      + '</div>'
      + '<div class="err" id="fu-err"></div>'
      + '<div id="fu-prog" style="font-size:11px;color:var(--dim);margin-top:10px"></div>'
      + '<div class="mrow"><button class="btn ghost" id="fu-cancel">Cancelar</button><button class="btn gold" id="fu-ok">Enviar</button></div>';
    var kind = "entregas";
    box.querySelectorAll("#fu-kind label").forEach(function(l){
      l.onclick = function(){ kind = l.dataset.k; box.querySelectorAll("#fu-kind label").forEach(function(x){ x.classList.toggle("on", x === l); }); };
    });
    box.querySelector("#fu-kind label").classList.add("on");
    box.querySelector("#fu-cancel").onclick = function(){ close(); };
    box.querySelector("#fu-ok").onclick = function(){
      var name = box.querySelector("#fu-name").value.trim().toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
      if(!name){ box.querySelector("#fu-err").textContent = "Dá um nome à pasta."; return; }
      var dest = kind === "entregas" ? "r2" : "cloudinary";
      var folder = kind + "/" + name;
      var ok = box.querySelector("#fu-ok"); ok.disabled = true;
      var prog = box.querySelector("#fu-prog");
      uploadFiles(files, folder, dest, function(n, total){ prog.textContent = "a enviar " + n + " / " + total + "…"; })
        .then(function(res){
          prog.textContent = "";
          close();
          toast(res.ok + " enviados" + (res.fail ? " · " + res.fail + " falharam" : ""));
          LIB_CACHE = null; libraryView();
        });
    };
    box.querySelector("#fu-name").focus();
  }, { cls: "lg" });
}
function uploadFiles(files, folder, dest, onProgress){
  return new Promise(function(resolve){
    var ok = 0, fail = 0, i = 0;
    function next(){
      if(i >= files.length){ resolve({ ok: ok, fail: fail }); return; }
      var fd = new FormData();
      fd.append("file", files[i]);
      fd.append("folder", folder);
      fd.append("dest", dest);
      fetch("/api/upload", { method:"POST", body:fd })
        .then(function(x){ return x.json(); })
        .then(function(j){ if(j.url) ok++; else fail++; })
        .catch(function(){ fail++; })
        .then(function(){ i++; onProgress && onProgress(i, files.length); next(); });
    }
    next();
  });
}
function pickFolderModal(){
  return modal(function(box, close){
    box.innerHTML = '<h4>Pasta da biblioteca</h4><p>Os itens da página são preenchidos com os ficheiros desta pasta.</p><div id="pf-list" style="margin-top:12px"><div class="lib-empty">a carregar…</div></div>';
    loadLib().then(function(lib){
      var wrap = box.querySelector("#pf-list");
      var fs = allFolders(lib);
      if(!fs.length){ wrap.innerHTML = '<div class="lib-empty">Sem pastas. Envia ficheiros na aba Biblioteca primeiro.</div>'; return; }
      wrap.innerHTML = "";
      fs.forEach(function(f){
        var b = el("button","np-fromlib", "" + f.name + "  ·  " + f.count + " ficheiros  ·  " + (f.cloud === "r2" ? "R2" : "Cloudinary"));
        b.style.marginTop = "6px";
        b.onclick = function(){ close(f); };
        wrap.appendChild(b);
      });
    });
  }, { cls: "lg" });
}

/* ---------- widget lista de imagens ---------- */
function imageList(host, arr, refresh){
  host.innerHTML = "";
  var g = el("div","imgs");
  arr.forEach(function(it, i){
    var cell = el("div","imgc");
    var src = it.thumb || it.src;
    cell.innerHTML = (it.tipo==="video" || isVid(src))
      ? '<video src="'+src+'" muted></video>'
      : '<img src="'+src+'" alt="">';
    var x = el("button","x","×"); x.onclick = function(){ arr.splice(i,1); refresh(); };
    var mv = el("div","mv");
    var lft = el("button",null,"‹"); lft.onclick = function(){ if(i>0){ var t=arr[i-1]; arr[i-1]=arr[i]; arr[i]=t; refresh(); } };
    var rgt = el("button",null,"›"); rgt.onclick = function(){ if(i<arr.length-1){ var t=arr[i+1]; arr[i+1]=arr[i]; arr[i]=t; refresh(); } };
    mv.appendChild(lft); mv.appendChild(rgt);
    cell.appendChild(x); cell.appendChild(mv);
    g.appendChild(cell);
  });
  host.appendChild(g);

  var ta = textareaEl("_urls", "");
  ta.placeholder = "Colar links (um por linha) e clicar Adicionar";
  ta.style.marginTop = "10px";
  host.appendChild(ta);
  var addBtn = el("button","btn sm","+ Adicionar links"); addBtn.style.marginTop = "6px";
  addBtn.onclick = function(){
    linesToArr(ta.value).forEach(function(u){
      arr.push({ src:u, tipo: isVid(u) ? "video" : "foto" });
    });
    refresh();
  };
  host.appendChild(addBtn);

  var drop = el("div","drop","ou arrasta ficheiros para aqui (sobem para a nuvem)");
  host.appendChild(drop);
  ["dragover","dragenter"].forEach(function(ev){ drop.addEventListener(ev, function(e){ e.preventDefault(); drop.classList.add("over"); }); });
  ["dragleave","drop"].forEach(function(ev){ drop.addEventListener(ev, function(e){ e.preventDefault(); drop.classList.remove("over"); }); });
  drop.addEventListener("drop", function(e){
    var files = [].slice.call(e.dataTransfer.files);
    if(!files.length) return;
    drop.textContent = "a enviar… 0/"+files.length;
    uploadMany(files, function(done,total){ drop.textContent = "a enviar… "+done+"/"+total; }, function(urls){
      urls.forEach(function(u){ arr.push({ src:u, tipo: isVid(u) ? "video" : "foto" }); });
      refresh();
    });
  });
}

function uploadMany(files, prog, done){
  var out = [], n = 0, folder = "media/" + (CUR && CUR.code ? CUR.code : "geral");
  // entregas -> R2 (downloads grátis) ; portfólio / seleção / proposta -> Cloudinary (otimização)
  var dest = (CUR && CUR.data && CUR.data.type === "galeria" && CUR.data.anon !== true) ? "r2" : "cloudinary";
  function one(k){
    if(k >= files.length){ done(out); return; }
    var fd = new FormData();
    fd.append("file", files[k]);
    fd.append("folder", folder);
    fd.append("dest", dest);
    fetch("/api/upload", { method:"POST", body:fd })
      .then(function(x){ return x.json(); })
      .then(function(j){
        if(j.url) out.push(j.url);
        else if(k === 0 && !out.length) noticeModal("Upload indisponível", (j.error || "") + " Por agora, cola o URL de cada ficheiro.");
        n++; prog(n, files.length); one(k+1);
      })
      .catch(function(){ n++; prog(n, files.length); one(k+1); });
  }
  one(0);
}

  if(s.tipo === "cards"){
    var rr = el("div","row");
    rr.appendChild(fieldEl("Modo", bind(selectEl("_cm", s.modo||"grelha", [["grelha","Grelha"],["carrossel","Carrossel"]]), function(v){ s.modo=v; })));
    rr.appendChild(fieldEl("Colunas (grelha)", bind(inputEl("_cc", s.colunas||3, { type:"number" }), function(v){ s.colunas=parseInt(v)||3; })));
    sb.appendChild(rr);
    s.cards = s.cards || [];
    var cl = el("div"); sb.appendChild(cl);
    function drawCards(){
      cl.innerHTML = "";
      s.cards.forEach(function(cd, ci){ cl.appendChild(cardEditor(cd, ci, s.cards, drawCards)); });
      var ab = el("button","btn sm","+ Card"); ab.onclick=function(){ s.cards.push({ titulo:"", linhas:[] }); drawCards(); };
      cl.appendChild(ab);
    }
    drawCards();
  }
  return wrap;
}

function cardEditor(cd, i, arr, draw){
  var w = el("div","cardrow");
  var top = el("div","cr-top");
  var t = bind(inputEl("_ct", cd.titulo||""), function(v){ cd.titulo=v; }); t.placeholder="Título";
  var tg = el("div","grow"); tg.appendChild(t);
  var up = el("button","btn ghost sm","▲"); up.onclick=function(){ if(i>0){ var x=arr[i-1];arr[i-1]=arr[i];arr[i]=x;draw(); } };
  var dn = el("button","btn ghost sm","▼"); dn.onclick=function(){ if(i<arr.length-1){ var x=arr[i+1];arr[i+1]=arr[i];arr[i]=x;draw(); } };
  var rm = el("button","btn ghost sm","✕"); rm.onclick=function(){ arr.splice(i,1); draw(); };
  top.appendChild(tg); top.appendChild(up); top.appendChild(dn); top.appendChild(rm);
  w.appendChild(top);

  var r1 = el("div","row");
  r1.appendChild(fieldEl("Ícone", bind(selectEl("_ci", cd.icone||"", [["","(nenhum)"]].concat(ICON_KEYS.map(function(k){return [k,k];}))), function(v){ cd.icone=v||undefined; })));
  r1.appendChild(fieldEl("Preço", bind(inputEl("_cp", cd.preco||""), function(v){ cd.preco=v||undefined; })));
  var cor = bind(inputEl("_cor", cd.cor||"#C9A166", { type:"color" }), function(v){ cd.cor = v==="#c9a166"||v==="#C9A166" ? undefined : v; });
  r1.appendChild(fieldEl("Cor de destaque", cor));
  w.appendChild(r1);

  w.appendChild(fieldEl("Imagem (url)", bind(inputEl("_cim", cd.img||""), function(v){ cd.img=v||undefined; })));
  w.appendChild(fieldEl("Resumo (uma linha)", bind(inputEl("_cr", cd.resumo||""), function(v){ cd.resumo=v||undefined; })));
  var ln = textareaEl("_cl", (cd.linhas||[]).join("\n")); ln.placeholder = "O que inclui, um por linha (linhas em branco são ignoradas)";
  w.appendChild(fieldEl("Linhas", bindList(ln, function(a){ cd.linhas = a; })));
  cd.linhas = linesToArr(ln.value);
  var dh = el("label","check"); dh.innerHTML = '<input type="checkbox"'+(cd.destaque?" checked":"")+'> Destaque (com etiqueta)';
  dh.querySelector("input").addEventListener("change", function(){ cd.destaque = this.checked || undefined; });
  w.appendChild(dh);
  return w;
}

/* ============================ guardar ============================ */
function collectBase(){
  var d = CUR.data;
  d.type = $("#f-type").value;
  d.cliente = $("#f-cliente").value.trim();
  d.titulo = $("#f-titulo").value.trim();
  d.expira = $("#f-expira").value || undefined;
  d.intro = $("#f-intro").value.trim() || undefined;
  d.anon = $("#f-anon").checked || undefined;
  if(d.type === "triagem"){
    var ins = $("#f-instrucoes"); if(ins) d.instrucoes = ins.value.trim() || undefined;
    var fs = $("#f-formspree"); if(fs) d.formspree = fs.value.trim() || undefined;
  }
  if(d.type === "galeria"){
    var dz = $("#f-downloadTudo"); if(dz) d.downloadTudo = dz.value.trim() || undefined;
  }
  if(d.type === "proposta"){
    var val = $("#f-validade"); if(val) d.proposta.validade = val.value.trim() || undefined;
    // limpar campos internos _para/_bul
    (d.proposta.secoes||[]).forEach(function(s){ delete s._para; delete s._bul; });
    delete d.itens; delete d.instrucoes; delete d.formspree; delete d.downloadTudo;
  } else {
    delete d.proposta;
  }
  return d;
}
function doSave(){
  var msg = $("#saveMsg"); msg.className = "msg"; msg.textContent = "a guardar…";
  var d = collectBase();
  var code = CUR.isNew ? ($("#f-code").value.trim().toUpperCase() || CUR.code) : CUR.code;
  if(!/^[A-Z0-9_-]{3,32}$/.test(code)){ msg.className="msg bad"; msg.textContent="código inválido"; return; }
  api("PUT","pages/"+code, d).then(function(r){
    if(r.ok){
      CUR.code = code; CUR.isNew = false;
      msg.className = "msg ok"; msg.textContent = "guardado ✓  ·  asteris.pt/"+code;
    } else {
      msg.className = "msg bad"; msg.textContent = (r.j && r.j.error) || "erro";
    }
  });
}

/* ============================ campos ============================ */
function fieldEl(label, control){ var f = el("div","field"); f.appendChild(el("label",null,label)); f.appendChild(control); return f; }
function inputEl(name, val, o){ o=o||{}; var i=el("input"); i.id="f-"+name; if(o.cls)i.className=o.cls; i.type=o.type||"text"; if(o.disabled)i.disabled=true; i.value=(val==null?"":val); return i; }
function textareaEl(name, val){ var t=el("textarea"); t.id="f-"+name; t.value=(val==null?"":val); return t; }
function selectEl(name, val, opts){ var s=el("select"); s.id="f-"+name; opts.forEach(function(o){ var op=el("option"); op.value=o[0]; op.textContent=o[1]; if(o[0]===val)op.selected=true; s.appendChild(op); }); return s; }
function bind(node, fn){ var ev = node.tagName==="SELECT" ? "change" : "input"; node.addEventListener(ev, function(){ fn(node.value); }); return node; }
</script>
