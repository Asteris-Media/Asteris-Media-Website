<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Asteris — Systems</title>
<link rel="manifest" href="/admin/manifest.webmanifest">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Asteris">
<link rel="apple-touch-icon" href="/assets/logos/asteris.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#000000; --panel:#0E0E0E; --panel2:#161616; --edge:rgba(255,255,255,.07); --edge2:rgba(255,255,255,.14);
  --ink:#F5F5F5; --dim:#BDBDBD; --faint:#9E9E9E;
  --gold:#F2F2F2; --gold-lo:rgba(255,255,255,.08);
  --pos:#DADADA; --neg:#FF7A6B; --warn:#C6C6C6;
  --c0:#F2F2F2; --c1:#D2D2D2; --c2:#B0B0B0; --c3:#9A9A9A; --c4:#7E7E7E; --c5:#5A5A5A;
  --sans:"Hanken Grotesk",system-ui,sans-serif; --mono:"Space Mono",monospace;
}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55;-webkit-font-smoothing:antialiased;font-size:15px;letter-spacing:-.005em}
a{color:var(--ink)}
button{font-family:var(--sans);cursor:pointer}
input,select,textarea{font-family:var(--sans);font-size:14.5px;background:var(--panel2);border:1px solid var(--edge2);color:var(--ink);padding:9px 11px;border-radius:4px;width:100%}
input:focus,select,textarea:focus{outline:1px solid var(--ink);border-color:var(--ink)}
textarea{resize:vertical;min-height:64px;line-height:1.6}
label{display:block;font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);margin:0 0 5px}
.mono{font-family:var(--mono)}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row > *{flex:1;min-width:180px}

.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--edge2);background:var(--panel);color:var(--ink);padding:9px 15px;border-radius:4px;font-size:13.5px;font-weight:600}
.btn svg{width:14px;height:14px;flex-shrink:0}
.btn:hover{border-color:var(--ink)}
.btn.gold{background:var(--ink);color:#000;border-color:var(--ink)}
.btn.gold:hover{opacity:.88}
.btn.sm{padding:6px 10px;font-size:12.5px}
.btn.danger{border-color:rgba(255,107,92,.5);color:var(--neg)}
.btn.danger:hover{background:var(--neg);color:#fff;border-color:var(--neg)}
.btn.ghost{border-color:var(--edge2);background:var(--panel);color:var(--dim);padding:8px 12px}
.btn.ghost:hover{color:var(--ink);border-color:var(--ink)}
.btn.ghost.sm{padding:5px 8px}
/* botão de voltar — sempre com forma */
.btn.back{margin-bottom:14px}

/* ===== LAYOUT: appbar + sidebar + main ===== */
#app{display:grid;grid-template-columns:230px 1fr;grid-template-rows:56px 1fr;min-height:100vh}
@media(min-width:861px){#app{height:100vh;overflow:hidden}}
@media(max-width:860px){#app{grid-template-columns:1fr}}
@media(min-width:861px){#app.editing .side{display:none}}
@media(min-width:861px){#app.editing{grid-template-columns:1fr}}

/* barra do topo (linha contínua com o rótulo, pesquisa e sino) */
.appbar{grid-column:1 / -1;display:grid;grid-template-columns:230px 1fr auto;align-items:center;border-bottom:1px solid var(--edge);position:sticky;top:0;background:rgba(12,12,12,.62);backdrop-filter:blur(22px) saturate(1.5);-webkit-backdrop-filter:blur(22px) saturate(1.5);z-index:12;height:56px}
.ab-burger{display:none;width:48px;height:100%;border:0;border-right:1px solid var(--edge);background:none;color:var(--dim);align-items:center;justify-content:center}
.ab-burger svg{width:19px;height:19px}
.ab-burger:hover{color:var(--ink)}
@media(max-width:860px){
  .appbar{grid-template-columns:auto auto 1fr auto}
  .ab-burger{display:flex}
  .appbar .ab-brand span{display:none}
  .appbar .ab-brand{padding:0 12px}
  .ab-search input::placeholder{color:transparent}
}
.appbar .ab-brand{display:flex;align-items:center;gap:9px;padding:0 18px;height:100%;border-right:1px solid var(--edge)}
.appbar .ab-brand img{height:15px;width:auto}
.appbar .ab-brand b{font-size:13.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase}
.appbar .ab-brand span{font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--faint)}
.ab-search{position:relative;display:flex;align-items:center;gap:8px;padding:0 16px;height:100%}
.ab-search svg{width:15px;height:15px;color:var(--faint);flex-shrink:0}
.ab-search input{background:none;border:0;padding:0;font-size:14px;color:var(--ink);width:100%;border-radius:0}
.ab-search input:focus{outline:0}
.ab-search input::placeholder{color:var(--faint)}
.ab-bell{position:relative;width:56px;height:100%;border:0;border-left:1px solid var(--edge);background:none;color:var(--dim);display:flex;align-items:center;justify-content:center}
.ab-bell svg{width:17px;height:17px}
.ab-bell:hover,.ab-bell.on{color:var(--ink);background:var(--panel)}
.bell-dot{position:absolute;top:15px;right:16px;width:7px;height:7px;border-radius:50%;background:var(--neg);border:1.5px solid #000}

.search-results{position:absolute;top:calc(100% + 1px);left:0;right:0;background:rgba(18,18,18,.82);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--edge2);border-radius:0 0 4px 4px;box-shadow:0 24px 60px rgba(0,0,0,.6);max-height:60vh;overflow-y:auto;padding:6px}
.search-results .sr-group{font-size:9.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);padding:9px 10px 4px}
.search-results button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;color:var(--ink);font-size:13.5px;padding:8px 10px;border-radius:4px}
.search-results button:hover{background:var(--panel2)}
.search-results button .sr-tag{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--faint)}
.search-results .sr-empty{color:var(--faint);font-size:12.5px;padding:14px 10px;text-align:center}

.side{background:var(--bg);border-right:1px solid var(--edge);display:flex;flex-direction:column;padding:16px 0 0;position:sticky;top:56px;height:calc(100vh - 56px)}
.side-scrim{position:fixed;inset:0;z-index:38;background:rgba(0,0,0,.5)}
@media(max-width:860px){
  .side{position:fixed;left:0;top:56px;bottom:0;width:256px;z-index:39;border-right:1px solid var(--edge2);
    transform:translateX(-100%);transition:transform .25s cubic-bezier(.4,0,.2,1);
    background:rgba(12,12,12,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
  #app.nav-open .side{transform:translateX(0)}
}
@media(min-width:861px){.side-scrim{display:none!important}}
.side-create{margin:0 14px 12px;padding:11px;border:1px solid var(--edge2);background:var(--ink);color:#000;border-radius:4px;font-size:13.5px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:7px}
.side-create:hover{opacity:.9}
.side-nav{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px;padding:0 12px}
.side-nav .nav-group{font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);padding:14px 11px 5px}
.side-nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;color:var(--dim);font-size:14px;font-weight:500;padding:9px 11px;border-radius:4px;transition:background .15s,color .15s}
.side-nav button:hover{color:var(--ink);background:var(--panel)}
.side-nav button.on{color:var(--ink);background:var(--panel2)}
.side-nav button svg{width:15px;height:15px;flex-shrink:0;opacity:.85}
.side-nav button.on svg{opacity:1}
.side-nav button .cnt{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--faint)}
.side-nav button .badge{margin-left:auto;min-width:18px;height:18px;padding:0 5px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12px;font-weight:700;line-height:1;box-sizing:border-box}
.side-nav button .badge.red{background:#FF6B5C;color:#000}
.side-nav button .badge.amber{background:#E7B84B;color:#000}
.side-nav button .badge.mut{background:var(--panel2);color:var(--dim);border:1px solid var(--edge2)}
.side-nav button.on .badge.mut{background:var(--panel);color:var(--ink)}
.side-create svg{width:14px;height:14px;flex-shrink:0}
.side-foot{margin-top:auto;height:65px;padding:0 16px;border-top:1px solid var(--edge);display:flex;align-items:center;gap:10px}
.side-foot .who{flex:1;font-size:12.5px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-foot button{background:var(--panel2);border:1px solid var(--edge2);color:var(--ink);font-size:13.5px;font-weight:600;padding:9px 18px;border-radius:4px;display:flex;align-items:center;gap:8px}
.side-foot button svg{width:14px;height:14px}
.side-foot button:hover{border-color:var(--ink)}

.main{min-width:0;display:flex;flex-direction:column;overflow:hidden}
.page-head{flex-shrink:0;padding:20px clamp(16px,4vw,40px) 0}
.page-head h1{font-size:24px;font-weight:700;letter-spacing:-.025em;line-height:1}
#view{flex:1;overflow-y:auto;padding:20px clamp(16px,4vw,40px) 40px}
@media(max-width:860px){
  .main{overflow:visible}
  #view{overflow:visible}
  .page-head h1{font-size:21px}
}

.view-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.view-head .vh-sub{font-size:13.5px;color:var(--dim)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin-bottom:11px}

/* rodapé (igual ao do site: marca · copy · estrelinha com o registo) — linha alinhada com a do menu */
.adm-foot{flex-shrink:0;height:65px;display:flex;align-items:center;gap:12px;padding:0 clamp(16px,4vw,40px);border-top:1px solid var(--edge)}
.adm-foot .af-brand{display:flex;align-items:center;gap:9px;font-size:12px;font-weight:500;letter-spacing:.32em;text-transform:uppercase;color:var(--faint)}
.adm-foot .af-brand img{height:13px;width:auto;opacity:.6}
.adm-foot .af-copy{flex:1;text-align:center;font-size:10px;color:var(--faint);letter-spacing:.06em}
.adm-foot .af-end{display:flex;align-items:center}
.adm-foot .af-logs{font-family:inherit;font-size:15px;line-height:1;color:var(--dim);background:none;border:0;padding:4px;cursor:pointer;transition:color .15s,transform .15s}
.adm-foot .af-logs:hover{color:var(--ink);transform:rotate(90deg)}

/* painel de notificações — vidro escuro translúcido, desliza da direita */
.notif-scrim{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.4)}
.notif-panel{position:fixed;top:0;right:0;bottom:0;width:min(360px,88vw);z-index:71;
  background:rgba(14,14,14,.72);backdrop-filter:blur(22px) saturate(1.5);-webkit-backdrop-filter:blur(22px) saturate(1.5);
  border-left:1px solid var(--edge2);box-shadow:-30px 0 80px rgba(0,0,0,.55);display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .28s cubic-bezier(.4,0,.2,1)}
.notif-panel.open{transform:translateX(0)}
.notif-panel .np-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--edge)}
.notif-panel .np-head b{font-size:14.5px;font-weight:700;letter-spacing:-.01em}
.notif-panel .np-head button{background:none;border:0;color:var(--faint);font-size:20px;line-height:1}
.notif-panel .np-head button:hover{color:var(--ink)}
.notif-panel .np-body{flex:1;overflow-y:auto;padding:8px}
.notif-panel .np-foot{flex-shrink:0;padding:10px 12px;border-top:1px solid var(--edge)}
.notif-panel .np-foot button{width:100%;background:none;border:1px solid var(--edge2);color:var(--dim);font-size:13px;font-weight:600;padding:9px;border-radius:4px}
.notif-panel .np-foot button:hover{color:var(--ink);border-color:var(--ink)}
.notif-panel .np-foot button:disabled{opacity:.4;pointer-events:none}
.notif-item{display:flex;gap:11px;padding:12px 12px;border-radius:4px;cursor:pointer}
.notif-item:hover{background:rgba(255,255,255,.05)}
.notif-item .ni-dot{width:7px;height:7px;border-radius:50%;background:var(--c3);margin-top:5px;flex-shrink:0}
.notif-item.urgent .ni-dot{background:var(--neg)}
.notif-item.warn .ni-dot{background:var(--c0)}
.notif-item .ni-body{flex:1;min-width:0}
.notif-item .ni-t{font-size:14px;font-weight:600;line-height:1.35}
.notif-item .ni-sub{font-size:12.5px;color:var(--faint);margin-top:2px}
.notif-empty{color:var(--faint);font-size:13px;text-align:center;padding:40px 20px}

/* ============================================================
   SISTEMA DE CARTÕES — tamanhos fixos, chips padronizados
   ============================================================ */
/* -- chip único: sempre 22px de altura -- */
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 11px;font-size:11.5px;font-weight:600;letter-spacing:.01em;border-radius:13px;border:1px solid var(--edge2);color:var(--dim);white-space:nowrap;max-width:200px;flex-shrink:0;box-sizing:border-box}
.chip > span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip svg{width:12px;height:12px;flex-shrink:0;opacity:.9}
.chip.date{font-family:var(--mono);font-size:11px;font-variant-numeric:tabular-nums}
.chip.date.soon{color:#E7B84B;border-color:rgba(231,184,75,.55);background:rgba(231,184,75,.12)}
.chip.date.over{color:#FF6B5C;border-color:rgba(255,107,92,.6);background:rgba(255,107,92,.14)}
.chip.ok{color:#5FBE82;border-color:rgba(95,190,130,.5);background:rgba(95,190,130,.1)}
.chip.warn{color:#E7B84B;border-color:rgba(231,184,75,.5);background:rgba(231,184,75,.1)}
.chip.bad{color:#FF6B5C;border-color:rgba(255,107,92,.55);background:rgba(255,107,92,.12)}
/* -- chip circular só com ícone (etiqueta / privado / partilhado) -- */
.itag{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;border:1px solid var(--edge2);color:var(--dim);flex-shrink:0;cursor:default}
.itag svg{width:13px;height:13px}
.chip.on{color:var(--ink);border-color:var(--ink);background:var(--gold-lo)}
.filter-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.filter-row .chip{cursor:pointer;height:30px;font-size:12px}
.cc-files{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.cc-files a{font-size:12.5px;color:var(--dim);border:1px solid var(--edge2);border-radius:4px;padding:5px 9px;text-decoration:none;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc-files a:hover{color:var(--ink);border-color:var(--ink)}
.radio-row label svg{width:13px;height:13px;vertical-align:-2px;margin-right:5px}
.scope-tabs button svg{width:12px;height:12px;vertical-align:-2px;margin-right:4px}
.pag-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
@media(max-width:640px){.pag-sum{grid-template-columns:1fr}}
.pag-card{background:var(--panel);border:1px solid var(--edge);border-radius:4px;padding:16px 18px}
.pag-card.bad{border-color:rgba(255,107,92,.4)}
.pag-card .pc-l{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-bottom:9px}
.pag-card .pc-v{font-size:20px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.pag-card.bad .pc-v{color:#FF7A6B}

/* -- barra inferior comum a TODOS os cartões -- */
.cbar{display:flex;align-items:center;gap:8px;min-height:26px}
.cbar .cb-l{display:flex;align-items:center;gap:14px;font-size:12.5px;color:var(--dim);font-family:var(--mono)}
.cbar .cb-l span{display:inline-flex;align-items:center;gap:4px}
.cbar .cb-l svg{width:12px;height:12px;opacity:.65;flex-shrink:0}
.cbar .cb-r{margin-left:auto;display:flex;align-items:center;gap:6px}

/* segmentado partilhado / privado */
.scope-tabs{display:inline-flex;border:1px solid var(--edge2);border-radius:4px;overflow:hidden}
.scope-tabs button{background:none;border:0;color:var(--dim);font-size:12.5px;font-weight:600;padding:7px 13px}
.scope-tabs button+button{border-left:1px solid var(--edge2)}
.scope-tabs button.on{background:var(--panel2);color:var(--ink)}

/* leitura de nota (markdown leve) */
.md-body{font-size:14.5px;line-height:1.75;color:var(--dim);white-space:pre-wrap;word-break:break-word}
.md-body h3{font-size:15px;font-weight:700;color:var(--ink);margin:16px 0 6px}
.md-body strong{color:var(--ink);font-weight:700}
.md-body a{color:var(--ink);text-decoration:underline}
.md-body ul{margin:6px 0 6px 18px;white-space:normal}
.md-body li{margin:3px 0}
.md-body em{font-style:italic;color:var(--ink)}
.md-body code{font-family:var(--mono);font-size:13px;background:var(--panel2);border:1px solid var(--edge);border-radius:3px;padding:1px 5px}

/* ---- cartões em grelha (workspaces / clientes / contratos) ---- */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.gcard{position:relative;background:var(--panel);border:1px solid var(--edge);border-radius:4px;padding:18px 18px 16px 20px;min-height:212px;display:flex;flex-direction:column;overflow:hidden;cursor:pointer}
.gcard:hover{border-color:var(--edge2)}
.gcard .g-bar{position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c5)}
.gcard .g-nm{font-weight:700;font-size:16px;letter-spacing:-.015em;line-height:1.3;padding-right:28px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gcard .g-body{flex:1;min-height:0;overflow:hidden;margin-top:10px}
.gcard .g-desc{font-size:13.5px;font-weight:500;color:var(--dim);line-height:1.6;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.gcard .g-rows{display:flex;flex-direction:column;gap:7px;font-size:13px;color:var(--dim)}
.gcard .g-rows b{color:var(--ink);font-weight:600}
.gcard .cbar{margin-top:14px;padding-top:13px;border-top:1px solid var(--edge)}
.gcard .menu-btn{position:absolute;top:13px;right:10px;width:26px;height:22px;border:1px solid transparent;background:none;color:var(--dim);font-size:16px;line-height:1;border-radius:4px;letter-spacing:1px}
.gcard .menu-btn:hover,.gcard .menu-btn.open{background:var(--panel2);border-color:var(--edge2);color:var(--ink)}

/* workspace — vista de detalhe */
.ws-head{border:1px solid var(--edge);border-left:3px solid var(--c5);border-radius:4px;padding:16px 18px;margin-bottom:18px;background:var(--panel)}
.ws-head .wh-t{font-size:19px;font-weight:700;letter-spacing:-.02em}
.ws-head .wh-desc{font-size:13.5px;color:var(--dim);margin-top:6px;line-height:1.6;white-space:pre-wrap}
.ws-head .wh-links{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;align-items:center}
.ws-head .wh-links a{display:inline-flex;align-items:center;gap:6px;height:26px;font-size:12px;color:var(--dim);border:1px solid var(--edge2);border-radius:11px;padding:0 10px;text-decoration:none;max-width:220px}
.ws-head .wh-links a > span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ws-head .wh-links a svg{width:11px;height:11px;flex-shrink:0;opacity:.7}
.ws-head .wh-links a:hover{color:var(--ink);border-color:var(--ink)}
.ws-sec-h{display:flex;align-items:center;justify-content:space-between;margin:22px 0 10px}
.ws-sec-h b{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.cor-pick{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.cor-pick button{width:26px;height:26px;border-radius:50%;border:2px solid transparent;padding:0;cursor:pointer}
.cor-pick button.on{border-color:var(--ink)}
.ico-pick{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:6px}
.ico-pick button{aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:var(--panel2);border:1px solid var(--edge2);border-radius:6px;color:var(--dim);padding:0}
.ico-pick button svg{width:15px;height:15px}
.ico-pick button:hover{color:var(--ink)}
.ico-pick button.on{border-color:var(--ink);color:var(--ink);background:var(--gold-lo)}

/* ===== painel — negócio ===== */
.fin-card{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:24px;background:var(--panel);border:1px solid var(--edge);border-radius:4px;padding:22px 26px;margin-bottom:16px}
@media(max-width:640px){.fin-card{grid-template-columns:1fr;text-align:center;gap:14px}}
.fin-col{display:flex;flex-direction:column;align-items:center;gap:9px}
.fin-ring{position:relative;width:104px;height:104px}
.fin-ring .ring-svg{width:100%;height:100%}
.fin-ring .fin-ring-c{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 8px}
.fin-ring .fin-ring-c b{font-size:15px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.fin-ring-l{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.fin-mid{text-align:center}
.fin-mid .fin-mid-l{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-bottom:8px}
.fin-mid .fin-mid-v{font-size:28px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.fin-mid .fin-mid-sub{font-size:12px;color:var(--dim);margin-top:6px}
.fin-mid .fin-mid-sub.bad{color:#FF7A6B}
.op-row{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:16px}
@media(max-width:900px){.op-row{grid-template-columns:repeat(3,1fr)}}
@media(max-width:480px){.op-row{grid-template-columns:repeat(2,1fr)}}
.op-item{background:var(--panel);border:1px solid var(--edge);border-radius:4px;padding:16px 14px;text-align:center}
.op-item .op-v{font-size:22px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.op-item .op-l{font-size:10.5px;color:var(--faint);margin-top:6px;line-height:1.4}
.dest-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
@media(max-width:900px){.dest-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.dest-grid{grid-template-columns:1fr}}
.dest-card{background:var(--panel);border:1px solid var(--edge);border-radius:4px;padding:16px 16px}
.dest-card .dest-l{font-size:9.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-bottom:10px}
.dest-card .dest-nm{font-size:14px;font-weight:700;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dest-card .dest-nm.empty{font-weight:400;font-style:italic;color:var(--faint)}
.dest-card .dest-v{font-size:12px;color:var(--dim);margin-top:4px;font-variant-numeric:tabular-nums}

/* ===== painel de estado / quotas ===== */
.dash-h{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:0 0 11px}
.dash{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:12px}
@media(max-width:1000px){
  .dash{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;margin:0 -4px 12px;padding:0 4px 4px}
  .dash::-webkit-scrollbar{display:none}
  .qcard{flex:0 0 76%;scroll-snap-align:center}
}
.qcard{background:var(--card,#0E0E0E);border:1px solid var(--edge);border-radius:4px;padding:16px;min-width:0}
.qcard.warn{border-color:var(--edge2)} .qcard.bad{border-color:rgba(255,107,92,.4)}
.qcard .qt{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-bottom:10px}
.qcard .qbig{font-size:20px;font-weight:700;line-height:1.15;letter-spacing:-.02em}
.qcard .qbig small{font-size:13px;font-weight:500;color:var(--dim)}
.qcard .qmeta{font-size:12.5px;color:var(--dim);margin-top:5px}
.qbar{height:7px;border-radius:4px;background:var(--panel2);overflow:hidden;margin-top:11px;display:flex}
.qbar > i{display:block;height:100%}
.qbar > i.f{background:var(--c0)} .qbar > i.f.warn{background:var(--c2)} .qbar > i.f.bad{background:var(--neg)}
.qbar .s-prop{background:var(--c1)}.qbar .s-ent{background:var(--c0)}.qbar .s-pf{background:var(--c3)}.qbar .s-sel{background:var(--c2)}
.qlegend{display:flex;flex-wrap:wrap;gap:9px;margin-top:9px;font-size:11.5px;color:var(--dim)}
.qlegend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:middle}
.qlegend .s-prop{background:var(--c1)}.qlegend .s-ent{background:var(--c0)}.qlegend .s-pf{background:var(--c3)}.qlegend .s-sel{background:var(--c2)}
.qexp{font-size:12.5px;line-height:1.75;margin-top:7px}
.qexp .g{color:var(--ink);font-weight:700} .qexp .s{color:var(--dim);font-weight:700}
.sysbar{display:flex;flex-wrap:wrap;gap:16px;font-size:12px;color:var(--faint);border-top:1px solid var(--edge);padding-top:11px;margin-bottom:24px}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;vertical-align:middle}
.dot.ok{background:var(--c1)} .dot.off{background:var(--faint)} .dot.bad{background:var(--neg)}

/* ===== listas de cartões (links, tarefas, notas, prospecção) ===== */
.card-list{display:flex;flex-direction:column;gap:10px}
.wgroup{margin-bottom:22px}
.wgroup > h2{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:0 0 10px}
.wgroup > h2 .cnt{font-family:var(--mono);color:var(--faint);margin-left:6px}
.wide-empty{color:var(--faint);font-size:13.5px;padding:22px 4px;border:1px dashed var(--edge2);border-radius:4px;text-align:center}

/* cartão de lista — grelha fixa: [lead] [conteúdo] [aside] / barra inferior */
.lcard{position:relative;background:var(--panel);border:1px solid var(--edge);border-radius:4px;min-height:92px;padding:14px 16px;
  display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:auto 1fr auto;column-gap:14px}
.lcard:hover{border-color:var(--edge2)}
.lcard.lc-prio{border-left:2px solid #FF6B5C}
.lcard .lc-lead{grid-column:1;grid-row:1 / 3;align-self:start;display:flex;align-items:flex-start}
.lcard .lc-code{font-family:var(--mono);font-weight:700;font-size:13.5px;letter-spacing:.05em;color:var(--ink);width:70px;padding-top:1px}
.lcard .lc-ck{width:18px;height:18px;border-radius:4px;border:1.5px solid var(--edge2);background:none;display:flex;align-items:center;justify-content:center;font-size:12.5px;color:#000;margin-top:1px}
.lcard.lc-done .lc-ck{background:var(--ink);border-color:var(--ink)}
.lcard .lc-nm{grid-column:2;grid-row:1;font-weight:700;font-size:14.5px;line-height:1.35;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lcard.lc-done .lc-nm{text-decoration:line-through;color:var(--dim)}
.lcard .lc-sub{grid-column:2;grid-row:2;align-self:start;font-size:13px;font-weight:500;color:var(--dim);margin-top:2px;line-height:1.5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lcard .lc-aside{grid-column:3;grid-row:1 / 3;align-self:start;display:flex;align-items:flex-start;gap:8px}
.lcard .lc-when{text-align:right;font-size:12px;color:var(--faint);font-family:var(--mono);white-space:nowrap;padding-top:1px}
.lcard .lc-when b{display:block;font-size:13px;color:var(--dim);font-weight:600}
.lcard .cbar{grid-column:2 / 4;grid-row:3;margin-top:10px}
.lcard .menu-btn{width:24px;height:22px;border:1px solid transparent;background:none;color:var(--dim);font-size:16px;line-height:1;border-radius:4px;letter-spacing:1px;flex-shrink:0}
.lcard .menu-btn:hover,.lcard .menu-btn.open{background:var(--panel2);border-color:var(--edge2);color:var(--ink)}
@media(max-width:560px){
  .lcard{grid-template-columns:1fr auto}
  .lcard .lc-lead{grid-column:1;grid-row:1}
  .lcard .lc-nm,.lcard .lc-sub{grid-column:1}
  .lcard .lc-aside{grid-column:2;grid-row:1}
  .lcard .cbar{grid-column:1 / 3}
}

/* calendário */
.cal-wrap{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;align-items:start}
@media(max-width:900px){.cal-wrap{grid-template-columns:1fr}}
.cal-grid{background:var(--panel);border:1px solid var(--edge);border-radius:4px;padding:16px}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-nav b{font-size:15px;font-weight:700;letter-spacing:-.01em;text-transform:capitalize}
.cal-nav button{background:none;border:1px solid var(--edge2);color:var(--dim);width:28px;height:28px;border-radius:4px;font-size:14.5px}
.cal-nav button:hover{color:var(--ink);border-color:var(--ink)}
.cal-days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-days .dow{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);text-align:center;padding:4px 0}
.cal-cell{aspect-ratio:1;border-radius:4px;border:1px solid transparent;display:flex;flex-direction:column;align-items:center;padding:5px 0;font-size:12.5px;color:var(--dim);position:relative}
.cal-cell.out{color:var(--faint);opacity:.4}
.cal-cell.today{border-color:var(--edge2);color:var(--ink);font-weight:700}
.cal-cell.has{color:var(--ink);background:var(--panel2);cursor:pointer}
.cal-cell .pips{display:flex;gap:2px;margin-top:auto}
.cal-cell .pips i{width:4px;height:4px;border-radius:50%;background:var(--c2)}
.timeline{display:flex;flex-direction:column;gap:2px}
.tl-day{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:14px 0 7px}
.tl-item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--edge)}
.tl-item .tl-time{font-family:var(--mono);font-size:12.5px;color:var(--dim);width:44px;flex-shrink:0}
.tl-item .tl-body{flex:1;min-width:0}
.tl-item .tl-t{font-weight:600;font-size:14px}
.tl-item .tl-sub{font-size:12.5px;color:var(--faint);margin-top:2px}
.tl-item .menu-btn{width:24px;border:0;background:none;color:var(--dim);font-size:15px;letter-spacing:1px}

/* vidro escuro com blur — usado em TODOS os pop-ups, popovers e modais */
.glass{background:rgba(16,16,16,.68);backdrop-filter:blur(24px) saturate(1.5);-webkit-backdrop-filter:blur(24px) saturate(1.5)}

/* popover de ações */
.pop{position:fixed;z-index:60;min-width:190px;background:rgba(16,16,16,.7);backdrop-filter:blur(24px) saturate(1.5);-webkit-backdrop-filter:blur(24px) saturate(1.5);border:1px solid var(--edge2);border-radius:4px;padding:5px;box-shadow:0 14px 40px rgba(0,0,0,.6)}
.pop button,.pop a{display:flex;width:100%;align-items:center;gap:9px;text-align:left;background:none;border:0;color:var(--ink);font-size:13.5px;padding:8px 10px;border-radius:4px;text-decoration:none}
.pop button:hover,.pop a:hover{background:rgba(255,255,255,.06)}
.pop .sep{height:1px;background:var(--edge);margin:4px 3px}
.pop .head{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);padding:7px 10px 3px}
.pop .danger{color:var(--neg)}

/* ===== modal ===== */
.modal-ov{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:20px}
.modal{position:relative;width:100%;max-width:390px;max-height:88vh;overflow-y:auto;background:rgba(16,16,16,.72);backdrop-filter:blur(26px) saturate(1.5);-webkit-backdrop-filter:blur(26px) saturate(1.5);border:1px solid var(--edge2);border-radius:5px;padding:24px;box-shadow:0 26px 70px rgba(0,0,0,.7)}
.modal h4{font-size:16px;font-weight:700;margin-bottom:9px;padding-right:24px;letter-spacing:-.01em}
.modal p{font-size:13.5px;color:var(--dim);line-height:1.6;margin-bottom:2px}
.modal .field{margin:14px 0 0}
.modal input,.modal select,.modal textarea{background:rgba(0,0,0,.35)}
.modal .err{min-height:0;margin-top:6px}
.modal .mrow{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.modal.lg{max-width:470px}
.modal .close-x{position:absolute;top:12px;right:12px;width:26px;height:26px;border:0;background:none;color:var(--faint);font-size:20px;line-height:1;border-radius:4px}
.modal .close-x:hover{color:var(--ink);background:rgba(255,255,255,.08)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:90;background:rgba(16,16,16,.8);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);border:1px solid var(--edge2);color:var(--ink);font-size:13.5px;padding:10px 16px;border-radius:4px;box-shadow:0 10px 30px rgba(0,0,0,.6);opacity:0;transition:opacity .2s}
.toast.on{opacity:1}
.err{color:var(--neg);font-size:12.5px;margin-top:8px;min-height:1em}
.login-remember{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--dim);text-transform:none;letter-spacing:0;margin:14px 0 0;justify-content:center;cursor:pointer}
.login-remember input{width:auto}

/* login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
#login .box{width:100%;max-width:320px;text-align:center}
#login svg,#login img{width:auto;height:38px;margin-bottom:18px}
#login h1{font-size:14.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--dim);margin-bottom:22px}
#login .pw-wrap{position:relative;margin-bottom:10px}
#login input{text-align:left;letter-spacing:0}
#login input::placeholder{text-align:left;letter-spacing:0;opacity:.6}
#login .pw-wrap input{text-align:left;padding-right:40px;margin:0;display:block}
#login .pw-eye{position:absolute;top:50%;right:6px;transform:translateY(-50%);width:28px;height:28px;display:flex;align-items:center;justify-content:center;background:none;border:0;color:var(--faint);padding:0}
#login .pw-eye:hover{color:var(--ink)}
#login .pw-eye.on{color:var(--ink)}
#login .pw-eye svg{width:16px;height:16px;margin:0}
#login .btn.gold{justify-content:center}

/* nova página / criar — escolha de tipo */
.np-types{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 2px}
.np-type{display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--panel2);border:1px solid var(--edge2);border-radius:4px;padding:11px 12px}
.np-type:hover{border-color:var(--ink)}
.np-type.on{border-color:var(--ink);background:var(--gold-lo)}
.np-type b{font-size:13.5px}
.np-type span{font-size:11.5px;color:var(--dim);line-height:1.35}
.np-code{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:14.5px;color:var(--ink);background:var(--panel2);border:1px solid var(--edge2);border-radius:4px;padding:8px 10px;margin-top:4px}
.np-code button{margin-left:auto;font-size:12px;color:var(--dim);background:none;border:0;text-decoration:underline}
.radio-row{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.radio-row label{flex:1;text-align:center;background:var(--panel2);border:1px solid var(--edge2);border-radius:4px;padding:9px 8px;font-size:13px;color:var(--ink);text-transform:none;letter-spacing:0;margin:0;min-width:90px}
.radio-row label.on{border-color:var(--ink);color:var(--ink);background:var(--gold-lo)}
.np-fromlib{width:100%;background:var(--panel2);border:1px dashed var(--edge2);border-radius:4px;color:var(--dim);font-size:13px;padding:11px;margin-top:8px}
.np-fromlib:hover{border-color:var(--ink);color:var(--ink)}
.np-fromlib.picked{border-style:solid;border-color:var(--c1);color:var(--c1)}

/* biblioteca */
.lib-drop{border:1.5px dashed var(--edge2);border-radius:4px;padding:24px 16px;text-align:center;color:var(--faint);font-size:13.5px;margin-bottom:18px;transition:border-color .15s,color .15s,background .15s}
.lib-drop.over{border-color:var(--ink);color:var(--ink);background:var(--gold-lo)}
.lib-drop b{color:var(--ink);font-size:14.5px;display:block;margin-bottom:5px}
.lib-drop button{color:var(--ink)!important}
.lib-subtabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.lib-subtabs button{background:var(--panel2);border:1px solid var(--edge2);color:var(--dim);font-size:12.5px;font-weight:600;padding:7px 14px;border-radius:2px}
.lib-subtabs button.on{background:var(--ink);color:#000;border-color:var(--ink)}
.lib-tools{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.lib-tools select{width:auto;min-width:0;padding:6px 26px 6px 9px;font-size:12.5px}
.lib-tools .spacer{flex:1}
.lib-tools .vm{display:flex;border:1px solid var(--edge2);border-radius:4px;overflow:hidden}
.lib-tools .vm button{background:var(--panel2);border:0;color:var(--dim);padding:6px 11px;font-size:14.5px;line-height:1}
.lib-tools .vm button.on{background:var(--ink);color:#000}
.lib-list{display:flex;flex-direction:column;gap:6px}
.lib-row{position:relative;display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--edge2);border-radius:4px;padding:9px 12px;cursor:pointer}
.lib-row:hover{border-color:var(--ink)}
.lib-row .lr-thumb{width:38px;height:38px;border-radius:4px;background:#0a0a0a center/cover no-repeat;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:14.5px}
.lib-row .lr-name{font-weight:600;font-size:14px;min-width:0;flex:1;word-break:break-word}
.lib-row .lr-meta{font-size:12.5px;color:var(--dim);white-space:nowrap}
.lib-row .lr-tag{font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:2px;border:1px solid var(--edge2);color:var(--dim);flex-shrink:0}
.lib-row .lf-menu{position:static;width:26px;height:24px;background:none;border:0;flex-shrink:0}
.lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.lib-folder{position:relative;background:var(--panel);border:1px solid var(--edge2);border-radius:4px;overflow:hidden;cursor:pointer}
.lib-folder .lf-cover{aspect-ratio:16/10;background:#0a0a0a center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:24px;border-bottom:1px solid var(--edge)}
.lib-folder .lf-body{padding:11px 12px}
.lib-folder .lf-name{font-weight:700;font-size:14px;word-break:break-word;line-height:1.3}
.lib-folder .lf-meta{font-size:12px;color:var(--dim);margin-top:3px}
.lf-tag{position:absolute;top:7px;left:7px;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;border-radius:2px;background:rgba(0,0,0,.7);backdrop-filter:blur(3px);border:1px solid var(--edge2);color:var(--dim)}
.lib-folder .lf-menu{position:absolute;top:7px;right:7px;width:28px;height:24px;border-radius:4px;border:1px solid transparent;background:rgba(0,0,0,.62);color:#fff;font-size:15px;display:flex;align-items:center;justify-content:center;letter-spacing:1px;backdrop-filter:blur(4px)}
.lib-folder .lf-menu:hover,.lib-folder .lf-menu.open{background:var(--panel2);border-color:var(--edge2)}
.lib-empty{color:var(--faint);font-size:12.5px;padding:16px 2px;text-align:center}

/* visualizador de pasta (modal) */
.modal.folder{max-width:860px;padding:0;max-height:90vh;display:flex;flex-direction:column;border-radius:5px}
.fv-head{padding:18px 22px 14px;border-bottom:1px solid var(--edge)}
.fv-head .fv-t{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin-bottom:5px}
.fv-head h4{font-size:18px;padding-right:20px;margin:0}
.fv-head .fv-sub{font-size:12.5px;color:var(--dim);margin-top:3px}
.fv-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 22px;border-bottom:1px solid var(--edge);background:var(--panel)}
.fv-bar .sp{flex:1}
.fv-bar button{font-size:12.5px;font-weight:600;background:var(--panel2);border:1px solid var(--edge2);color:var(--ink);padding:7px 12px;border-radius:4px}
.fv-bar button:hover{border-color:var(--ink)}
.fv-bar button.on{background:var(--gold-lo);border-color:var(--ink);color:var(--ink)}
.fv-bar button.go{background:var(--ink);border-color:var(--ink);color:#000}
.fv-bar button.del{border-color:rgba(255,107,92,.5);color:var(--neg)}
.fv-bar button.del:hover{background:var(--neg);color:#fff;border-color:var(--neg)}
.fv-bar button:disabled{opacity:.4;pointer-events:none}
.fv-grid{overflow-y:auto;padding:16px 22px 22px;display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px;align-content:start;user-select:none;touch-action:pan-y}
.fv-tile{position:relative;border:1px solid var(--edge2);border-radius:4px;overflow:hidden;background:#0a0a0a;cursor:pointer}
.fv-tile img,.fv-tile video{width:100%;aspect-ratio:1;object-fit:cover;display:block;pointer-events:none}
.fv-tile .fv-play{position:absolute;top:0;left:0;right:0;bottom:26px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;pointer-events:none;text-shadow:0 1px 6px rgba(0,0,0,.7)}
.fv-tile .fv-cap{font-size:11.5px;color:var(--dim);padding:6px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fv-tile .fv-ck{position:absolute;top:6px;left:6px;width:19px;height:19px;border-radius:4px;border:1.5px solid rgba(255,255,255,.75);background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;color:#000;font-size:13.5px;font-weight:800}
.fv-tile .fv-fa{position:absolute;top:5px;right:5px;display:flex;gap:4px;opacity:0;transition:opacity .12s}
.fv-tile:hover .fv-fa{opacity:1}
.fv-tile .fv-fa a,.fv-tile .fv-fa button{width:24px;height:24px;border:0;border-radius:4px;background:rgba(0,0,0,.72);color:#fff;font-size:13.5px;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(3px);text-decoration:none}
.fv-tile .fv-fa a:hover{background:var(--ink);color:#000}
.fv-tile .fv-fa button:hover{background:var(--neg)}
.fv-tile.sel{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink) inset}
.fv-tile.sel .fv-ck{background:var(--ink);border-color:var(--ink)}
.fv-tile:not(.sel) .fv-ck{color:transparent}
.fv-grid.only .fv-tile:not(.sel){display:none}
.fv-prog{font-size:12.5px;color:var(--dim)}
.tag{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--edge2);border-radius:4px;padding:2px 6px;color:var(--dim)}
.tag.exp{border-color:rgba(255,107,92,.5);color:var(--neg)}

/* editor */
.card{background:var(--panel);border:1px solid var(--edge);border-radius:4px;padding:18px;margin-bottom:16px}
.card > h3{font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}
.field{margin-bottom:12px}
.hint{font-size:12.5px;color:var(--faint);margin-top:4px}
.check{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink)}
.check input{width:auto}

.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(94px,1fr));gap:8px;margin-top:10px}
.imgc{position:relative;border:1px solid var(--edge2);border-radius:4px;overflow:hidden;background:#0a0a0a;aspect-ratio:1}
.imgc img,.imgc video{width:100%;height:100%;object-fit:cover}
.imgc .x{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;border:0;background:rgba(0,0,0,.7);color:#fff;font-size:13.5px;line-height:1;display:flex;align-items:center;justify-content:center}
.imgc .mv{position:absolute;bottom:3px;left:3px;display:flex;gap:2px}
.imgc .mv button{width:18px;height:18px;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:12.5px;border-radius:4px}
.drop{border:1px dashed var(--edge2);border-radius:4px;padding:16px;text-align:center;color:var(--faint);font-size:13px;margin-top:10px}
.drop.over{border-color:var(--ink);color:var(--ink)}
.logobox{width:104px;height:104px;border:1px dashed var(--edge2);border-radius:4px;display:flex;align-items:center;justify-content:center;position:relative;background:#0a0a0a;overflow:hidden;cursor:pointer}
.logobox:hover{border-color:var(--ink)}
.logobox.has{border-style:solid;border-color:var(--edge2)}
.logobox.wide{width:100%;max-width:340px;height:120px}
.logobox span{font-size:12px;letter-spacing:.05em;color:var(--faint)}
.logobox img,.logobox video{max-width:100%;max-height:100%;object-fit:contain}
.logobox.wide img,.logobox.wide video{width:100%;height:100%;object-fit:cover}
.logobox .rm{position:absolute;top:3px;right:3px;width:19px;height:19px;border:0;border-radius:5px;background:rgba(0,0,0,.62);color:#fff;font-size:14.5px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer}
.logobox .rm:hover{background:var(--neg)}

.sec{background:var(--panel2);border:1px solid var(--edge);border-radius:4px;margin-bottom:10px}
.sec > .sh{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--edge)}
.sec > .sh .st{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.sec > .sh .sp{flex:1;color:var(--dim);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec > .sb{padding:12px}
.addsec{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.cardrow{border:1px solid var(--edge);border-radius:4px;padding:10px;margin-bottom:8px;background:var(--panel)}
.cardrow .cr-top{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.cardrow .cr-top .grow{flex:1}

.savebar{position:fixed;left:0;right:0;bottom:0;background:rgba(0,0,0,.94);backdrop-filter:blur(8px);border-top:1px solid var(--edge);padding:11px 20px;display:flex;gap:10px;align-items:center;justify-content:flex-end;z-index:20}

.savebar .msg.ok{color:var(--ink)} .savebar .msg.bad{color:var(--neg)}
[hidden]{display:none!important}

/* registo de atividade */
.logtbl{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}

</style>

<script>
/* ============================ helpers ============================ */
var $ = function(s,r){ return (r||document).querySelector(s); };
var el = function(t,c,h){ var e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e; };
var ICO_PLUS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';
function api(method, path, body){
  return fetch("/api/"+path, {
    method: method,
    headers: body ? { "content-type":"application/json" } : undefined,
    body: body ? JSON.stringify(body) : undefined
  }).then(function(r){
    return r.text().then(function(txt){
      var j; try{ j = JSON.parse(txt); }catch(e){ j = { error: (r.status ? ("erro " + r.status) : "resposta inválida do servidor") }; }
      return { ok: r.ok, status: r.status, j: j };
    });
  }).catch(function(){
    return { ok:false, status:0, j:{ error:"Sem ligação ao servidor. Verifica a internet." } };
  });
}
function esc(s){ return (s==null?"":String(s)).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }

/* ============================ modal + popover do site ============================ */
function modal(build, opts){
  opts = opts || {};
  return new Promise(function(resolve){
    var ov = el("div","modal-ov"), box = el("div","modal" + (opts.cls ? " " + opts.cls : ""));
    ov.appendChild(box);
    function close(val){ ov.remove(); document.removeEventListener("keydown", onKey); resolve(val); }
    function onKey(e){ if(e.key === "Escape") close(undefined); }
    document.addEventListener("keydown", onKey);
    ov.addEventListener("mousedown", function(e){ if(e.target === ov) close(undefined); });
    build(box, close);
    var x = el("button","close-x"); x.innerHTML = "&times;"; x.setAttribute("aria-label","Fechar");
    x.onclick = function(){ close(undefined); };
    box.appendChild(x);
    document.body.appendChild(ov);
  });
}
function confirmModal(o){
  return modal(function(box, close){
    box.innerHTML = '<h4>'+esc(o.title)+'</h4>' + (o.message ? '<p>'+esc(o.message)+'</p>' : '');
    var row = el("div","mrow");
    var c = el("button","btn ghost", o.cancel || "Cancelar"); c.onclick = function(){ close(false); };
    var k = el("button","btn "+(o.danger ? "danger" : "gold"), o.ok || "Confirmar"); k.onclick = function(){ close(true); };
    row.appendChild(c); row.appendChild(k); box.appendChild(row);
    setTimeout(function(){ (o.danger ? c : k).focus(); }, 30);
  });
}
function promptModal(o){
  return modal(function(box, close){
    box.innerHTML = '<h4>'+esc(o.title)+'</h4>' + (o.message ? '<p>'+esc(o.message)+'</p>' : '');
    var f = el("div","field");
    if(o.label) f.appendChild(Object.assign(el("label"), { textContent: o.label }));
    var inp = el("input"); inp.type = o.type || "text"; inp.value = o.value || "";
    if(o.placeholder) inp.placeholder = o.placeholder;
    f.appendChild(inp); box.appendChild(f);
    var err = el("div","err"); box.appendChild(err);
    function submit(){
      var val = inp.value.trim();
      if(o.validate){ var e = o.validate(val); if(e){ err.textContent = e; return; } }
      close(val);
    }
    inp.addEventListener("keydown", function(e){ if(e.key === "Enter"){ e.preventDefault(); submit(); } });
    var row = el("div","mrow");
    var c = el("button","btn ghost","Cancelar"); c.onclick = function(){ close(null); };
    var k = el("button","btn gold", o.ok || "Guardar"); k.onclick = submit;
    row.appendChild(c); row.appendChild(k); box.appendChild(row);
    setTimeout(function(){ inp.focus(); }, 30);
  });
}
function noticeModal(title, message){
  return modal(function(box, close){
    box.innerHTML = '<h4>'+esc(title)+'</h4>' + (message ? '<p>'+esc(message)+'</p>' : '');
    var row = el("div","mrow"); var k = el("button","btn gold","OK"); k.onclick = function(){ close(); };
    row.appendChild(k); box.appendChild(row); setTimeout(function(){ k.focus(); }, 30);
  });
}
var _toastT = null;
function toast(msg){
  var t = $("#toast");
  if(!t){ t = el("div","toast"); t.id = "toast"; document.body.appendChild(t); }
  t.textContent = msg;
  requestAnimationFrame(function(){ t.classList.add("on"); });
  clearTimeout(_toastT);
  _toastT = setTimeout(function(){ t.classList.remove("on"); }, 2200);
}
window.__toastTag = function(elm){ var n = elm.getAttribute("title"); if(n) toast(n); };
function pageURL(code){ return location.origin + "/" + code; }
function copyLink(code){
  var u = pageURL(code);
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(u).then(function(){ toast("Link copiado — " + code); }, function(){ fallbackCopy(u, code); });
  } else { fallbackCopy(u, code); }
}
function fallbackCopy(u, code){
  var ta = el("textarea"); ta.value = u; ta.style.cssText = "position:fixed;opacity:0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); toast("Link copiado — " + code); }
  catch(e){ noticeModal("Copiar link", u); }
  ta.remove();
}
function closeMenu(){ var p = $("#actpop"); if(p){ if(p._cleanup) p._cleanup(); p.remove(); } }
function loadJSZip(){
  if(window.JSZip) return Promise.resolve(window.JSZip);
  return new Promise(function(res, rej){
    var s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js";
    s.onload = function(){ res(window.JSZip); }; s.onerror = rej;
    document.head.appendChild(s);
  });
}
function saveBlob(blob, name){
  var u = URL.createObjectURL(blob), a = document.createElement("a");
  a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove();

  });
  document.body.appendChild(pop);
  var r = anchor.getBoundingClientRect(), w = pop.offsetWidth, h = pop.offsetHeight;
  var left = Math.max(8, Math.min(r.right - w, window.innerWidth - w - 8));
  var top = r.bottom + 6;
  if(top + h > window.innerHeight - 8) top = Math.max(8, r.top - h - 6);
  pop.style.left = left + "px"; pop.style.top = top + "px";
  anchor.classList.add("open");
  function onDown(e){ if(!pop.contains(e.target) && e.target !== anchor) closeMenu(); }
  function onScroll(){ closeMenu(); }
  setTimeout(function(){ document.addEventListener("mousedown", onDown); window.addEventListener("scroll", onScroll, true); }, 0);

function wireSearch(){
  var inp = $("#search"), box = $("#searchResults");
  function norm(s){ return (s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, ""); }
  function render(list){
    if(!list.length){ box.innerHTML = '<div class="sr-empty">Nada encontrado</div>'; box.hidden = false; return; }
    var byG = {};
    list.slice(0, 24).forEach(function(it){ (byG[it.g] = byG[it.g] || []).push(it); });
    box.innerHTML = Object.keys(byG).map(function(g){
      return '<div class="sr-group">' + g + '</div>' + byG[g].map(function(it, i){
        return '<button data-g="' + g + '" data-i="' + i + '">' + esc(it.label) + (it.sub ? '<span class="sr-tag">' + esc(it.sub) + '</span>' : '') + '</button>';
      }).join("");
    }).join("");
    box.querySelectorAll("button").forEach(function(b){
      b.onclick = function(){ box.hidden = true; inp.value = ""; byG[b.dataset.g][+b.dataset.i].open(); };
    });
    box.hidden = false;
  }
  var tmr;
  inp.addEventListener("input", function(){
    var q = norm(inp.value.trim());
    clearTimeout(tmr);
    if(q.length < 2){ box.hidden = true; return; }
    tmr = setTimeout(function(){
      loadSearchIndex().then(function(all){
        render(all.filter(function(it){ return norm(it.label + " " + it.sub).indexOf(q) > -1; }));
      });
    }, 120);
  });
  inp.addEventListener("focus", function(){ SEARCH_CACHE = null; if(inp.value.trim().length >= 2) inp.dispatchEvent(new Event("input")); });
  document.addEventListener("mousedown", function(e){
    if(!e.target.closest(".ab-search")) box.hidden = true;
  });
  inp.addEventListener("keydown", function(e){ if(e.key === "Escape"){ box.hidden = true; inp.blur(); } });
}

  if(!dateStr) return null;
  var s = String(dateStr).slice(0, 10).split("-");

    var d = new Date(+s[0], +s[1] - 1, +s[2]);
    var t = new Date(); t.setHours(0, 0, 0, 0);
    return Math.round((d.getTime() - t.getTime()) / 86400000);
  }

function refreshNotifs(){

    col("tarefas"), col("contratos"), col("agenda"), col("pagamentos")
  ]).then(function(x){
    var n = [];

      if(!p.expira) return;
      var d = daysUntil(p.expira);
      if(d == null) return;
      if(d < 0) n.push({ key:"lk:"+p.code+":over", lvl:"urgent", t:"Link " + p.code + " expirou", sub:(p.cliente || p.titulo || "") + " · " + p.expira, sort:d, open:function(){ editView(p.code); } });

      else if(d <= 7) n.push({ key:"lk:"+p.code+":soon", lvl:"warn", t:"Link " + p.code + " expira em " + d + " dia" + (d===1?"":"s"), sub:(p.cliente || p.titulo || "") + " · " + p.expira, sort:d, open:function(){ editView(p.code); } });

    });

    });
    x[3].forEach(function(a){
      var d = daysUntil(a.data);
      if(d != null && d >= 0 && d <= 2) n.push({ key:"ag:"+a.id+":"+d, lvl:"warn", t:(d===0?"Hoje":d===1?"Amanhã":"Em 2 dias") + (a.hora ? " · " + a.hora : ""), sub:a.titulo + (a.cliente ? " · " + a.cliente : ""), sort:d - 10, open:function(){ openView("calendario"); } });

    });

}

/* ============================ PAINEL — negócio ============================ */
function ringSvg(pct, color){
  var r = 42, c = 2 * Math.PI * r;
  pct = Math.max(0, Math.min(100, pct || 0));
  var dash = (pct / 100 * c).toFixed(1);
  return '<svg viewBox="0 0 100 100" class="ring-svg">'
    + '<circle cx="50" cy="50" r="' + r + '" fill="none" stroke="var(--edge2)" stroke-width="9"/>'
    + '<circle cx="50" cy="50" r="' + r + '" fill="none" stroke="' + color + '" stroke-width="9" stroke-linecap="round" stroke-dasharray="' + dash + ' ' + c.toFixed(1) + '" transform="rotate(-90 50 50)"/>'
    + '</svg>';
}
function finRing(label, value, pct, color){
  return '<div class="fin-ring">' + ringSvg(pct, color)
    + '<div class="fin-ring-c"><b>' + fmtMoney(value) + '</b></div></div>'
    + '<div class="fin-ring-l">' + esc(label) + '</div>';
}
function destCard(label, nome, val){
  return '<div class="dest-card"><div class="dest-l">' + esc(label) + '</div>'
    + (nome ? ('<div class="dest-nm">' + esc(nome) + '</div><div class="dest-v">' + esc(val) + '</div>')
            : '<div class="dest-nm empty">Ainda sem dados</div>')
    + '</div>';
}
function loadNegocio(box){
  box.innerHTML = '<div class="dash-h">Negócio</div><div class="wide-empty">a carregar…</div>';
  Promise.all([col("pagamentos"), col("contratos"), col("tarefas"), col("prospeccao"), col("agenda")]).then(function(x){
    var pagamentos = x[0], contratos = x[1], tarefas = x[2], prospeccao = x[3], agenda = x[4];
    var hoje = new Date().toISOString().slice(0, 10);
    var semana = new Date(); semana.setDate(semana.getDate() + 7);
    var semanaStr = semana.toISOString().slice(0, 10);

    /* -- financeiro -- */
    var tot = { pago:0, pendente:0, atraso:0 };
    pagamentos.forEach(function(p){ tot[pagEstado(p)] += Number(p.valor) || 0; });
    var aberto = tot.pendente + tot.atraso, movimento = tot.pago + aberto;
    var pctPago = movimento ? tot.pago / movimento * 100 : 0;
    var pctAberto = movimento ? aberto / movimento * 100 : 0;

    /* -- operacional -- */
    var op = [
      { l:"Tarefas por fazer", v: tarefas.filter(function(t){ return t.estado !== "feito"; }).length },
      { l:"Contratos ativos", v: contratos.filter(function(k){ return !k.fim || k.fim >= hoje; }).length },
      { l:"Cobranças pendentes", v: pagamentos.filter(function(p){ return pagEstado(p) === "pendente"; }).length },
      { l:"Cobranças em atraso", v: pagamentos.filter(function(p){ return pagEstado(p) === "atraso"; }).length },
      { l:"Prospecção ativa", v: prospeccao.filter(function(p){ return ["abordar","contactado","conversa","proposta"].indexOf(p.estado || "abordar") >= 0; }).length },
      { l:"Compromissos · 7 dias", v: agenda.filter(function(a){ return a.data && a.data >= hoje && a.data <= semanaStr; }).length }
    ];

    /* -- destaques, por cliente -- */
    var acc = {};
    function ensure(nome){ nome = (nome || "").trim(); if(!nome) return null; if(!acc[nome]) acc[nome] = { nome:nome, receita:0, contratosAtivos:0, tarefasPendentes:0, maiorAtraso:0 }; return acc[nome]; }
    pagamentos.forEach(function(p){
      var c = ensure(p.cliente); if(!c) return;
      var e = pagEstado(p);
      if(e === "pago") c.receita += Number(p.valor) || 0;
      if(e === "atraso") c.maiorAtraso = Math.max(c.maiorAtraso, Number(p.valor) || 0);
    });
    contratos.forEach(function(k){ var c = ensure(k.cliente); if(c && (!k.fim || k.fim >= hoje)) c.contratosAtivos++; });
    tarefas.forEach(function(t){ if(t.estado === "feito") return; var c = ensure(t.cliente); if(c) c.tarefasPendentes++; });
    var agg = Object.keys(acc).map(function(k){ return acc[k]; });
    var topReceita = agg.filter(function(c){ return c.receita > 0; }).sort(function(a,b){ return b.receita - a.receita; })[0];
    var topContratos = agg.filter(function(c){ return c.contratosAtivos > 0; }).sort(function(a,b){ return b.contratosAtivos - a.contratosAtivos; })[0];
    var topAtraso = agg.filter(function(c){ return c.maiorAtraso > 0; }).sort(function(a,b){ return b.maiorAtraso - a.maiorAtraso; })[0];
    var topTarefas = agg.filter(function(c){ return c.tarefasPendentes > 0; }).sort(function(a,b){ return b.tarefasPendentes - a.tarefasPendentes; })[0];

    box.innerHTML = ""
      + '<div class="dash-h">Negócio</div>'
      + '<div class="fin-card">'
      +   '<div class="fin-col">' + finRing("Recebido", tot.pago, pctPago, "#5FBE82") + '</div>'
      +   '<div class="fin-mid"><div class="fin-mid-l">Movimentado</div><div class="fin-mid-v">' + fmtMoney(movimento) + '</div>'
      +     (tot.atraso ? '<div class="fin-mid-sub bad">' + fmtMoney(tot.atraso) + ' em atraso</div>' : '<div class="fin-mid-sub">tudo em dia</div>')
      +   '</div>'
      +   '<div class="fin-col">' + finRing("Em aberto", aberto, pctAberto, tot.atraso ? "#FF6B5C" : "#E7B84B") + '</div>'
      + '</div>'
      + '<div class="op-row">' + op.map(function(o){ return '<div class="op-item"><div class="op-v">' + o.v + '</div><div class="op-l">' + esc(o.l) + '</div></div>'; }).join("") + '</div>'
      + '<div class="dest-grid">'
      +   destCard("Maior cliente", topReceita && topReceita.nome, topReceita && fmtMoney(topReceita.receita))
      +   destCard("Mais contratos ativos", topContratos && topContratos.nome, topContratos && (topContratos.contratosAtivos + " contrato" + (topContratos.contratosAtivos===1?"":"s")))
      +   destCard("Maior valor em atraso", topAtraso && topAtraso.nome, topAtraso && fmtMoney(topAtraso.maiorAtraso))
      +   destCard("Mais tarefas por fazer", topTarefas && topTarefas.nome, topTarefas && (topTarefas.tarefasPendentes + " tarefa" + (topTarefas.tarefasPendentes===1?"":"s")))
      + '</div>';
  }).catch(function(){ box.innerHTML = '<div class="dash-h">Negócio</div><div class="wide-empty">Não foi possível carregar.</div>'; });
}

function fmtBytes(b){
  if(b == null) return "—";
  if(b < 1024) return b + " B";
  if(b < 1048576) return (b/1024).toFixed(0) + " KB";
  if(b < 1073741824) return (b/1048576).toFixed(1) + " MB";
  return (b/1073741824).toFixed(2) + " GB";
}
function pctCls(p){ return p > 85 ? "bad" : (p > 60 ? "warn" : ""); }

function loadStats(dash){
  dash.innerHTML = '<div class="qcard"><div class="qt">a carregar…</div></div>';
  api("GET","stats").then(function(r){
    if(!r.ok){
      dash.innerHTML = '<div class="qcard bad"><div class="qt">Estado</div><div class="qmeta">indisponível — falta o último deploy</div></div>';
      return;
    }
    var s = r.j, pg = s.pages, GB = 1073741824;
    var expN = (pg.expired||[]).length, soonN = (pg.soon||[]).length;
    var byT = pg.byType || {};
    var html = "";

    /* 1 — R2 (entregas ao cliente) */
    var r2 = s.r2, r2maxB = s.limits.r2.storageGB * GB;
    if(r2.bound && r2.bytes != null){
      var r2pct = r2.bytes / r2maxB * 100, r2cls = pctCls(r2pct);
      html += '<div class="qcard '+r2cls+'">'
        + '<div class="qt">R2 · Entregas</div>'
        + '<div class="qbig">'+fmtBytes(r2.bytes)+' <small>/ '+s.limits.r2.storageGB+' GB</small></div>'
        + '<div class="qbar"><i class="f '+r2cls+'" style="width:'+Math.max(2, Math.min(100, r2pct)).toFixed(1)+'%"></i></div>'
        + '<div class="qmeta">'+fmtBytes(r2maxB - r2.bytes)+' livres · '+r2.objects+' ficheiro'+(r2.objects===1?'':'s')+(r2.truncated?'+':'')+' · downloads grátis</div>'
        + '</div>';
    } else {
      html += '<div class="qcard warn">'
        + '<div class="qt">R2 · Entregas</div>'
        + '<div class="qbig">não ligado</div>'
        + '<div class="qmeta">Falta criar o bucket + binding. Até lá, entregas por link colado.</div>'
        + '</div>';
    }

    /* 2 — FFmpegLab (entregas grandes, +10GB) */
    var fl = s.ffmpeglab || {};
    var flMaxB = (s.limits.ffmpeglab ? s.limits.ffmpeglab.storageGB : 50) * GB;
    if(fl.bound && fl.bytes != null){
      var flpct = fl.bytes / flMaxB * 100, flcls = pctCls(flpct);
      html += '<div class="qcard '+flcls+'">'
        + '<div class="qt">FFmpegLab · Entregas grandes</div>'
        + '<div class="qbig">'+fmtBytes(fl.bytes)+' <small>/ '+(s.limits.ffmpeglab ? s.limits.ffmpeglab.storageGB : 50)+' GB</small></div>'
        + '<div class="qbar"><i class="f '+flcls+'" style="width:'+Math.max(2, Math.min(100, flpct)).toFixed(1)+'%"></i></div>'
        + '<div class="qmeta">'+fmtBytes(flMaxB - fl.bytes)+' livres · '+fl.objects+' ficheiro'+(fl.objects===1?'':'s')+' · zero custo de saída</div>'
        + '</div>';
    } else {
      html += '<div class="qcard warn">'
        + '<div class="qt">FFmpegLab · Entregas grandes</div>'
        + '<div class="qbig">não ligado</div>'
        + '<div class="qmeta">'+(fl.error ? "erro: "+esc(fl.error) : "Falta pôr as variáveis FFMPEGLAB_S3_* no Pages.")+'</div>'
        + '</div>';
    }

    /* 3 — Cloudinary (portfólio + seleção) */
    var cd = s.cloudinary || {};
    if(cd.configured && cd.credits && cd.credits.limit){
      var cpct = cd.credits.used_percent != null ? cd.credits.used_percent : (cd.credits.usage / cd.credits.limit * 100);
      var ccls = pctCls(cpct);
      html += '<div class="qcard '+ccls+'">'
        + '<div class="qt">Cloudinary · Portfólio + Seleção</div>'
        + '<div class="qbig">'+(cd.credits.usage!=null?(+cd.credits.usage).toFixed(1):"?")+' <small>/ '+cd.credits.limit+' créditos</small></div>'
        + '<div class="qbar"><i class="f '+ccls+'" style="width:'+Math.max(2, Math.min(100, cpct)).toFixed(1)+'%"></i></div>'
        + '<div class="qmeta">'+(cd.storageBytes!=null?fmtBytes(cd.storageBytes)+' guardados · ':'')+(cd.resources!=null?cd.resources+' ficheiros':'')+'</div>'
        + '</div>';
    } else if(cd.configured){
      html += '<div class="qcard'+(cd.error?' warn':'')+'">'
        + '<div class="qt">Cloudinary · Portfólio + Seleção</div>'
        + '<div class="qbig">ligado</div>'
        + '<div class="qmeta">'+(cd.error ? "uso não disponível ("+esc(cd.error)+")" : "uso a carregar…")+'</div>'
        + '</div>';
    } else {
      html += '<div class="qcard warn">'
        + '<div class="qt">Cloudinary · Portfólio + Seleção</div>'
        + '<div class="qbig">não ligado</div>'
        + '<div class="qmeta">Falta pôr as 3 variáveis CLOUDINARY_* no Pages.</div>'
        + '</div>';
    }

    /* 3 — links ativos + distribuição */
    var T = pg.total || 0;
    var seg = { proposta:byT.proposta||0, galeria:byT.galeria||0, portfolio:byT.portfolio||0, triagem:byT.triagem||0 };
    function w(n){ return T ? (n / T * 100).toFixed(1) : 0; }
    html += '<div class="qcard">'
      + '<div class="qt">Links ativos</div>'
      + '<div class="qbig">'+T+' <small>no total</small></div>'
      + '<div class="qbar">'
      +   '<i class="s-prop" style="width:'+w(seg.proposta)+'%"></i>'
      +   '<i class="s-ent" style="width:'+w(seg.galeria)+'%"></i>'
      +   '<i class="s-pf" style="width:'+w(seg.portfolio)+'%"></i>'
      +   '<i class="s-sel" style="width:'+w(seg.triagem)+'%"></i>'
      + '</div>'
      + '<div class="qlegend">'
      +   '<span><i class="s-prop"></i>Propostas '+seg.proposta+'</span>'
      +   '<span><i class="s-ent"></i>Entregas '+seg.galeria+'</span>'
      +   '<span><i class="s-pf"></i>Portfólio '+seg.portfolio+'</span>'
      +   '<span><i class="s-sel"></i>Seleções '+seg.triagem+'</span>'
      + '</div>'
      + '</div>';

    /* 4 — a expirar */
    var acls = expN ? "bad" : (soonN ? "warn" : "");
    var body = "";
    if(expN || soonN){
      pg.expired.forEach(function(x){ body += '<div><span class="g">✕</span> '+esc(x.code)+' expirou em '+x.expira+'</div>'; });
      pg.soon.forEach(function(x){ body += '<div><span class="s">!</span> '+esc(x.code)+' expira em '+x.dias+' dia'+(x.dias===1?'':'s')+'</div>'; });
    } else {
      body = '<div style="color:var(--pos)">tudo em dia</div>';
    }
    html += '<div class="qcard '+acls+'">'
      + '<div class="qt">A expirar</div>'
      + '<div class="qbig">'+(expN + soonN)+' <small>a precisar de atenção</small></div>'
      + '<div class="qexp">'+body+'</div>'
      + '</div>';

    dash.innerHTML = html;

    /* faixa de sistema por baixo */
    var strip = dash.nextElementSibling;
    if(strip && strip.classList.contains("sysbar")) strip.remove();
    var t = new Date(s.generated);
    var cloud = s.cloudinary && s.cloudinary.configured;
    dash.insertAdjacentHTML("afterend",
      '<div class="sysbar">'
      + '<span><span class="dot ok"></span>Base de dados ativa</span>'
      + '<span><span class="dot ok"></span>Site e API online</span>'
      + '<span><span class="dot '+(r2.bound?'ok':'bad')+'"></span>R2 '+(r2.bound?'ligado':'por ligar')+'</span>'
      + '<span><span class="dot '+(cloud?'ok':'bad')+'"></span>Cloudinary '+(cloud?'ligado':'por ligar')+'</span>'
      + '<span>'+pg.kvKeys+' registos · máx. 1000 gravações/dia</span>'
      + '<span>atualizado '+t.toLocaleTimeString("pt-PT",{hour:"2-digit",minute:"2-digit"})+'</span>'
      + '</div>');
  }).catch(function(){
    dash.innerHTML = '<div class="qcard bad"><div class="qt">Estado</div><div class="qmeta">erro ao ler o painel</div></div>';
  });
}
