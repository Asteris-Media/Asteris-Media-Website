<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Asteris — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0C0D0E; --panel:#16181A; --panel2:#1E2124; --edge:#2E3337; --edge2:#41474C;
  --ink:#ECEEEC; --dim:#A2A8A5; --faint:#71776F;
  --gold:#C9A166; --gold-lo:rgba(201,161,102,.14);
  --pos:#3FD07A; --neg:#FF5B4C; --warn:#F5C518;
  --sans:"Hanken Grotesk",system-ui,sans-serif; --mono:"Space Mono",monospace;
}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased;font-size:13px}
a{color:var(--gold)}
button{font-family:var(--sans);cursor:pointer}
input,select,textarea{font-family:var(--sans);font-size:13px;background:var(--panel2);border:1px solid var(--edge);color:var(--ink);padding:9px 10px;border-radius:4px;width:100%}
input:focus,select,textarea:focus{outline:1px solid var(--gold);border-color:var(--gold)}
textarea{resize:vertical;min-height:64px;line-height:1.6}
label{display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:0 0 5px}
.wrap{max-width:940px;margin:0 auto;padding:26px 20px 90px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row > *{flex:1;min-width:180px}
.mono{font-family:var(--mono)}

.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--edge2);background:var(--panel);color:var(--ink);padding:9px 15px;border-radius:4px;font-size:12px;font-weight:600}
.btn:hover{border-color:var(--gold)}
.btn.gold{background:var(--gold);color:#0C0D0E;border-color:var(--gold)}
.btn.gold:hover{opacity:.9}
.btn.sm{padding:6px 10px;font-size:11px}
.btn.danger{border-color:var(--neg);color:var(--neg)}
.btn.danger:hover{background:var(--neg);color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--dim);padding:6px 8px}
.btn.ghost:hover{color:var(--ink)}

/* login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
#login .box{width:100%;max-width:320px;text-align:center}
#login svg,#login img{width:auto;height:40px;margin-bottom:18px}
#login h1{font-size:15px;letter-spacing:.3em;text-transform:uppercase;color:var(--dim);margin-bottom:22px}
#login input{text-align:center;letter-spacing:.15em;margin-bottom:10px}
.err{color:var(--neg);font-size:11px;margin-top:8px;min-height:1em}

/* topo */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
.top h1{display:flex;align-items:center;gap:9px;font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--dim)}
.top h1 svg,.top h1 img{width:auto;height:17px}

/* painel de estado — linha de cima */
.dash{display:grid;grid-template-columns:repeat(auto-fit,minmax(146px,1fr));gap:10px;margin-bottom:24px}
@media(max-width:720px){.dash{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;margin:0 -4px;padding:0 4px 4px}.dash::-webkit-scrollbar{display:none}.dcard{flex:0 0 44%;scroll-snap-align:center}}
.dcard{background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:14px 12px;display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center;min-width:0}
.dcard.warn{border-color:var(--gold)} .dcard.bad{border-color:var(--neg)}
.dcard .lbl{font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.dcard .big{font-size:22px;font-weight:800;line-height:1}
.dcard .sub{font-size:9.5px;color:var(--dim);word-break:break-word;line-height:1.45}
.ring{position:relative;width:78px;height:78px;flex-shrink:0}
.ring svg{width:100%;height:100%}
.ring .rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.ring .rc b{font-size:15px;font-weight:800;line-height:1}
.ring .rc span{font-size:7.5px;letter-spacing:.06em;color:var(--faint);text-transform:uppercase}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:middle}
.dot.ok{background:var(--pos)} .dot.off{background:var(--faint)} .dot.bad{background:var(--neg)}

/* colunas por categoria */
.mkcols{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;align-items:start}
@media(max-width:1080px){
  .mkcols{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;gap:10px;margin:0 -4px;padding:0 4px 8px}
  .mkcols::-webkit-scrollbar{display:none}
  .mkcol{flex:0 0 84%;scroll-snap-align:center}
}
.mkcol{background:var(--panel2);border:1px solid var(--edge);border-radius:10px;padding:12px;min-width:0}
.mkcol > h2{display:flex;align-items:center;gap:8px;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-bottom:12px;padding-bottom:9px;border-bottom:1px solid var(--edge)}
.mkcol > h2 .cnt{margin-left:auto;background:var(--edge2);color:var(--ink);border-radius:20px;padding:1px 8px;font-family:var(--mono);font-size:10px;letter-spacing:0;font-weight:700}
.mkcol .stack{display:flex;flex-direction:column;gap:8px}
.mkcol .empty{color:var(--faint);font-size:11px;padding:14px 2px;text-align:center}
.mkitem{background:var(--panel);border:1px solid var(--edge);border-radius:7px;padding:11px 12px}
.mkitem:hover{border-color:var(--edge2)}
.mkitem .code{font-family:var(--mono);font-weight:700;color:var(--gold);font-size:12px}
.mkitem .nm{font-weight:600;font-size:12.5px;margin-top:3px;word-break:break-word}
.mkitem .ti{color:var(--faint);font-size:11px;margin-top:1px;word-break:break-word}
.mkitem .exprow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:7px;font-size:10px;color:var(--dim)}
.mkitem .exprow .perm{color:var(--pos)}
.mkitem .exprow .gone{color:var(--neg)}
.mkitem .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.mkitem .lnk{font-size:10.5px;color:var(--dim);background:none;border:0;padding:2px 4px;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.mkitem .lnk:hover{color:var(--gold)}
.mkitem .lnk.del{color:var(--neg)}
.mkitem .lnk.del.armed{color:#fff;background:var(--neg);border-radius:3px;text-decoration:none;padding:2px 7px}
.tag{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--edge2);border-radius:3px;padding:2px 6px;color:var(--dim)}
.tag.exp{border-color:var(--neg);color:var(--neg)}

/* editor */
.card{background:var(--panel);border:1px solid var(--edge);border-radius:8px;padding:18px;margin-bottom:16px}
.card > h3{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}
.field{margin-bottom:12px}
.hint{font-size:10.5px;color:var(--faint);margin-top:4px}
.check{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink)}
.check input{width:auto}

/* lista de imagens */
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(94px,1fr));gap:8px;margin-top:10px}
.imgc{position:relative;border:1px solid var(--edge);border-radius:4px;overflow:hidden;background:#0a0a0a;aspect-ratio:1}
.imgc img,.imgc video{width:100%;height:100%;object-fit:cover}
.imgc .x{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;border:0;background:rgba(0,0,0,.7);color:#fff;font-size:12px;line-height:1;display:flex;align-items:center;justify-content:center}
.imgc .mv{position:absolute;bottom:3px;left:3px;display:flex;gap:2px}
.imgc .mv button{width:18px;height:18px;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:11px;border-radius:3px}
.drop{border:1px dashed var(--edge2);border-radius:6px;padding:16px;text-align:center;color:var(--faint);font-size:11.5px;margin-top:10px}
.drop.over{border-color:var(--gold);color:var(--gold)}

/* secções da proposta */
.sec{background:var(--panel2);border:1px solid var(--edge);border-radius:6px;margin-bottom:10px}
.sec > .sh{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--edge)}
.sec > .sh .st{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.sec > .sh .sp{flex:1;color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec > .sb{padding:12px}
.addsec{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}

.cardrow{border:1px solid var(--edge);border-radius:5px;padding:10px;margin-bottom:8px;background:var(--panel)}
.cardrow .cr-top{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.cardrow .cr-top .grow{flex:1}

.savebar{position:fixed;left:0;right:0;bottom:0;background:rgba(12,13,14,.94);backdrop-filter:blur(8px);border-top:1px solid var(--edge);padding:11px 20px;display:flex;gap:10px;align-items:center;justify-content:flex-end;z-index:20}
.savebar .msg{margin-right:auto;font-size:11.5px;color:var(--faint)}
.savebar .msg.ok{color:var(--pos)} .savebar .msg.bad{color:var(--neg)}
[hidden]{display:none!important}
</style>
</head>
<body>

<div id="login">
  <div class="box">
    <img src="/assets/logos/asteris.png" alt="Asteris">
    <h1>Asteris Admin</h1>
    <form id="loginForm">
      <input type="password" id="pw" placeholder="Password" autocomplete="current-password" required>
      <button class="btn gold" style="width:100%" type="submit">Entrar</button>
      <div class="err" id="loginErr"></div>
    </form>
  </div>
</div>

<div id="app" class="wrap" hidden>
  <div class="top">
    <h1><img src="/assets/logos/asteris.png" alt=""> Asteris Admin</h1>
    <div style="display:flex;gap:8px">
      <button class="btn sm" id="btnLogout">Sair</button>
    </div>
  </div>
  <div id="view"></div>
</div>

<script>
/* ============================ helpers ============================ */
var $ = function(s,r){ return (r||document).querySelector(s); };
var el = function(t,c,h){ var e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e; };
function api(method, path, body){
  return fetch("/api/"+path, {
    method: method,
    headers: body ? { "content-type":"application/json" } : undefined,
    body: body ? JSON.stringify(body) : undefined
  }).then(function(r){ return r.json().then(function(j){ return { ok:r.ok, status:r.status, j:j }; }); });
}
function esc(s){ return (s==null?"":String(s)); }
function randCode(n){ var a="ABCDEFGHJKLMNPQRSTUVWXYZ23456789", s=""; for(var i=0;i<(n||6);i++) s+=a[Math.floor(Math.random()*a.length)]; return s; }
function isVid(u){ return /\.(mp4|webm|mov|m4v)(\?|$)/i.test(u||""); }
function linesToArr(v){ return (v||"").replace(/\r/g,"").split("\n").map(function(x){return x.trim();}).filter(Boolean); }
// textarea de lista (um item por linha): ignora linhas em branco e, ao sair, encosta os itens
function bindList(node, setArr){
  node.addEventListener("input", function(){ setArr(linesToArr(node.value)); });
  node.addEventListener("blur", function(){ node.value = linesToArr(node.value).join("\n"); });
  return node;
}
function paraToArr(v){ return (v||"").split(/\n\s*\n/).map(function(x){return x.trim();}).filter(Boolean); }

var ICON_KEYS = "diamante brilhante gema coroa medalha trofeu estrela estrela2 raio chama foguete seta_cima seta_baixo tendencia grafico alvo escudo escudo_check selo fita laurel check infinito presente etiqueta pasta camada pacote camera video filme imagem abertura play coracao olho bussola globo megafone enviar relogio calendario cadeado chave utilizadores utilizador aperto_mao polegar folha montanha sol lua hexagono losango circulo quadrado mais bloco".split(" ");

/* ============================ auth ============================ */
$("#loginForm").addEventListener("submit", function(e){
  e.preventDefault();
  $("#loginErr").textContent = "";
  api("POST","login",{ pw: $("#pw").value }).then(function(r){
    if(r.ok){ boot(); } else { $("#loginErr").textContent = (r.j && r.j.error) || "Erro"; }
  });
});
$("#btnLogout").addEventListener("click", function(){
  api("POST","logout").then(function(){ location.reload(); });
});
api("GET","me").then(function(r){ if(r.j && r.j.ok) boot(); });

function boot(){
  $("#login").hidden = true;
  $("#app").hidden = false;
  listView();
}

/* ============================ lista ============================ */
var CATS = [
  { key:"proposta",  titulo:"Proposta",              match:function(p){ return p.type === "proposta"; } },
  { key:"portfolio", titulo:"Portfólio",             match:function(p){ return p.type === "portfolio" || (p.type === "galeria" && p.anon === true); } },
  { key:"entrega",   titulo:"Entrega de trabalho",   match:function(p){ return p.type === "galeria" && p.anon !== true; } },
  { key:"selecao",   titulo:"Seleção de material",   match:function(p){ return p.type === "triagem"; } }
];

function daysBetween(a, b){ return Math.round((a - b) / 86400000); }

function setExpira(code, novaData){
  return api("GET","pages/"+code).then(function(r){
    if(!r.ok) throw new Error(r.j && r.j.error);
    var d = r.j.data; d.expira = novaData || "";
    return api("PUT","pages/"+code, d);
  }).then(function(){ listView(); });
}

function listView(){
  var v = $("#view"); v.innerHTML = "";
  var head = el("div"); head.style.cssText = "display:flex;justify-content:space-between;align-items:center;margin-bottom:16px";
  head.innerHTML = '<div style="color:var(--dim);font-size:12px">Painel</div>';
  var nb = el("button","btn gold","+ Nova página"); nb.onclick = function(){ editView(null); };
  head.appendChild(nb);
  v.appendChild(head);

  var dash = el("div","dash"); v.appendChild(dash);
  loadStats(dash);

  var cols = el("div","mkcols"); v.appendChild(cols);
  cols.innerHTML = '<div style="color:var(--faint);padding:20px">a carregar…</div>';

  api("GET","pages").then(function(r){
    var pages = (r.j && r.j.pages) || [];
    cols.innerHTML = "";
    CATS.forEach(function(cat){
      var lista = pages.filter(cat.match);
      var col = el("div","mkcol");
      col.innerHTML = '<h2>'+cat.titulo+'<span class="cnt">'+lista.length+'</span></h2>';
      var stack = el("div","stack");
      if(!lista.length){ stack.appendChild(el("div","empty","sem links")); }
      lista.forEach(function(p){ stack.appendChild(pageCard(p)); });
      col.appendChild(stack);
      cols.appendChild(col);
    });
  });
}

function fmtBytes(b){
  if(b == null) return "—";
  if(b < 1024) return b + " B";
  if(b < 1048576) return (b/1024).toFixed(0) + " KB";
  if(b < 1073741824) return (b/1048576).toFixed(1) + " MB";
  return (b/1073741824).toFixed(2) + " GB";
}
/* cartão com anel circular SVG (sem libs). pct 0..100 */
function ringCard(pct, big, small, lbl, cls){
  pct = Math.max(0, Math.min(100, pct || 0));
  var R = 15.5, C = 2 * Math.PI * R, off = C * (1 - pct / 100);
  var color = cls === "bad" ? "var(--neg)" : (cls === "warn" ? "var(--gold)" : "var(--pos)");
  return '<div class="dcard'+(cls?' '+cls:'')+'">'
    + '<div class="ring"><svg viewBox="0 0 40 40">'
    +   '<circle cx="20" cy="20" r="'+R+'" fill="none" stroke="var(--edge2)" stroke-width="4"/>'
    +   '<circle cx="20" cy="20" r="'+R+'" fill="none" stroke="'+color+'" stroke-width="4" stroke-linecap="round"'
    +     ' stroke-dasharray="'+C.toFixed(2)+'" stroke-dashoffset="'+off.toFixed(2)+'" transform="rotate(-90 20 20)"/>'
    + '</svg><div class="rc"><b>'+big+'</b><span>'+small+'</span></div></div>'
    + '<div class="lbl">'+lbl+'</div></div>';
}
function dcard(lbl, big, sub, cls){
  return '<div class="dcard'+(cls?' '+cls:'')+'">'
    + '<div class="lbl">'+lbl+'</div>'
    + (big != null ? '<div class="big">'+big+'</div>' : '')
    + (sub ? '<div class="sub">'+sub+'</div>' : '')
    + '</div>';
}
function loadStats(dash){
  dash.innerHTML = '<div class="dcard"><div class="sub">a carregar estado…</div></div>';
  api("GET","stats").then(function(r){
    if(!r.ok){ dash.innerHTML = dcard("Estado","—","precisa do último deploy","bad"); return; }
    var s = r.j, pg = s.pages;
    var TL = { proposta:"Propostas", portfolio:"Portfólio", galeria:"Entregas", triagem:"Seleções" };
    var bt = Object.keys(pg.byType||{}).map(function(k){ return (TL[k]||k)+" "+pg.byType[k]; }).join(" · ");
    var expN = (pg.expired||[]).length, soonN = (pg.soon||[]).length;
    var saud = pg.total ? Math.round((pg.total - expN - soonN) / pg.total * 100) : 100;
    var r2 = s.r2, r2max = s.limits.r2.storageGB * 1073741824;
    var r2pct = (r2.bound && r2.bytes != null) ? r2.bytes / r2max * 100 : 0;
    var html = "";

    // anel: saúde dos links
    html += ringCard(saud, saud + "%", "saudável",
      "Links " + pg.total,
      expN ? "bad" : (soonN ? "warn" : ""));

    // anel: R2
    if(r2.bound && r2.bytes != null){
      html += ringCard(r2pct, fmtBytes(r2.bytes), "de "+s.limits.r2.storageGB+"GB",
        "R2 · " + r2.objects + " fich." + (r2.truncated ? "+" : ""),
        r2pct > 80 ? "bad" : (r2pct > 50 ? "warn" : ""));
    } else {
      html += dcard("Armazenamento R2", '<span class="dot off"></span>', "não ligado — só links");
    }

    // cartão: distribuição
    html += dcard("Distribuição", null, bt || "sem links");

    // cartão: atenção
    html += dcard("Atenção",
      String(expN + soonN),
      (expN ? expN+" expirado(s)" : "") + (expN && soonN ? "<br>" : "") + (soonN ? soonN+" a expirar ≤14d" : (expN ? "" : "tudo em dia")),
      expN ? "bad" : (soonN ? "warn" : ""));

    // cartão: cloudinary
    html += dcard("Cloudinary",
      s.cloudinary.configured ? '<span class="dot ok"></span>' : '<span class="dot off"></span>',
      s.cloudinary.configured ? "ligado · 25 créditos/mês" : "não ligado");

    // cartão: sistema
    var t = new Date(s.generated);
    html += dcard("Sistema",
      '<span class="dot ok"></span>',
      "KV + API ok · "+pg.kvKeys+" chaves<br>máx. 1000 escritas/dia<br>"+t.toLocaleTimeString("pt-PT",{hour:"2-digit",minute:"2-digit"}));

    dash.innerHTML = html;

    // linha de detalhe dos que pedem atenção
    var next = dash.nextElementSibling;
    if(next && next.classList.contains("dash-detail")) next.remove();
    if(expN || soonN){
      var det = [];
      pg.expired.forEach(function(x){ det.push('<span style="color:var(--neg)">'+x.code+' expirou ('+x.expira+')</span>'); });
      pg.soon.forEach(function(x){ det.push('<span style="color:var(--gold)">'+x.code+' — '+x.dias+'d</span>'); });
      dash.insertAdjacentHTML("afterend",
        '<div class="dash-detail" style="font-size:10.5px;color:var(--dim);margin:-14px 0 20px">'+det.join(' &nbsp;·&nbsp; ')+'</div>');
    }
  }).catch(function(){
    dash.innerHTML = dcard("Estado","erro","não foi possível ler o painel","bad");
  });
}

function pageCard(p){
  var now = new Date();
  var expDate = p.expira ? new Date(p.expira + "T23:59:59") : null;
  var expirado = expDate && expDate < now;
  var it = el("div","mkitem");

  it.appendChild(Object.assign(el("div","code"), { textContent: p.code }));
  it.appendChild(Object.assign(el("div","nm"), { textContent: p.cliente || p.titulo || "—" }));
  if(p.titulo && p.cliente) it.appendChild(Object.assign(el("div","ti"), { textContent: p.titulo }));

  var exprow = el("div","exprow");
  if(!p.expira){
    exprow.innerHTML = '<span class="perm">● permanente</span>';
    var setb = el("button","lnk","definir prazo");
    setb.onclick = function(){
      var dt = prompt("Data de expiração (AAAA-MM-DD):", "");
      if(dt && /^\d{4}-\d{2}-\d{2}$/.test(dt)) setExpira(p.code, dt);
    };
    exprow.appendChild(setb);
  } else {
    var restam = daysBetween(expDate, now);
    exprow.innerHTML = expirado
      ? '<span class="gone">expirou em '+p.expira+'</span>'
      : '<span>até '+p.expira+' ('+restam+ 'd)</span>';
    [["+30d",30],["+90d",90]].forEach(function(o){
      var b = el("button","lnk", o[0]);
      b.onclick = function(){
        var base = (expirado ? now : expDate);
        var nd = new Date(base.getTime() + o[1]*86400000);
        setExpira(p.code, nd.toISOString().slice(0,10));
      };
      exprow.appendChild(b);
    });
    var permb = el("button","lnk","tornar permanente");
    permb.onclick = function(){ setExpira(p.code, ""); };
    exprow.appendChild(permb);
  }
  it.appendChild(exprow);

  var acts = el("div","acts");
  var open = el("a","lnk","abrir"); open.href = "/"+p.code; open.target = "_blank";
  var ed = el("button","lnk","editar"); ed.onclick = function(){ editView(p.code); };
  var del = el("button","lnk del","excluir");
  var timer = null;
  del.onclick = function(){
    if(del.classList.contains("armed")){
      clearTimeout(timer);
      del.textContent = "a excluir…"; del.disabled = true;
      api("DELETE","pages/"+p.code).then(function(){ listView(); });
      return;
    }
    del.classList.add("armed"); del.textContent = "confirmar exclusão";
    timer = setTimeout(function(){ del.classList.remove("armed"); del.textContent = "excluir"; }, 4000);
  };
  acts.appendChild(open); acts.appendChild(ed); acts.appendChild(del);
  it.appendChild(acts);
  return it;
}

/* ============================ editor ============================ */
var CUR = null; // { code, data, isNew }

function editView(code){
  var v = $("#view"); v.innerHTML = "";
  var back = el("button","btn ghost","← voltar"); back.onclick = listView;
  v.appendChild(back);

  if(code){
    api("GET","pages/"+code).then(function(r){
      if(!r.ok){ v.appendChild(el("div","err", r.j.error||"erro")); return; }
      CUR = { code:r.j.code, data:r.j.data, isNew:false };
      buildEditor(v);
    });
  } else {
    CUR = { code:randCode(6), isNew:true, data:{ type:"galeria", cliente:"", titulo:"", intro:"", itens:[] } };
    buildEditor(v);
  }
}

function buildEditor(v){
  var d = CUR.data;
  var box = el("div"); v.appendChild(box);

  /* --- base --- */
  var base = el("div","card");
  base.innerHTML = '<h3>Base</h3>';
  var r1 = el("div","row");
  r1.appendChild(fieldEl("Código", inputEl("code", CUR.code, { disabled: !CUR.isNew, cls:"mono" })));
  r1.appendChild(fieldEl("Tipo", selectEl("type", d.type||"galeria", [
    ["galeria","Entrega"],["triagem","Seleção"],["portfolio","Portfólio"],["proposta","Proposta"]
  ])));
  base.appendChild(r1);
  var r2 = el("div","row");
  r2.appendChild(fieldEl("Cliente", inputEl("cliente", d.cliente||"")));
  r2.appendChild(fieldEl("Título", inputEl("titulo", d.titulo||"")));
  base.appendChild(r2);
  var r3 = el("div","row");
  r3.appendChild(fieldEl("Expira (AAAA-MM-DD)", inputEl("expira", d.expira||"", { type:"date" })));
  var anon = el("label","check"); anon.innerHTML = '<input type="checkbox" id="f-anon"'+(d.anon?" checked":"")+'> Anónima (esconde nome + rótulo)';
  var anonF = el("div","field"); anonF.appendChild(el("label","","")); anonF.appendChild(anon);
  r3.appendChild(anonF);
  base.appendChild(r3);
  base.appendChild(fieldEl("Intro (texto curto para o cliente)", textareaEl("intro", d.intro||"")));
  box.appendChild(base);

  /* --- corpo, conforme tipo --- */
  var body = el("div"); body.id = "editor-body"; box.appendChild(body);
  renderBody(body, d);
  $("#f-type", box).addEventListener("change", function(){
    CUR.data.type = this.value;
    renderBody(body, CUR.data);
  });

  /* --- savebar --- */
  var old = $(".savebar"); if(old) old.remove();
  var bar = el("div","savebar");
  bar.innerHTML = '<span class="msg" id="saveMsg"></span>';
  var prev = el("a","btn","pré-visualizar"); prev.href = "/"+CUR.code; prev.target = "_blank";
  var del = el("button","btn danger sm","apagar");
  del.onclick = function(){
    if(!confirm("Apagar "+CUR.code+"?")) return;
    api("DELETE","pages/"+CUR.code).then(function(){ listView(); $(".savebar").remove(); });
  };
  var save = el("button","btn gold","Guardar");
  save.onclick = doSave;
  if(CUR.isNew) del.hidden = true;
  bar.appendChild(prev); bar.appendChild(del); bar.appendChild(save);
  document.body.appendChild(bar);
}

function renderBody(host, d){
  host.innerHTML = "";
  if(d.type === "proposta"){ renderPropostaEditor(host, d); }
  else { renderGaleriaEditor(host, d); }
}

/* ---------- editor galeria/triagem/portfólio ---------- */
function renderGaleriaEditor(host, d){
  var c = el("div","card"); c.innerHTML = '<h3>Peças</h3>';
  if(d.type === "triagem"){
    c.appendChild(fieldEl("Instruções", inputEl("instrucoes", d.instrucoes||"Clica em Selecionar em cada foto que queres.")));
    c.appendChild(fieldEl("Formspree ID (recebe a lista por email)", inputEl("formspree", d.formspree||"")));
  }
  if(d.type === "galeria"){
    c.appendChild(fieldEl("Link .zip 'Descarregar tudo' (opcional)", inputEl("downloadTudo", d.downloadTudo||"")));
  }
  d.itens = d.itens || [];
  var grid = el("div"); c.appendChild(grid);
  imageList(grid, d.itens, function(){ renderGaleriaEditor(host, d); });
  host.appendChild(c);
}

/* ---------- widget lista de imagens ---------- */
function imageList(host, arr, refresh){
  host.innerHTML = "";
  var g = el("div","imgs");
  arr.forEach(function(it, i){
    var cell = el("div","imgc");
    var src = it.thumb || it.src;
    cell.innerHTML = (it.tipo==="video" || isVid(src))
      ? '<video src="'+src+'" muted></video>'
      : '<img src="'+src+'" alt="">';
    var x = el("button","x","×"); x.onclick = function(){ arr.splice(i,1); refresh(); };
    var mv = el("div","mv");
    var lft = el("button",null,"‹"); lft.onclick = function(){ if(i>0){ var t=arr[i-1]; arr[i-1]=arr[i]; arr[i]=t; refresh(); } };
    var rgt = el("button",null,"›"); rgt.onclick = function(){ if(i<arr.length-1){ var t=arr[i+1]; arr[i+1]=arr[i]; arr[i]=t; refresh(); } };
    mv.appendChild(lft); mv.appendChild(rgt);
    cell.appendChild(x); cell.appendChild(mv);
    g.appendChild(cell);
  });
  host.appendChild(g);

  var ta = textareaEl("_urls", "");
  ta.placeholder = "Colar links (um por linha) e clicar Adicionar";
  ta.style.marginTop = "10px";
  host.appendChild(ta);
  var addBtn = el("button","btn sm","+ Adicionar links"); addBtn.style.marginTop = "6px";
  addBtn.onclick = function(){
    linesToArr(ta.value).forEach(function(u){
      arr.push({ src:u, tipo: isVid(u) ? "video" : "foto" });
    });
    refresh();
  };
  host.appendChild(addBtn);

  var drop = el("div","drop","ou arrasta ficheiros para aqui (sobem para a nuvem)");
  host.appendChild(drop);
  ["dragover","dragenter"].forEach(function(ev){ drop.addEventListener(ev, function(e){ e.preventDefault(); drop.classList.add("over"); }); });
  ["dragleave","drop"].forEach(function(ev){ drop.addEventListener(ev, function(e){ e.preventDefault(); drop.classList.remove("over"); }); });
  drop.addEventListener("drop", function(e){
    var files = [].slice.call(e.dataTransfer.files);
    if(!files.length) return;
    drop.textContent = "a enviar… 0/"+files.length;
    uploadMany(files, function(done,total){ drop.textContent = "a enviar… "+done+"/"+total; }, function(urls){
      urls.forEach(function(u){ arr.push({ src:u, tipo: isVid(u) ? "video" : "foto" }); });
      refresh();
    });
  });
}

function uploadMany(files, prog, done){
  var out = [], n = 0, folder = "media/" + (CUR && CUR.code ? CUR.code : "geral");
  function one(k){
    if(k >= files.length){ done(out); return; }
    var fd = new FormData();
    fd.append("file", files[k]);
    fd.append("folder", folder);
    fetch("/api/upload", { method:"POST", body:fd })
      .then(function(x){ return x.json(); })
      .then(function(j){
        if(j.url) out.push(j.url);
        else if(k === 0 && !out.length) alert("Upload indisponível: " + (j.error || "") + "\nUsa colar links por agora.");
        n++; prog(n, files.length); one(k+1);
      })
      .catch(function(){ n++; prog(n, files.length); one(k+1); });
  }
  one(0);
}

/* ---------- editor proposta ---------- */
function renderPropostaEditor(host, d){
  d.proposta = d.proposta || {};
  if(!d.proposta.secoes) d.proposta.secoes = [];
  var pr = d.proposta;

  var c = el("div","card"); c.innerHTML = '<h3>Proposta <span></span></h3>';
  c.appendChild(fieldEl("Validade (ex.: 15 dias)", inputEl("validade", pr.validade||"")));

  var sc = el("div"); c.appendChild(sc);
  function draw(){
    sc.innerHTML = "";
    pr.secoes.forEach(function(s, i){ sc.appendChild(secEditor(s, i, pr.secoes, draw)); });
    var add = el("div","addsec");
    [["texto","+ Texto"],["galeria","+ Galeria"],["cards","+ Cards"]].forEach(function(t){
      var b = el("button","btn sm",t[1]);
      b.onclick = function(){
        var ns = { texto:{ tipo:"texto", eyebrow:"", titulo:"", _para:"", _bul:"" },
                   galeria:{ tipo:"galeria", eyebrow:"", modo:"colagem", itens:[] },
                   cards:{ tipo:"cards", eyebrow:"", modo:"grelha", colunas:3, cards:[] } }[t[0]];
        pr.secoes.push(ns); draw();
      };
      add.appendChild(b);
    });
    sc.appendChild(add);
  }
  draw();
  host.appendChild(c);
}

function secEditor(s, i, arr, draw){
  var wrap = el("div","sec");
  var sh = el("div","sh");
  sh.innerHTML = '<span class="st">'+s.tipo+'</span><span class="sp">'+esc(s.eyebrow||"(sem título)")+'</span>';
  var up = el("button","btn ghost sm","▲"); up.onclick=function(){ if(i>0){ var t=arr[i-1];arr[i-1]=arr[i];arr[i]=t;draw(); } };
  var dn = el("button","btn ghost sm","▼"); dn.onclick=function(){ if(i<arr.length-1){ var t=arr[i+1];arr[i+1]=arr[i];arr[i]=t;draw(); } };
  var rm = el("button","btn ghost sm","✕"); rm.onclick=function(){ arr.splice(i,1); draw(); };
  sh.appendChild(up); sh.appendChild(dn); sh.appendChild(rm);
  wrap.appendChild(sh);

  var sb = el("div","sb"); wrap.appendChild(sb);
  sb.appendChild(fieldEl("Rótulo (eyebrow)", bind(inputEl("_e", s.eyebrow||""), function(v){ s.eyebrow=v; sh.querySelector(".sp").textContent = v||"(sem título)"; })));

  if(s.tipo === "texto"){
    sb.appendChild(fieldEl("Título grande (opcional)", bind(inputEl("_t", s.titulo||""), function(v){ s.titulo=v; })));
    var para = textareaEl("_p", s._para != null ? s._para : (s.paragrafos||[]).join("\n\n"));
    para.placeholder = "Parágrafos — separa com uma linha em branco";
    sb.appendChild(fieldEl("Parágrafos", bind(para, function(v){ s._para=v; s.paragrafos=paraToArr(v); })));
    s.paragrafos = paraToArr(para.value);
    var bul = textareaEl("_b", (s.bullets||[]).join("\n"));
    bul.placeholder = "Lista, um por linha (linhas em branco são ignoradas)";
    sb.appendChild(fieldEl("Lista de pontos", bindList(bul, function(a){ s.bullets = a; })));
    s.bullets = linesToArr(bul.value);
  }

  if(s.tipo === "galeria"){
    sb.appendChild(fieldEl("Modo", bind(selectEl("_m", s.modo||"colagem", [["colagem","Colagem"],["carrossel","Carrossel"]]), function(v){ s.modo=v; })));
    s.itens = s.itens || [];
    var g = el("div"); sb.appendChild(g);
    (function refr(){ imageList(g, s.itens, refr); })();
  }

  if(s.tipo === "cards"){
    var rr = el("div","row");
    rr.appendChild(fieldEl("Modo", bind(selectEl("_cm", s.modo||"grelha", [["grelha","Grelha"],["carrossel","Carrossel"]]), function(v){ s.modo=v; })));
    rr.appendChild(fieldEl("Colunas (grelha)", bind(inputEl("_cc", s.colunas||3, { type:"number" }), function(v){ s.colunas=parseInt(v)||3; })));
    sb.appendChild(rr);
    s.cards = s.cards || [];
    var cl = el("div"); sb.appendChild(cl);
    function drawCards(){
      cl.innerHTML = "";
      s.cards.forEach(function(cd, ci){ cl.appendChild(cardEditor(cd, ci, s.cards, drawCards)); });
      var ab = el("button","btn sm","+ Card"); ab.onclick=function(){ s.cards.push({ titulo:"", linhas:[] }); drawCards(); };
      cl.appendChild(ab);
    }
    drawCards();
  }
  return wrap;
}

function cardEditor(cd, i, arr, draw){
  var w = el("div","cardrow");
  var top = el("div","cr-top");
  var t = bind(inputEl("_ct", cd.titulo||""), function(v){ cd.titulo=v; }); t.placeholder="Título";
  var tg = el("div","grow"); tg.appendChild(t);
  var up = el("button","btn ghost sm","▲"); up.onclick=function(){ if(i>0){ var x=arr[i-1];arr[i-1]=arr[i];arr[i]=x;draw(); } };
  var dn = el("button","btn ghost sm","▼"); dn.onclick=function(){ if(i<arr.length-1){ var x=arr[i+1];arr[i+1]=arr[i];arr[i]=x;draw(); } };
  var rm = el("button","btn ghost sm","✕"); rm.onclick=function(){ arr.splice(i,1); draw(); };
  top.appendChild(tg); top.appendChild(up); top.appendChild(dn); top.appendChild(rm);
  w.appendChild(top);

  var r1 = el("div","row");
  r1.appendChild(fieldEl("Ícone", bind(selectEl("_ci", cd.icone||"", [["","(nenhum)"]].concat(ICON_KEYS.map(function(k){return [k,k];}))), function(v){ cd.icone=v||undefined; })));
  r1.appendChild(fieldEl("Preço", bind(inputEl("_cp", cd.preco||""), function(v){ cd.preco=v||undefined; })));
  var cor = bind(inputEl("_cor", cd.cor||"#C9A166", { type:"color" }), function(v){ cd.cor = v==="#c9a166"||v==="#C9A166" ? undefined : v; });
  r1.appendChild(fieldEl("Cor de destaque", cor));
  w.appendChild(r1);

  w.appendChild(fieldEl("Imagem (url)", bind(inputEl("_cim", cd.img||""), function(v){ cd.img=v||undefined; })));
  w.appendChild(fieldEl("Resumo (uma linha)", bind(inputEl("_cr", cd.resumo||""), function(v){ cd.resumo=v||undefined; })));
  var ln = textareaEl("_cl", (cd.linhas||[]).join("\n")); ln.placeholder = "O que inclui, um por linha (linhas em branco são ignoradas)";
  w.appendChild(fieldEl("Linhas", bindList(ln, function(a){ cd.linhas = a; })));
  cd.linhas = linesToArr(ln.value);
  var dh = el("label","check"); dh.innerHTML = '<input type="checkbox"'+(cd.destaque?" checked":"")+'> Destaque (com etiqueta)';
  dh.querySelector("input").addEventListener("change", function(){ cd.destaque = this.checked || undefined; });
  w.appendChild(dh);
  return w;
}

/* ============================ guardar ============================ */
function collectBase(){
  var d = CUR.data;
  d.type = $("#f-type").value;
  d.cliente = $("#f-cliente").value.trim();
  d.titulo = $("#f-titulo").value.trim();
  d.expira = $("#f-expira").value || undefined;
  d.intro = $("#f-intro").value.trim() || undefined;
  d.anon = $("#f-anon").checked || undefined;
  if(d.type === "triagem"){
    var ins = $("#f-instrucoes"); if(ins) d.instrucoes = ins.value.trim() || undefined;
    var fs = $("#f-formspree"); if(fs) d.formspree = fs.value.trim() || undefined;
  }
  if(d.type === "galeria"){
    var dz = $("#f-downloadTudo"); if(dz) d.downloadTudo = dz.value.trim() || undefined;
  }
  if(d.type === "proposta"){
    var val = $("#f-validade"); if(val) d.proposta.validade = val.value.trim() || undefined;
    // limpar campos internos _para/_bul
    (d.proposta.secoes||[]).forEach(function(s){ delete s._para; delete s._bul; });
    delete d.itens; delete d.instrucoes; delete d.formspree; delete d.downloadTudo;
  } else {
    delete d.proposta;
  }
  return d;
}
function doSave(){
  var msg = $("#saveMsg"); msg.className = "msg"; msg.textContent = "a guardar…";
  var d = collectBase();
  var code = CUR.isNew ? ($("#f-code").value.trim().toUpperCase() || CUR.code) : CUR.code;
  if(!/^[A-Z0-9_-]{3,32}$/.test(code)){ msg.className="msg bad"; msg.textContent="código inválido"; return; }
  api("PUT","pages/"+code, d).then(function(r){
    if(r.ok){
      CUR.code = code; CUR.isNew = false;
      msg.className = "msg ok"; msg.textContent = "guardado ✓  ·  asteris.pt/"+code;
    } else {
      msg.className = "msg bad"; msg.textContent = (r.j && r.j.error) || "erro";
    }
  });
}

/* ============================ campos ============================ */
function fieldEl(label, control){ var f = el("div","field"); f.appendChild(el("label",null,label)); f.appendChild(control); return f; }
function inputEl(name, val, o){ o=o||{}; var i=el("input"); i.id="f-"+name; if(o.cls)i.className=o.cls; i.type=o.type||"text"; if(o.disabled)i.disabled=true; i.value=(val==null?"":val); return i; }
function textareaEl(name, val){ var t=el("textarea"); t.id="f-"+name; t.value=(val==null?"":val); return t; }
function selectEl(name, val, opts){ var s=el("select"); s.id="f-"+name; opts.forEach(function(o){ var op=el("option"); op.value=o[0]; op.textContent=o[1]; if(o[0]===val)op.selected=true; s.appendChild(op); }); return s; }
function bind(node, fn){ var ev = node.tagName==="SELECT" ? "change" : "input"; node.addEventListener(ev, function(){ fn(node.value); }); return node; }
</script>
