function buildCardMenu(anchor, p, expirado, expDate){
  var items = [
    { head: p.code },
    { label: "Abrir link", href: "/" + p.code },
    { label: "Copiar link", onClick: function(){ copyLink(p.code); } },
    { label: "Editar", onClick: function(){ editView(p.code); } },
    { sep: true },
    { head: "Prazo" }
  ];
  if(p.expira){
    items.push({ label: "Estender +30 dias", onClick: function(){ extendExpira(p.code, 30, expirado, expDate); } });
    items.push({ label: "Estender +90 dias", onClick: function(){ extendExpira(p.code, 90, expirado, expDate); } });
    items.push({ label: "Definir data…",     onClick: function(){ pickExpira(p); } });
    items.push({ label: "Tornar permanente", onClick: function(){ setExpira(p.code, "", "tornou " + p.code + " permanente"); } });
  } else {
    items.push({ label: "Definir prazo…", onClick: function(){ pickExpira(p); } });
  }
  items.push({ sep: true });
  items.push({ label: "Excluir link", danger: true, onClick: function(){ askDeletePage(p); } });
  openMenu(anchor, items);
}
function extendExpira(code, days, expirado, expDate){
  var base = expirado ? new Date() : expDate;
  var nd = new Date(base.getTime() + days * 86400000).toISOString().slice(0, 10);
  setExpira(code, nd, "estendeu " + code + " +" + days + " dias (até " + nd + ")");
}
function pickExpira(p){
  promptModal({
    title: "Data de expiração",
    message: "O link " + (p.cliente || p.titulo || p.code) + " deixa de funcionar depois desta data.",
    label: "Data (AAAA-MM-DD)", type: "date", value: p.expira || "",
    ok: "Guardar",
    validate: function(v){ return /^\d{4}-\d{2}-\d{2}$/.test(v) ? "" : "Escolhe uma data."; }
  }).then(function(v){ if(v) setExpira(p.code, v, "definiu o prazo de " + p.code + " para " + v); });
}
function askDeletePage(p){
  confirmModal({
    title: "Excluir " + p.code + "?",
    message: (p.cliente || p.titulo || "Este link") + " deixa de funcionar imediatamente. Não dá para desfazer.",
    ok: "Excluir", danger: true
  }).then(function(yes){
    if(yes) api("DELETE", "pages/" + p.code).then(function(){ listView(); });
  });
}

/* ============================ nova página (modal) ============================ */
var NP_TYPES = [
  { k:"proposta",  t:"Proposta",  d:"Proposta comercial para um cliente" },
  { k:"portfolio", t:"Portfólio", d:"Galeria privada de trabalhos" },
  { k:"galeria",   t:"Entrega",   d:"Ficheiros finais para descarregar" },
  { k:"triagem",   t:"Seleção",   d:"O cliente escolhe fotos/vídeos" }
];
function skeletonFor(type, base){
  if(type === "proposta") return Object.assign({ type:"proposta", proposta:{ validade:"", secoes:[] } }, base);
  if(type === "portfolio") return Object.assign({ type:"portfolio", anon:true, itens:[] }, base);
  if(type === "galeria")  return Object.assign({ type:"galeria", anon:false, intro:"", itens:[] }, base);
  return Object.assign({ type:"triagem", intro:"", itens:[] }, base);
}
function itensFromFolder(folder){
  return (folder.files || []).map(function(f){ return { tipo: f.tipo === "video" ? "video" : "foto", src: f.url }; });
}
function newPageModal(preFolder, preType){
  var st = { type: preType || "proposta", code:randCode(6), perm:false, touchedPrazo:false, folder: preFolder || null };
  if(preFolder){
    var pt = preFolder.tag || (/entrega/i.test(preFolder.name) ? "entrega" : /selec/i.test(preFolder.name) ? "selecao" : "portfolio");
    st.type = pt === "entrega" ? "galeria" : pt === "selecao" ? "triagem" : "portfolio";
  }
  modal(function(box, close){
    box.innerHTML =
      '<h4>Nova página</h4>'
      + '<label>Tipo</label><div class="np-types"></div>'
      + '<div class="field"><label>Cliente</label><input id="np-cli" placeholder="Nome do cliente"></div>'
      + '<div class="field"><label>Título (opcional)</label><input id="np-tit" placeholder="ex. Proposta de conteúdo"></div>'
      + '<label style="margin-top:12px">Prazo</label><div class="radio-row" id="np-prazo">'
      +   '<label data-perm="1"><input type="radio" name="npp" hidden>Permanente</label>'
      +   '<label data-perm="0"><input type="radio" name="npp" hidden>Com prazo</label>'
      + '</div>'
      + '<div class="field" id="np-datef"><label>Expira em</label><input type="date" id="np-data"></div>'
      + '<label class="check" id="np-anon-row" style="margin-top:10px"><input type="checkbox" id="np-anon"> Anónima (esconde o nome do cliente)</label>'
      + '<button type="button" class="np-fromlib" id="np-lib">+ Usar pasta da biblioteca</button>'
      + '<label style="margin-top:12px">Código de acesso</label>'
      + '<div class="np-code"><span id="np-code">'+st.code+'</span><button type="button" id="np-newcode">gerar outro</button></div>'
      + '<div class="err" id="np-err"></div>'
      + '<div class="mrow"><button class="btn ghost" id="np-cancel">Cancelar</button><button class="btn gold" id="np-ok">Criar</button></div>';

    var tw = box.querySelector(".np-types");
    NP_TYPES.forEach(function(x){
      var b = el("button","np-type", "<b>"+x.t+"</b><span>"+x.d+"</span>");
      b.dataset.k = x.k;
      b.onclick = function(){ st.type = x.k; syncType(); };
      tw.appendChild(b);
    });
    function syncType(){
      box.querySelectorAll(".np-type").forEach(function(b){ b.classList.toggle("on", b.dataset.k === st.type); });
      box.querySelector("#np-anon-row").hidden = !(st.type === "portfolio" || st.type === "galeria");
      if(st.type === "portfolio"){ box.querySelector("#np-anon").checked = true; }
      if(!st.touchedPrazo) setPrazo(st.type === "portfolio");
    }
    function setPrazo(perm){
      st.perm = perm;
      box.querySelectorAll("#np-prazo label").forEach(function(l){ l.classList.toggle("on", (l.dataset.perm === "1") === perm); });
      box.querySelector("#np-datef").hidden = perm;
      var di = box.querySelector("#np-data");
      if(!perm && !di.value){
        var days = st.type === "proposta" ? 15 : 30;
        di.value = new Date(Date.now() + days*86400000).toISOString().slice(0,10);
      }
    }
    box.querySelectorAll("#np-prazo label").forEach(function(l){
      l.onclick = function(){ st.touchedPrazo = true; setPrazo(l.dataset.perm === "1"); };
    });
    box.querySelector("#np-newcode").onclick = function(){ st.code = randCode(6); box.querySelector("#np-code").textContent = st.code; };
    box.querySelector("#np-lib").onclick = function(){
      pickFolderModal().then(function(folder){
        if(!folder) return;
        st.folder = folder;
        var b = box.querySelector("#np-lib");
        b.classList.add("picked");
        b.textContent = "✓ " + folder.name + " (" + folder.count + " ficheiros)";
        // afinar o tipo pela pasta
        if(/entrega/i.test(folder.name)) st.type = "galeria";
        else if(/selec/i.test(folder.name)) st.type = "triagem";
        else if(/portf/i.test(folder.name)) st.type = "portfolio";
        syncType();
      });
    };
    box.querySelector("#np-cancel").onclick = function(){ close(); };
    box.querySelector("#np-ok").onclick = function(){
      var cli = box.querySelector("#np-cli").value.trim();
      var tit = box.querySelector("#np-tit").value.trim();
      var expira = st.perm ? "" : box.querySelector("#np-data").value;
      if(!st.perm && !/^\d{4}-\d{2}-\d{2}$/.test(expira)){ box.querySelector("#np-err").textContent = "Escolhe a data de expiração."; return; }
      var anonEl = box.querySelector("#np-anon");
      var base = { cliente: cli, titulo: tit, expira: expira };
      if(!box.querySelector("#np-anon-row").hidden) base.anon = !!anonEl.checked;
      var data = skeletonFor(st.type, base);
      if(st.folder && data.itens) data.itens = itensFromFolder(st.folder);
      var TL = { proposta:"proposta", galeria:"entrega", triagem:"seleção", portfolio:"portfólio" };
      data._log = "criou " + (TL[st.type] || st.type) + " " + st.code + (cli ? " · " + cli : "")
        + (st.folder ? " (da pasta " + st.folder.name + ")" : "");
      var ok = box.querySelector("#np-ok"); ok.disabled = true; ok.textContent = "A criar…";
      api("PUT", "pages/" + st.code, data).then(function(r){
        if(r.ok){ close(); editView(st.code); }
        else { box.querySelector("#np-err").textContent = (r.j && r.j.error) || "erro"; ok.disabled = false; ok.textContent = "Criar"; }
      });
    };
    if(st.folder){
      var lb = box.querySelector("#np-lib");
      lb.classList.add("picked");
      lb.textContent = "✓ " + st.folder.name + " (" + st.folder.count + " ficheiros)";
    }
    syncType();
    box.querySelector("#np-cli").focus();
  }, { cls: "lg" });
}

/* ============================ biblioteca ============================ */
var LIB_CACHE = null, LIB_TAB = "r2";
function loadLib(force){
  if(LIB_CACHE && !force) return Promise.resolve(LIB_CACHE);
  return api("GET","media").then(function(r){ LIB_CACHE = r.ok ? r.j : null; return LIB_CACHE; });
}
function allFolders(lib){
  if(!lib) return [];
  return [].concat((lib.r2 && lib.r2.folders) || [], (lib.ffmpeglab && lib.ffmpeglab.folders) || [], (lib.cloudinary && lib.cloudinary.folders) || []);
}
function libraryView(){
  closeMenu();
  $("#app").classList.remove("editing");
  var v = $("#view"); v.innerHTML = "";

  var head = el("div","view-head");
  head.innerHTML = '<div class="vh-sub">Ficheiros nas duas nuvens</div>';
  var cl = el("button","btn ghost", "Limpar expirados"); cl.onclick = function(){ runLimpezas(true); };
  var nf = el("button","btn gold", ICO_PLUS + "Nova pasta"); nf.onclick = function(){ newFolderModal(); };
  head.appendChild(cl); head.appendChild(nf); v.appendChild(head);

  var drop = el("div","lib-drop");
  drop.innerHTML = '<b>Arrasta ficheiros para aqui</b><button id="lib-pickfolder" style="color:var(--ink);background:none;border:0;text-decoration:underline">escolher uma pasta</button> · <button id="lib-pickfiles" style="color:var(--ink);background:none;border:0;text-decoration:underline">escolher ficheiros</button>';
  v.appendChild(drop);

  var subtabs = el("div","lib-subtabs"); v.appendChild(subtabs);
  var body = el("div"); v.appendChild(body);
  body.innerHTML = '<div class="lib-empty">a carregar…</div>';

  var fdir = el("input"); fdir.type = "file"; fdir.multiple = true; fdir.setAttribute("webkitdirectory",""); fdir.style.display = "none"; v.appendChild(fdir);
  var ffil = el("input"); ffil.type = "file"; ffil.multiple = true; ffil.style.display = "none"; v.appendChild(ffil);
  drop.querySelector("#lib-pickfolder").onclick = function(){ fdir.click(); };
  drop.querySelector("#lib-pickfiles").onclick = function(){ ffil.click(); };
  function fromInput(inp){
    var files = [].slice.call(inp.files);
    if(!files.length) return;
    var hint = files[0].webkitRelativePath ? files[0].webkitRelativePath.split("/")[0] : "";
    startFolderUpload(files, hint);
    inp.value = "";
  }
  fdir.onchange = function(){ fromInput(fdir); };
  ffil.onchange = function(){ fromInput(ffil); };

  ["dragenter","dragover"].forEach(function(e){ drop.addEventListener(e, function(ev){ ev.preventDefault(); drop.classList.add("over"); }); });
  ["dragleave","drop"].forEach(function(e){ drop.addEventListener(e, function(ev){ ev.preventDefault(); drop.classList.remove("over"); }); });
  drop.addEventListener("drop", function(ev){
    var files = [].slice.call(ev.dataTransfer.files || []);
    if(files.length) startFolderUpload(files, guessName(ev.dataTransfer));
  });

  loadLib(true).then(function(lib){
    body.innerHTML = "";
    if(!lib){ body.innerHTML = '<div class="lib-empty">Nenhuma nuvem ligada.</div>'; return; }
    var clouds = [
      { key:"r2", label:"R2 · Entregas", data: lib.r2 },
      { key:"ffmpeglab", label:"FFmpegLab · Entregas grandes", data: lib.ffmpeglab },
      { key:"cloudinary", label:"Cloudinary · Portfólio + Seleção", data: lib.cloudinary }
    ];
    function show(key){
      LIB_TAB = key; saveLibPrefs({ tab: key });
      subtabs.querySelectorAll("button").forEach(function(b){ b.classList.toggle("on", b.dataset.k === key); });
      var cl = clouds.filter(function(c){ return c.key === key; })[0].data;
      body.innerHTML = "";
      if(!cl || (!cl.bound && !cl.configured)){ body.appendChild(el("div","lib-empty","Esta nuvem não está ligada.")); return; }
      if(cl.error) body.appendChild(el("div","lib-empty","aviso: " + esc(cl.error)));
      var folders = (cl.folders || []).slice();
      if(!folders.length){ body.appendChild(el("div","lib-empty","Ainda sem pastas. Envia ficheiros acima.")); return; }

      var P = libPrefs();
      var tools = el("div","lib-tools");
      tools.innerHTML =
        '<select id="lt-sort">'
        +   '<option value="az">Nome A → Z</option><option value="za">Nome Z → A</option>'
        +   '<option value="count">Mais ficheiros</option><option value="size">Maior tamanho</option>'
        + '</select>'
        + '<select id="lt-tag">'
        +   '<option value="">Todas as tags</option><option value="entrega">Entrega</option>'
        +   '<option value="selecao">Seleção</option><option value="portfolio">Portfólio</option>'
        +   '<option value="outro">Outro</option><option value="none">Sem tag</option>'
        + '</select>'
        + '<span class="spacer"></span>'
        + '<span class="vm"><button data-vm="card" title="Cartões">&#9638;</button><button data-vm="list" title="Lista">&#9776;</button></span>';
      body.appendChild(tools);
      var host = el("div"); body.appendChild(host);

      var sortSel = tools.querySelector("#lt-sort"), tagSel = tools.querySelector("#lt-tag");
      sortSel.value = P.sort; tagSel.value = P.tag || "";
      tools.querySelectorAll(".vm button").forEach(function(b){ b.classList.toggle("on", b.dataset.vm === P.view); });

      function render(){
        var pr = libPrefs();
        var list = folders.filter(function(f){
          if(!pr.tag) return true;
          if(pr.tag === "none") return !f.tag;
          return f.tag === pr.tag;
        });
        list.sort(function(a, b){
          if(pr.sort === "za") return b.name.localeCompare(a.name);
          if(pr.sort === "count") return (b.count || 0) - (a.count || 0);
          if(pr.sort === "size") return (b.bytes || 0) - (a.bytes || 0);
          return a.name.localeCompare(b.name);
        });
        host.innerHTML = "";
        if(!list.length){ host.appendChild(el("div","lib-empty","Nenhuma pasta com este filtro.")); return; }
        if(pr.view === "list"){
          var wrap = el("div","lib-list");
          list.forEach(function(f){ wrap.appendChild(libFolderRow(f)); });
          host.appendChild(wrap);
        } else {
          var grid = el("div","lib-grid");
          list.forEach(function(f){ grid.appendChild(libFolderCard(f)); });
          host.appendChild(grid);
        }
      }
      sortSel.onchange = function(){ saveLibPrefs({ sort: this.value }); render(); };
      tagSel.onchange = function(){ saveLibPrefs({ tag: this.value }); render(); };
      tools.querySelectorAll(".vm button").forEach(function(b){
        b.onclick = function(){
          saveLibPrefs({ view: b.dataset.vm });
          tools.querySelectorAll(".vm button").forEach(function(x){ x.classList.toggle("on", x === b); });
          render();
        };
      });
      render();
    }
    clouds.forEach(function(c){
      var b = el("button","", c.label + "  " + (((c.data && c.data.folders) || []).length));
      b.dataset.k = c.key;
      b.onclick = function(){ closeMenu(); show(c.key); };
      subtabs.appendChild(b);
    });
    show(LIB_TAB || libPrefs().tab || "r2");
  });
}
function guessName(dt){
  try{ if(dt.items && dt.items[0]){ var e = dt.items[0].webkitGetAsEntry && dt.items[0].webkitGetAsEntry(); if(e && e.isDirectory) return e.name; } }catch(e){}
  return "";
}
function folderLink(f){
  return location.origin + "/api/media/view?f=" + encodeURIComponent(f.name) + "&c=" + f.cloud;
}
var TAG_LABEL = { entrega:"Entrega", selecao:"Seleção", portfolio:"Portfólio", outro:"Outro" };
function setFolderTag(f){
  modal(function(box, close){
    box.innerHTML = '<h4>Tag da pasta</h4><p>' + esc(f.name) + '</p><div class="radio-row" id="tg" style="flex-wrap:wrap">'
      + '<label data-t="entrega">Entrega</label><label data-t="selecao">Seleção</label>'

function renameFolder(f){
  promptModal({ title:"Renomear pasta", label:"Novo nome", value:f.name, ok:"Renomear" }).then(function(nome){
    nome = (nome||"").trim();
    if(!nome || nome === f.name) return;
    toast("A renomear…");
    var body = { cloud:f.cloud, from:f.name, to:nome };
    if(f.cloud === "cloudinary") body.items = (f.files||[]).map(function(x){ return { publicId:x.publicId, resourceType:x.resourceType }; });
    api("POST","media/rename-folder", body).then(function(r){
      if(r.ok){ toast("Pasta renomeada"); LIB_CACHE=null; libraryView(); }
      else noticeModal("Não deu para renomear", (r.j && r.j.error) || "Tenta outra vez.");
    });
  });
}
function deleteFolder(f){
  confirmModal({ title:"Apagar pasta?", message:'"'+f.name+'" e os '+f.count+' ficheiro(s) são apagados. Não dá para desfazer.', ok:"Apagar", danger:true })
    .then(function(yes){
      if(!yes) return;
      var done = function(r){
        if(r.ok || (r.j && r.j.ok)){ toast("Pasta apagada"); LIB_CACHE=null; libraryView(); }
        else noticeModal("Não deu para apagar", (r.j && r.j.error) || "Tenta outra vez.");
      };
      if(f.cloud === "r2"){
        api("DELETE","media/r2-folder/"+f.name.split("/").map(encodeURIComponent).join("/")).then(done);
      } else if(f.cloud === "ffmpeglab"){
        api("DELETE","media/ffmpeglab-folder/"+f.name.split("/").map(encodeURIComponent).join("/")).then(done);
      } else {
        api("DELETE","media/files", { cloud:"cloudinary", publicIds:(f.files||[]).map(function(x){ return { publicId:x.publicId, resourceType:x.resourceType }; }) }).then(done);
      }
    });
}

    files.forEach(function(file, i){

      t.addEventListener("pointerdown", function(e){
        if(e.target.closest(".fv-fa")) return;

        dragging = true; dragMode = !sel.has(i);
        apply(i, t, dragMode);
      });
      t.addEventListener("pointerenter", function(){ if(dragging) apply(i, t, dragMode); });
      t.querySelector(".fv-del1").onclick = function(e){ e.stopPropagation(); askDeleteFiles([i]); };
      t.querySelector(".fv-dl1").addEventListener("click", function(e){ e.stopPropagation(); });

    });
    window.addEventListener("pointerup", function(){ dragging = false; }, { once: false });

    function apply(i, t, on){
      if(on){ sel.add(i); t.classList.add("sel"); }
      else { sel.delete(i); t.classList.remove("sel"); }
      refresh();
    }
    function refresh(){
      var n = sel.size, alive = files.filter(function(x){ return !x._gone; }).length;
      bZip.disabled = !n; bNone.disabled = !n; bOnly.disabled = !n; bDel.disabled = !n;
      bZip.textContent = n ? "Descarregar " + n + " (.zip)" : "Descarregar (.zip)";
      bDel.textContent = n ? "Excluir " + n : "Excluir";
      bAll.classList.toggle("on", n === alive && n > 0);
      elCount.textContent = alive;
    }
    bAll.onclick = function(){
      var alive = grid.querySelectorAll(".fv-tile").length;
      var fill = sel.size !== alive;
      sel.clear();
      grid.querySelectorAll(".fv-tile").forEach(function(t){
        var i = +t.dataset.i;
        if(fill){ sel.add(i); t.classList.add("sel"); } else t.classList.remove("sel");
      });
      refresh();
    };
    bNone.onclick = function(){ sel.clear(); grid.querySelectorAll(".fv-tile").forEach(function(t){ t.classList.remove("sel"); }); grid.classList.remove("only"); bOnly.classList.remove("on"); refresh(); };
    bOnly.onclick = function(){ grid.classList.toggle("only"); bOnly.classList.toggle("on", grid.classList.contains("only")); };

    function askDeleteFiles(idxs){
      var list = idxs.filter(function(i){ return files[i] && !files[i]._gone; });
      if(!list.length) return;
      confirmModal({
        title: list.length === 1 ? "Apagar este ficheiro?" : "Apagar " + list.length + " ficheiros?",
        message: "Sai da nuvem e das páginas que o usarem. Não dá para desfazer.",
        ok: "Apagar", danger: true
      }).then(function(yes){
        if(!yes) return;
        var payload = { cloud: f.cloud };
        if(f.cloud === "r2") payload.keys = list.map(function(i){ return files[i].key; });
        else payload.publicIds = list.map(function(i){ return { publicId: files[i].publicId, resourceType: files[i].resourceType }; });
        prog.textContent = "a apagar…";
        api("DELETE", "media/files", payload).then(function(r){
          list.forEach(function(i){
            files[i]._gone = true; sel.delete(i);
            var t = grid.querySelector('.fv-tile[data-i="'+i+'"]'); if(t) t.remove();
          });
          LIB_CACHE = null;
          prog.textContent = "";
          toast((r.j && r.j.apagados != null ? r.j.apagados : list.length) + " apagado(s)");
          refresh();
          if(!grid.querySelector(".fv-tile")){ close(); libraryView(); }
        });
      });
    }
    bDel.onclick = function(){ askDeleteFiles(Array.from(sel)); };

    bZip.onclick = function(){
      var list = Array.from(sel).filter(function(i){ return files[i] && !files[i]._gone; }).map(function(i){ return files[i]; });
      if(!list.length) return;
      bZip.disabled = true; prog.textContent = "a preparar…";
      loadJSZip().then(function(JSZip){
        var zip = new JSZip(), done = 0, fail = 0;
        return Promise.all(list.map(function(file, k){
          return fetch(file.url).then(function(r){ if(!r.ok) throw 0; return r.blob(); })
            .then(function(bl){ zip.file(String(k+1).padStart(2,"0") + "-" + fileName(file.url), bl); })
            .catch(function(){ fail++; })
            .then(function(){ done++; prog.textContent = "a preparar… " + done + "/" + list.length; });
        })).then(function(){
          prog.textContent = "a comprimir…";
          return zip.generateAsync({ type:"blob" });
        }).then(function(blob){
          saveBlob(blob, f.name.split("/").pop() + ".zip");
          prog.textContent = fail ? (fail + " falharam") : "";
          bZip.disabled = false;
        });
      }).catch(function(){ prog.textContent = "erro ao preparar o zip"; bZip.disabled = false; });
    };
    refresh();
  });
}

/* entregas grandes vão para o FFmpegLab (50GB grátis), o resto fica no R2 */
var FFMPEGLAB_LIMIAR = 10 * 1024 * 1024 * 1024; // 10GB
function destForEntrega(files){
  var total = 0;
  for(var i = 0; i < files.length; i++) total += files[i].size || 0;
  return total > FFMPEGLAB_LIMIAR ? "ffmpeglab" : "r2";
}
function cloudLabel(dest){ return dest === "r2" ? "R2" : dest === "ffmpeglab" ? "FFmpegLab" : "Cloudinary"; }
/* varre as pastas agendadas (ver "apagar sozinho depois de X dias") e apaga as vencidas.
   `manual`=true mostra um toast do resultado (botão "Limpar expirados"); senão corre em silêncio
   (chamado no arranque, uma vez por dia, como um cron pobre já que as Pages Functions não têm agendador). */
function runLimpezas(manual){
  api("POST","limpezas/run").then(function(r){
    if(!r.ok){ if(manual) toast((r.j && r.j.error) || "Não foi possível limpar"); return; }
    var n = (r.j.apagadas || []).length;
    if(manual) toast(n ? n + " pasta(s) vencida(s) apagada(s)" : "Nada vencido para apagar");
    if(n){ LIB_CACHE = null; if(VIEW === "biblioteca") libraryView(); }
  });
}
function maybeRunLimpezasDiario(){
  try{
    var last = localStorage.getItem("asteris_limpezas_last");
    var today = new Date().toISOString().slice(0, 10);
    if(last === today) return;
    localStorage.setItem("asteris_limpezas_last", today);
  }catch(e){}
  runLimpezas(false);
}
/* `fallbackDest`: se o envio para `dest` falhar (nuvem em baixo, sem espaço, etc.),
   tenta uma vez essa outra nuvem antes de desistir do ficheiro — é o "backup" pedido. */
function uploadFiles(files, folder, dest, onProgress, fallbackDest){
  return new Promise(function(resolve){
    var ok = 0, fail = 0, i = 0;
    function viaFunction(file, useDest){
      var fd = new FormData();
      fd.append("file", file);
      fd.append("folder", folder);
      fd.append("dest", useDest);
      return fetch("/api/upload", { method:"POST", body:fd }).then(function(x){ return x.json(); }).then(function(j){ return !!j.url; });
    }
    /* ficheiros grandes (FFmpegLab): pede uma URL assinada e o browser envia direto ao bucket,
       sem passar pela nossa Function — assim não há limite de tamanho de pedido a bater. */
    function viaPresign(file){
      return fetch("/api/upload-url", { method:"POST", headers:{"content-type":"application/json"}, body: JSON.stringify({ folder: folder, filename: file.name }) })
        .then(function(x){ return x.json(); })
        .then(function(j){
          if(!j.url) return false;
          return fetch(j.url, { method:"PUT", body: file }).then(function(r){ return r.ok; });
        });
    }
    function attempt(file, useDest, isRetry){
      var go = useDest === "ffmpeglab" ? viaPresign(file) : viaFunction(file, useDest);
      return go
        .then(function(success){
          if(success) return true;
          if(!isRetry && fallbackDest && fallbackDest !== useDest) return attempt(file, fallbackDest, true);
          return false;
        })
        .catch(function(){
          if(!isRetry && fallbackDest && fallbackDest !== useDest) return attempt(file, fallbackDest, true);
          return false;
        });
    }
    function next(){
      if(i >= files.length){ resolve({ ok: ok, fail: fail }); return; }
      attempt(files[i], dest, false).then(function(success){
        if(success) ok++; else fail++;
        i++; onProgress && onProgress(i, files.length); next();
      });
    }
    next();
  });
}

function uploadMany(files, prog, done){
  var out = [], n = 0, folder = "media/" + (CUR && CUR.code ? CUR.code : "geral");
  // entregas -> R2 (downloads grátis) ; portfólio / seleção / proposta -> Cloudinary (otimização)
  var dest = (CUR && CUR.data && CUR.data.type === "galeria" && CUR.data.anon !== true) ? "r2" : "cloudinary";
  function one(k){
    if(k >= files.length){ done(out); return; }
    var fd = new FormData();
    fd.append("file", files[k]);
    fd.append("folder", folder);
    fd.append("dest", dest);
    fetch("/api/upload", { method:"POST", body:fd })
      .then(function(x){ return x.json(); })
      .then(function(j){
        if(j.url) out.push(j.url);
        else if(k === 0 && !out.length) noticeModal("Upload indisponível", (j.error || "") + " Por agora, cola o URL de cada ficheiro.");
        n++; prog(n, files.length); one(k+1);
      })
      .catch(function(){ n++; prog(n, files.length); one(k+1); });
  }
  one(0);
}

/* ---------- caixa de upload de 1 ficheiro (imagem ou vídeo) ---------- */
function mediaBox(o){
  var field = el("div","field");
  field.appendChild(el("label", null, o.label));
  var box = el("div","logobox" + (o.wide ? " wide" : ""));
  var file = el("input"); file.type = "file"; file.accept = o.accept || "image/*"; file.style.display = "none";
  var isVideo = function(u){ return /\.(mp4|webm|mov|m4v)(\?|$)/i.test(u || ""); };
  function paint(){
    var v = o.get();
    box.classList.toggle("has", !!v);
    if(!v){ box.innerHTML = '<span>+ ficheiro</span>'; return; }
    box.innerHTML = (isVideo(v) ? '<video src="'+v+'" muted></video>' : '<img src="'+v+'" alt="">')
      + '<button type="button" class="rm" aria-label="Remover">&times;</button>';
    box.querySelector(".rm").onclick = function(e){ e.stopPropagation(); o.set(""); paint(); };
  }
  box.onclick = function(e){ if(!e.target.closest(".rm")) file.click(); };
  file.onchange = function(){
    var f = file.files && file.files[0]; if(!f) return;
    box.innerHTML = '<span>a enviar…</span>';
    uploadMany([f], function(){}, function(urls){
      if(urls && urls[0]) o.set(urls[0]);
      paint();
      file.value = "";
    });
  };
  paint();
  field.appendChild(box);
  field.appendChild(file);
  return field;
}

/* ---------- editor proposta ---------- */
function renderPropostaEditor(host, d){
  d.proposta = d.proposta || {};
  if(!d.proposta.secoes) d.proposta.secoes = [];
  var pr = d.proposta;

  var c = el("div","card"); c.innerHTML = '<h3>Proposta <span></span></h3>';

  c.appendChild(mediaBox({
    label: "Imagem / logo do cliente (quadrado centrado no topo)",
    accept: "image/*",
    get: function(){ return pr.logo; },
    set: function(v){ pr.logo = v || undefined; }
  }));
  c.appendChild(mediaBox({
    label: "Fundo do topo (foto ou vídeo atrás do título)",
    accept: "image/*,video/*",
    wide: true,
    get: function(){ return d.capa; },
    set: function(v){ d.capa = v || undefined; }
  }));

  c.appendChild(fieldEl("Validade (ex.: 15 dias)", inputEl("validade", pr.validade||"")));

  var sc = el("div"); c.appendChild(sc);
  function draw(){
    sc.innerHTML = "";
    pr.secoes.forEach(function(s, i){ sc.appendChild(secEditor(s, i, pr.secoes, draw)); });
    var add = el("div","addsec");
    [["texto","+ Texto"],["galeria","+ Galeria"],["cards","+ Cards"]].forEach(function(t){
      var b = el("button","btn sm",t[1]);
      b.onclick = function(){
        var ns = { texto:{ tipo:"texto", eyebrow:"", titulo:"", _para:"", _bul:"" },
                   galeria:{ tipo:"galeria", eyebrow:"", modo:"colagem", itens:[] },
                   cards:{ tipo:"cards", eyebrow:"", modo:"grelha", colunas:3, cards:[] } }[t[0]];
        pr.secoes.push(ns); draw();
      };
      add.appendChild(b);
    });
    sc.appendChild(add);
  }
  draw();
  host.appendChild(c);
}

function secEditor(s, i, arr, draw){
  var wrap = el("div","sec");
  var sh = el("div","sh");
  sh.innerHTML = '<span class="st">'+s.tipo+'</span><span class="sp">'+esc(s.eyebrow||"(sem título)")+'</span>';
  var up = el("button","btn ghost sm","▲"); up.onclick=function(){ if(i>0){ var t=arr[i-1];arr[i-1]=arr[i];arr[i]=t;draw(); } };
  var dn = el("button","btn ghost sm","▼"); dn.onclick=function(){ if(i<arr.length-1){ var t=arr[i+1];arr[i+1]=arr[i];arr[i]=t;draw(); } };
  var rm = el("button","btn ghost sm","✕"); rm.onclick=function(){ arr.splice(i,1); draw(); };
  sh.appendChild(up); sh.appendChild(dn); sh.appendChild(rm);
  wrap.appendChild(sh);

  var sb = el("div","sb"); wrap.appendChild(sb);
  sb.appendChild(fieldEl("Rótulo (eyebrow)", bind(inputEl("_e", s.eyebrow||""), function(v){ s.eyebrow=v; sh.querySelector(".sp").textContent = v||"(sem título)"; })));

  if(s.tipo === "texto"){
    sb.appendChild(fieldEl("Título grande (opcional)", bind(inputEl("_t", s.titulo||""), function(v){ s.titulo=v; })));
    var para = textareaEl("_p", s._para != null ? s._para : (s.paragrafos||[]).join("\n\n"));
    para.placeholder = "Parágrafos — separa com uma linha em branco";
    sb.appendChild(fieldEl("Parágrafos", bind(para, function(v){ s._para=v; s.paragrafos=paraToArr(v); })));
    s.paragrafos = paraToArr(para.value);
    var bul = textareaEl("_b", (s.bullets||[]).join("\n"));
    bul.placeholder = "Lista, um por linha (linhas em branco são ignoradas)";
    sb.appendChild(fieldEl("Lista de pontos", bindList(bul, function(a){ s.bullets = a; })));
    s.bullets = linesToArr(bul.value);
  }

  if(s.tipo === "galeria"){
    sb.appendChild(fieldEl("Modo", bind(selectEl("_m", s.modo||"colagem", [["colagem","Colagem"],["carrossel","Carrossel"]]), function(v){ s.modo=v; })));
    s.itens = s.itens || [];
    var g = el("div"); sb.appendChild(g);
    (function refr(){ imageList(g, s.itens, refr); })();
  }

  if(s.tipo === "cards"){
    var rr = el("div","row");
    rr.appendChild(fieldEl("Modo", bind(selectEl("_cm", s.modo||"grelha", [["grelha","Grelha"],["carrossel","Carrossel"]]), function(v){ s.modo=v; })));
    rr.appendChild(fieldEl("Colunas (grelha)", bind(inputEl("_cc", s.colunas||3, { type:"number" }), function(v){ s.colunas=parseInt(v)||3; })));
    sb.appendChild(rr);
    s.cards = s.cards || [];
    var cl = el("div"); sb.appendChild(cl);
    function drawCards(){
      cl.innerHTML = "";
      s.cards.forEach(function(cd, ci){ cl.appendChild(cardEditor(cd, ci, s.cards, drawCards)); });
      var ab = el("button","btn sm","+ Card"); ab.onclick=function(){ s.cards.push({ titulo:"", linhas:[] }); drawCards(); };
      cl.appendChild(ab);
    }
    drawCards();
  }
  return wrap;
}

/* ============================ guardar ============================ */
function collectBase(){
  var d = CUR.data;
  d.type = $("#f-type").value;
  d.cliente = $("#f-cliente").value.trim();
  d.titulo = $("#f-titulo").value.trim();
  d.expira = $("#f-expira").value || undefined;
  d.intro = $("#f-intro").value.trim() || undefined;
  d.anon = $("#f-anon").checked || undefined;
  if(d.type === "triagem"){
    var ins = $("#f-instrucoes"); if(ins) d.instrucoes = ins.value.trim() || undefined;
    var fs = $("#f-formspree"); if(fs) d.formspree = fs.value.trim() || undefined;
  }
  if(d.type === "galeria"){
    var dz = $("#f-downloadTudo"); if(dz) d.downloadTudo = dz.value.trim() || undefined;
  }
  if(d.type === "proposta"){
    var val = $("#f-validade"); if(val) d.proposta.validade = val.value.trim() || undefined;
    // limpar campos internos _para/_bul
    (d.proposta.secoes||[]).forEach(function(s){ delete s._para; delete s._bul; });
    delete d.itens; delete d.instrucoes; delete d.formspree; delete d.downloadTudo;
  } else {
    delete d.proposta;
  }
  return d;
}
function doSave(){
  var msg = $("#saveMsg"); msg.className = "msg"; msg.textContent = "a guardar…";
  var d = collectBase();
  var code = CUR.isNew ? ($("#f-code").value.trim().toUpperCase() || CUR.code) : CUR.code;
  if(!/^[A-Z0-9_-]{3,32}$/.test(code)){ msg.className="msg bad"; msg.textContent="código inválido"; return; }
  d._log = (CUR.isNew ? "criou" : "editou o conteúdo de") + " " + code + (d.cliente ? " · " + d.cliente : "");
  api("PUT","pages/"+code, d).then(function(r){
    if(r.ok){
      CUR.code = code; CUR.isNew = false;
      msg.className = "msg ok"; msg.textContent = "guardado ✓  ·  asteris.pt/"+code;
    } else {
      msg.className = "msg bad"; msg.textContent = (r.j && r.j.error) || "erro";
    }
  });
}

/* ============================ campos ============================ */
function fieldEl(label, control){ var f = el("div","field"); f.appendChild(el("label",null,label)); f.appendChild(control); return f; }
function inputEl(name, val, o){ o=o||{}; var i=el("input"); i.id="f-"+name; if(o.cls)i.className=o.cls; i.type=o.type||"text"; if(o.disabled)i.disabled=true; i.value=(val==null?"":val); return i; }
function textareaEl(name, val){ var t=el("textarea"); t.id="f-"+name; t.value=(val==null?"":val); return t; }
function selectEl(name, val, opts){ var s=el("select"); s.id="f-"+name; opts.forEach(function(o){ var op=el("option"); op.value=o[0]; op.textContent=o[1]; if(o[0]===val)op.selected=true; s.appendChild(op); }); return s; }
function bind(node, fn){ var ev = node.tagName==="SELECT" ? "change" : "input"; node.addEventListener(ev, function(){ fn(node.value); }); return node; }

/* ============================ coleções: clientes / tarefas / contratos / agenda ============================ */
function col(name){ return api("GET","col/"+name).then(function(r){ return (r.j && r.j.items) || []; }); }
function colPut(name, id, obj){ return api("PUT","col/"+name+"/"+id, obj); }
function colDel(name, id){ return api("DELETE","col/"+name+"/"+id); }
function newId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
/* fecha + refresca só se guardou; senão avisa e mantém o formulário aberto */
function afterSave(pr, close, refresh){
  return pr.then(function(r){
    if(r && r.ok){ toast("Guardado"); if(close) close(); if(refresh) refresh(); return true; }
    toast((r && r.j && r.j.error) || "Não foi possível guardar");
    return false;
  });
}
function fmtDate(s){
  if(!s) return "—";
  var d = new Date(s.length <= 10 ? s + "T00:00:00" : s);
  return isNaN(d) ? s : d.toLocaleDateString("pt-PT", { day:"2-digit", month:"short", year:"numeric" });
}
function frow(label, id, val){ return '<div class="field"><label>' + label + '</label><input id="' + id + '" value="' + esc(val||"") + '"></div>'; }
function rowMenu(anchor, onEdit, delName, delId, after, delTitle){
  openMenu(anchor, [
    { label:"Editar", onClick:onEdit },
    { sep:true },
    { label:"Apagar", danger:true, onClick:function(){
        confirmModal({ title: delTitle || "Apagar?", message:"Não dá para desfazer.", ok:"Apagar", danger:true })
          .then(function(y){ if(y) colDel(delName, delId).then(after); });
    } }
  ]);
}

/* ---------------- TAREFAS ---------------- */
var TAREFA_ESTADOS = [["afazer","A fazer"],["curso","Em curso"],["feito","Feito"]];
function tarefasView(){
  var v = $("#view"); v.innerHTML = "";
  var head = el("div","view-head");
  head.innerHTML = '<div class="vh-sub">O que está por fazer</div>';
  var add = el("button","btn gold", ICO_PLUS + "Tarefa"); add.onclick = function(){ tarefaForm(); };
  head.appendChild(add); v.appendChild(head);

  var list = el("div","card-list"); list.innerHTML = '<div class="wide-empty">a carregar…</div>'; v.appendChild(list);
  col("tarefas").then(function(items){
    list.innerHTML = "";
    if(!items.length){ list.appendChild(el("div","wide-empty","Sem tarefas.")); return; }
    items.sort(function(a,b){
      if((a.estado==="feito") !== (b.estado==="feito")) return a.estado==="feito" ? 1 : -1;
      return (a.prazo||"9999-99").localeCompare(b.prazo||"9999-99");
    });
    items.forEach(function(t){
      var done = t.estado === "feito";
      var alta = t.prioridade === "alta" && !done;
      var row = el("div","lcard" + (done ? " lc-done" : "") + (alta ? " lc-prio" : ""));
      var estLbl = (TAREFA_ESTADOS.filter(function(e){ return e[0]===t.estado; })[0] || ["","A fazer"])[1];
      var sub = [estLbl].concat(t.cliente ? [t.cliente] : []).join(" · ");
      row.innerHTML =
        '<div class="lc-lead"><button class="lc-ck" aria-label="Concluir">' + (done ? "&#10003;" : "") + '</button></div>'
        + '<div class="lc-nm">' + esc(t.titulo || "—") + '</div>'
        + '<div class="lc-sub">' + esc(sub) + '</div>'
        + '<div class="lc-aside"><button class="menu-btn" aria-label="Ações">&#8942;</button></div>'
        + cbar('', (!done && t.prazo ? dateChip(t.prazo, 3) : '')
            + (alta ? '<span class="chip bad">Alta</span>' : '')
            + scopeChip(t.scope));
      row.querySelector(".lc-ck").onclick = function(e){ e.stopPropagation(); colPut("tarefas", t.id, { estado: done ? "afazer" : "feito" }).then(tarefasView); };
      var mb = row.querySelector(".menu-btn");
      mb.onclick = function(e){ e.stopPropagation(); rowMenu(mb, function(){ tarefaForm(t); }, "tarefas", t.id, tarefasView, "Apagar tarefa?"); };
      row.addEventListener("click", function(e){ if(!e.target.closest(".menu-btn") && !e.target.closest(".lc-ck")) tarefaForm(t); });
      list.appendChild(row);
    });
  });
}

var CAL_MONTH = null;
function calendarioView(){

  col("agenda").then(function(items){
    renderCalGrid(gridBox, items);
    renderTimeline(tl, items);
  });
}
function renderCalGrid(box, items){
  var m = CAL_MONTH, y = m.getFullYear(), mon = m.getMonth();
  var startDow = (new Date(y, mon, 1).getDay() + 6) % 7;
  var daysInMonth = new Date(y, mon+1, 0).getDate();
  var todayStr = new Date().toISOString().slice(0,10);
  var byDay = {};
  items.forEach(function(a){ if(a.data){ (byDay[a.data] = byDay[a.data] || []).push(a); } });

  var dows = ["Seg","Ter","Qua","Qui","Sex","Sáb","Dom"].map(function(d){ return '<div class="dow">'+d+'</div>'; }).join("");
  var cells = "";
  for(var i=0;i<startDow;i++) cells += '<div class="cal-cell out"></div>';
  for(var day=1; day<=daysInMonth; day++){
    var ds = y + "-" + String(mon+1).padStart(2,"0") + "-" + String(day).padStart(2,"0");
    var ev = byDay[ds] || [];
    var cls = "cal-cell" + (ds===todayStr ? " today" : "") + (ev.length ? " has" : "");
    var pips = ev.length ? '<div class="pips">' + ev.slice(0,3).map(function(){ return '<i></i>'; }).join("") + '</div>' : '';
    cells += '<div class="' + cls + '" data-day="' + ds + '">' + day + pips + '</div>';
  }
  box.innerHTML = '<div class="cal-nav"><button data-d="-1">‹</button><b>'
    + m.toLocaleDateString("pt-PT",{ month:"long", year:"numeric" })
    + '</b><button data-d="1">›</button></div><div class="cal-days">' + dows + cells + '</div>';
  box.querySelectorAll(".cal-nav button").forEach(function(b){
    b.onclick = function(){ CAL_MONTH = new Date(y, mon + (+b.dataset.d), 1); calendarioView(); };
  });
  box.querySelectorAll(".cal-cell.has").forEach(function(c){
    c.onclick = function(){ agendaDayModal(c.dataset.day, byDay[c.dataset.day] || []); };
  });
}
function renderTimeline(box, items){
  var today = new Date().toISOString().slice(0,10);
  var up = items.filter(function(a){ return a.data && a.data >= today; })
    .sort(function(a,b){ return (a.data + (a.hora||"")).localeCompare(b.data + (b.hora||"")); }).slice(0,20);
  box.innerHTML = '<div class="dash-h">Próximos</div>';
  if(!up.length){ box.appendChild(el("div","wide-empty","Sem compromissos futuros.")); return; }
  var lastDay = "";
  up.forEach(function(a){
    if(a.data !== lastDay){ lastDay = a.data; box.appendChild(Object.assign(el("div","tl-day"), { textContent: fmtDate(a.data) })); }
    var it = el("div","tl-item");
    it.appendChild(Object.assign(el("div","tl-time"), { textContent: a.hora || "—" }));
    var b = el("div","tl-body");
    b.appendChild(Object.assign(el("div","tl-t"), { textContent: a.titulo || "—" }));

    mb.onclick = function(e){ e.stopPropagation(); rowMenu(mb, function(){ agendaForm(a); }, "agenda", a.id, calendarioView, "Apagar compromisso?"); };
    it.appendChild(mb);
    box.appendChild(it);
  });
}

/* ============================ espaço partilhado / privado ============================ */
var SCOPE_VIEW = "todos";
function scopeRow(cur){
  return '<div class="field"><label>Visibilidade</label><div class="radio-row" id="sc-row">'
    + '<label data-s="partilhado"' + (cur !== "privado" ? ' class="on"' : '') + '>' + ICN.partilhado + 'Partilhado (equipa)</label>'
    + '<label data-s="privado"' + (cur === "privado" ? ' class="on"' : '') + '>' + ICN.privado + 'Privado (só eu)</label>'
    + '</div></div>';
}
function bindScope(box){
  var row = box.querySelector("#sc-row");
  if(!row) return function(){ return "partilhado"; };
  row.querySelectorAll("label").forEach(function(l){
    l.onclick = function(){ row.querySelectorAll("label").forEach(function(x){ x.classList.toggle("on", x === l); }); };
  });
  return function(){ var on = row.querySelector("label.on"); return on ? on.dataset.s : "partilhado"; };
}
function scopeTabs(onChange){
  var w = el("div","scope-tabs");
  [["todos","Tudo",""],["partilhado","Partilhado",ICN.partilhado],["privado","Privado",ICN.privado]].forEach(function(t){
    var b = el("button", SCOPE_VIEW === t[0] ? "on" : "", (t[2] || "") + t[1]);
    b.onclick = function(){ SCOPE_VIEW = t[0]; onChange(); };
    w.appendChild(b);
  });
  return w;
}
function scopeMatch(x){
  if(SCOPE_VIEW === "todos") return true;
  if(SCOPE_VIEW === "privado") return x.scope === "privado";
  return x.scope !== "privado";
}
function mdRender(t){
  var e = function(s){ return String(s).replace(/[&<>]/g, function(c){ return { "&":"&amp;","<":"&lt;",">":"&gt;" }[c]; }); };
  var inl = function(s){
    return s.replace(/`([^`]+)`/g, '<code>$1</code>')
            .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
            .replace(/(^|[\s(])_([^_]+)_(?=[\s.,;:)!?]|$)/g, "$1<em>$2</em>")
            .replace(/\[([^\]]+)\]\((https?:[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  };
  var out = [], inList = false;
  (t || "").split("\n").forEach(function(ln){
    var h = ln.match(/^#{1,6}\s+(.*)/);
    if(h){ if(inList){ out.push("</ul>"); inList = false; } out.push("<h3>" + inl(e(h[1])) + "</h3>"); return; }
    var li = ln.match(/^\s*[-*]\s+(.*)/);
    if(li){ if(!inList){ out.push("<ul>"); inList = true; } out.push("<li>" + inl(e(li[1])) + "</li>"); return; }
    if(inList){ out.push("</ul>"); inList = false; }
    var q = ln.match(/^>\s?(.*)/);
    if(q){ out.push('<blockquote style="border-left:2px solid var(--edge2);padding-left:10px;margin:6px 0;color:var(--faint)">' + inl(e(q[1])) + '</blockquote>'); return; }
    out.push(inl(e(ln)));
  });
  if(inList) out.push("</ul>");
  return out.join("\n");
}

/* ============================ PAGAMENTOS ============================ */
function fmtMoney(n){
  var v = Number(n);
  if(!isFinite(v)) return "—";
  try{ return v.toLocaleString("pt-PT", { style:"currency", currency:"EUR", maximumFractionDigits: (v % 1 ? 2 : 0) }); }
  catch(e){ return v.toFixed(2) + " EUR"; }
}
/* "1 900 EUR / mês" -> 1900 */
function parseValor(s){
  var m = String(s || "").replace(/\s/g,"").replace(",",".").match(/-?\d+(\.\d+)?/);
  return m ? parseFloat(m[0]) : null;
}
function pagEstado(p){
  if(p.pago || p.estado === "pago") return "pago";
  var d = daysUntil(p.vencimento);
  if(d != null && d < 0) return "atraso";
  return "pendente";
}
var PAG_LBL = { pago:"Pago", pendente:"Pendente", atraso:"Em atraso" };
var PAG_CHIP = { pago:"chip ok", pendente:"chip", atraso:"chip bad" };
var MET_PAG = ["Transferência bancária", "MB Way", "Multibanco", "Numerário", "Cartão", "Outro"];
function metSelect(id, cur){
  return '<select id="' + id + '"><option value="">—</option>'
    + MET_PAG.map(function(m){ return '<option' + (cur === m ? " selected" : "") + '>' + m + '</option>'; }).join("")
    + '</select>';
}
function ymd(y, m, d){ var dt = new Date(y, m, d); return dt.getFullYear() + "-" + String(dt.getMonth()+1).padStart(2,"0") + "-" + String(dt.getDate()).padStart(2,"0"); }
function mesNome(y, m){ return new Date(y, m, 1).toLocaleDateString("pt-PT", { month:"long", year:"numeric" }); }
/* dado um contrato com c.pag, devolve as operações (Promises) para sincronizar
   os pagamentos que ele gera. Regenera os pendentes, nunca toca nos pagos. */
function buildContratoPagamentos(c, existentes){
  var ops = [];
  var mine = (existentes || []).filter(function(p){ return p.contrato === c.id && p.origem === "contrato"; });
  mine.forEach(function(p){ if(pagEstado(p) !== "pago") ops.push(colDel("pagamentos", p.id)); });
  var pagos = mine.filter(function(p){ return pagEstado(p) === "pago"; });
  var pg = c.pag;
  if(!pg || pg.tipo === "nenhum" || !pg.tipo || !(Number(pg.valor) > 0)) return ops;
  var jaTem = function(venc){ return pagos.some(function(p){ return String(p.vencimento).slice(0,7) === String(venc).slice(0,7); }); };
  var base = { contrato:c.id, contratoTitulo:c.titulo || c.cliente || "", cliente:c.cliente || "",
    valor:Number(pg.valor), metodo:pg.metodo || "", origem:"contrato", scope:c.scope || "partilhado",
    emitido:"", estado:"pendente", pago:false, dataPagamento:"", notas:"" };
  if(pg.tipo === "unico"){
    var venc = pg.data || c.inicio || "";
    if(venc && !jaTem(venc)) ops.push(colPut("pagamentos", newId(), Object.assign({}, base, { descricao:(c.titulo || "Contrato"), vencimento:venc })));
    return ops;
  }
  // recorrente
  var dia = Math.min(28, Math.max(1, parseInt(pg.dia, 10) || 1));
  var start = String(c.inicio || "").slice(0, 7);
  if(!start){ var t = new Date(); start = t.getFullYear() + "-" + String(t.getMonth()+1).padStart(2,"0"); }
  var sp = start.split("-"), y = +sp[0], mo = +sp[1] - 1, n;
  if(c.fim){ var ep = String(c.fim).slice(0,7).split("-"); n = (+ep[0] - y) * 12 + (+ep[1] - 1 - mo) + 1; }
  else { n = parseInt(pg.meses, 10) || 12; }
  n = Math.min(36, Math.max(1, n));
  for(var i = 0; i < n; i++){
    var vc = ymd(y, mo + i, dia);
    if(jaTem(vc)) continue;
    ops.push(colPut("pagamentos", newId(), Object.assign({}, base, {
      descricao:(c.titulo || "Contrato") + " · " + mesNome(y, mo + i), vencimento:vc, recorrente:true
    })));
  }
  return ops;
}

    var ws = res[0].filter(scopeMatch), notas = res[1];
    grid.innerHTML = "";
    if(!ws.length){ grid.appendChild(el("div","wide-empty","Ainda sem workspaces. Cria o primeiro — um por projeto ou ideia.")); return; }
    ws.forEach(function(w){
      var nN = notas.filter(function(n){ return n.workspace === w.id; }).length;
      var nF = (w.ficheiros || []).length;
      var lk = w.cliente || w.pagina;
      var c = el("div","gcard");
      c.innerHTML =
        '<span class="g-bar" style="background:' + corOf(w) + '"></span>'
        + '<button class="menu-btn" aria-label="Ações">&#8942;</button>'
        + '<div class="g-nm">' + esc(w.titulo || "(sem título)") + '</div>'
        + '<div class="g-body"><div class="g-desc">' + esc(w.descricao || "") + '</div></div>'
        + cbar(
            '<span>' + ICN.nota + nN + '</span><span>' + ICN.ficheiro + nF + '</span>',
            (w.tag ? tagChip(w.tagIcone, corOf(w), w.tag) : '') + scopeChip(w.scope) + (lk ? linkIconChip(lk) : '')
          );
      var mb = c.querySelector(".menu-btn");
      mb.onclick = function(e){ e.stopPropagation(); rowMenu(mb, function(){ workspaceForm(w); }, "workspaces", w.id, workspacesView, "Apagar workspace? As notas dentro dele não são apagadas."); };
      c.addEventListener("click", function(e){ if(!e.target.closest(".menu-btn")) workspaceView(w); });
      grid.appendChild(c);
    });
  });
}

function workspaceView(w){
  var v = $("#view"); v.innerHTML = "";
  var back = el("button","btn ghost back","← Workspaces"); back.onclick = workspacesView; v.appendChild(back);

  var hd = el("div","ws-head"); hd.style.borderLeftColor = corOf(w);
  var links = "";
  if(w.tag) links += tagChip(w.tagIcone, corOf(w), w.tag);
  links += scopeChip(w.scope);
  if(w.cliente) links += '<a data-go="clientes">' + ICO_LINK + '<span>' + esc(w.cliente) + '</span></a>';
  if(w.pagina) links += '<a data-code="' + esc(w.pagina) + '">' + ICO_LINK + '<span>' + esc(w.pagina) + '</span></a>';
  hd.innerHTML = '<div class="wh-t">' + esc(w.titulo || "") + '</div>'
    + (w.descricao ? '<div class="wh-desc">' + esc(w.descricao) + '</div>' : '')
    + (links ? '<div class="wh-links">' + links + '</div>' : '');
  var ed = el("button","btn ghost sm","Editar workspace"); ed.style.marginTop = "12px";
  ed.onclick = function(){ workspaceForm(w); };
  hd.appendChild(ed);
  v.appendChild(hd);
  hd.querySelectorAll("[data-code]").forEach(function(a){ a.onclick = function(){ editView(a.dataset.code); }; });
  hd.querySelectorAll("[data-go]").forEach(function(a){ a.onclick = function(){ openView(a.dataset.go); }; });

  /* notas do espaço */
  var sh1 = el("div","ws-sec-h");
  sh1.innerHTML = '<b>Notas</b>';
  var addN = el("button","btn gold sm", ICO_PLUS + "Nota");
  addN.onclick = function(){ notaEditor({ workspace: w.id, scope: w.scope }, false); };
  sh1.appendChild(addN); v.appendChild(sh1);
  var nlist = el("div","card-list"); nlist.innerHTML = '<div class="wide-empty">a carregar…</div>'; v.appendChild(nlist);
  col("notas").then(function(items){
    var mine = items.filter(function(n){ return n.workspace === w.id; });
    nlist.innerHTML = "";
    if(!mine.length){ nlist.appendChild(el("div","wide-empty","Sem notas neste espaço.")); return; }
    mine.forEach(function(n){
      var prev = (n.corpo || "").replace(/[#*`>_-]/g,"").replace(/\s+/g," ").trim().slice(0,140);
      var c = el("div","lcard");
      c.innerHTML =
        '<div class="lc-lead"><span class="itag">' + ICN.nota + '</span></div>'
        + '<div class="lc-nm">' + esc(n.titulo || "(sem título)") + '</div>'
        + '<div class="lc-sub">' + esc(prev) + '</div>'
        + '<div class="lc-aside"><button class="menu-btn" aria-label="Ações">&#8942;</button></div>'
        + cbar('', '<span class="chip"><span>' + esc(n.categoria || "Outro") + '</span></span>' + scopeChip(n.scope));
      var mb = c.querySelector(".menu-btn");
      mb.onclick = function(e){ e.stopPropagation(); rowMenu(mb, function(){ notaEditor(n); }, "notas", n.id, function(){ workspaceView(w); }, "Apagar nota?"); };
      c.addEventListener("click", function(e){ if(!e.target.closest(".menu-btn")) notaEditor(n, true); });
      nlist.appendChild(c);
    });
  });

  /* ficheiros do espaço */
  var files = (w.ficheiros || []).slice();
  var sh2 = el("div","ws-sec-h"); sh2.innerHTML = '<b>Ficheiros</b>';
  var addF = el("button","btn gold sm", ICO_PLUS + "Anexar");
  sh2.appendChild(addF); v.appendChild(sh2);
  var flist = el("div","cc-files"); flist.style.marginTop = "0"; v.appendChild(flist);
  function drawF(){
    flist.innerHTML = "";
    if(!files.length){ flist.appendChild(el("div","wide-empty","Sem ficheiros.")); return; }
    files.forEach(function(f, i){
      var a = el("a", null, esc(f.nome || "ficheiro")); a.href = f.url; a.target = "_blank"; a.rel = "noopener";
      var x = el("button","btn ghost sm","✕"); x.style.marginLeft = "4px";
      x.onclick = function(e){ e.preventDefault(); files.splice(i,1); persistF(); };
      var wrap = el("span"); wrap.style.cssText = "display:inline-flex;align-items:center"; wrap.appendChild(a); wrap.appendChild(x);
      flist.appendChild(wrap);
    });
  }
  function persistF(){
    colPut("workspaces", w.id, { titulo:w.titulo, tag:w.tag, tagIcone:w.tagIcone, cor:w.cor, cliente:w.cliente, pagina:w.pagina, descricao:w.descricao, scope:w.scope, ficheiros:files }).then(function(r){
      if(r.j && r.j.item) w = r.j.item; drawF();
    });
  }
  addF.onclick = function(){
    promptModal({ title:"Anexar ficheiro", label:"Link (R2 / Cloudinary / Drive)", ok:"Continuar" }).then(function(url){
      if(!url) return;
      promptModal({ title:"Nome do ficheiro", value:(url.split("/").pop() || "").split("?")[0], ok:"Anexar" }).then(function(nome){
        files.push({ url:url.trim(), nome:(nome || "ficheiro").trim() }); persistF();
      });
    });
  };
  drawF();
}

function workspaceForm(w){
  w = w || {};
  var cor = w.cor || WS_CORES[0][0];
  var ico = w.tagIcone || TAG_ICONS[0][0];
  modal(function(box, close){
    box.innerHTML = '<h4>' + (w.id ? "Editar workspace" : "Novo workspace") + '</h4>'
      + frow("Título","ws-t",w.titulo)
      + '<div class="field"><label>Nome da etiqueta (só tu o vês ao clicar)</label><input id="ws-tag" value="' + esc(w.tag || "") + '" placeholder="ex. Campanha, Ideia, Institucional"></div>'
      + '<div class="field"><label>Ícone da etiqueta</label><div class="ico-pick" id="ws-ico"></div></div>'
      + '<div class="field"><label>Cor da etiqueta</label><div class="cor-pick" id="ws-cor"></div></div>'
      + '<div class="row"><div class="field"><label>Cliente (opcional)</label><input id="ws-cli" value="' + esc(w.cliente || "") + '"></div>'
      +   '<div class="field"><label>Código de página (opcional)</label><input id="ws-pag" value="' + esc(w.pagina || "") + '"></div></div>'
      + '<div class="field"><label>Descrição</label><textarea id="ws-desc">' + esc(w.descricao || "") + '</textarea></div>'
      + scopeRow(w.scope)
      + '<div class="err" id="ws-err"></div>'
      + '<div class="mrow"><button class="btn ghost" id="ws-x">Cancelar</button><button class="btn gold" id="ws-ok">Guardar</button></div>';
    var cp = box.querySelector("#ws-cor");
    WS_CORES.forEach(function(c){
      var b = el("button", c[0] === cor ? "on" : ""); b.type = "button"; b.style.background = c[0]; b.title = c[1];
      b.onclick = function(){ cor = c[0]; cp.querySelectorAll("button").forEach(function(x){ x.classList.toggle("on", x === b); }); };
      cp.appendChild(b);
    });
    var ip = box.querySelector("#ws-ico");
    TAG_ICONS.forEach(function(t){
      var b = el("button", t[0] === ico ? "on" : "", t[2]); b.type = "button"; b.title = t[1];
      b.onclick = function(){ ico = t[0]; ip.querySelectorAll("button").forEach(function(x){ x.classList.toggle("on", x === b); }); };
      ip.appendChild(b);
    });
    var getScope = bindScope(box);
    box.querySelector("#ws-x").onclick = function(){ close(); };
    box.querySelector("#ws-ok").onclick = function(){
      var titulo = box.querySelector("#ws-t").value.trim();
      if(!titulo){ box.querySelector("#ws-err").textContent = "Dá um título ao workspace."; return; }
      colPut("workspaces", w.id || newId(), {
        titulo: titulo, tag: box.querySelector("#ws-tag").value.trim(), tagIcone: ico, cor: cor,
        cliente: box.querySelector("#ws-cli").value.trim(), pagina: box.querySelector("#ws-pag").value.trim().toUpperCase(),
        descricao: box.querySelector("#ws-desc").value.trim(), scope: getScope(),
        ficheiros: w.ficheiros || []
      }).then(function(r){
        if(!r || !r.ok){ toast((r && r.j && r.j.error) || "Não foi possível guardar"); return; }
        toast("Guardado"); close(); WS_LIST = null;
        (r.j && r.j.item && w.id) ? workspaceView(r.j.item) : workspacesView();
      });
    };
    box.querySelector("#ws-t").focus();
  }, { cls:"lg" });
}
</script>
</body>
</html>
