<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title data-i18n="AC-TITLE">Acesso — Asteris</title>
<link rel="icon" type="image/png" href="/assets/logos/asteris-icon.png">
<link rel="apple-touch-icon" href="/assets/logos/asteris-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="assets/i18n.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#C9A166; --gold-soft:rgba(201,161,102,.22);
  --black:#0B0B0A; --panel:#151412;
  --white:#F0EAE0; --white-dim:rgba(240,234,224,.82); --white-faint:rgba(240,234,224,.6);
  --neg:#FF5B4C;
  --serif:"Cormorant Garamond",Georgia,serif; --sans:"Montserrat",system-ui,sans-serif;
  --pad:clamp(20px,5vw,56px);
}
body{background:var(--black);color:var(--white);font-family:var(--sans);line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;padding:0}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:url("assets/hero/estatua.jpg") 62% center/cover no-repeat}
body::after{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(11,11,10,.96) 0%,rgba(11,11,10,.62) 30%,rgba(11,11,10,.62) 58%,rgba(11,11,10,.98) 100%),rgba(11,11,10,.5)}
::selection{background:var(--gold);color:var(--black)}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
[hidden]{display:none!important}

.wrap{flex:1;display:flex;flex-direction:column;justify-content:center;width:100%;max-width:440px;margin:0 auto;padding:72px var(--pad) 28px;text-align:center}
.mark{width:auto;height:36px;display:block;margin:0 auto 24px}
.brand{font-size:10px;font-weight:500;letter-spacing:.42em;text-transform:uppercase;color:var(--white-dim);margin-bottom:10px}
h1{font-family:var(--serif);font-weight:300;font-size:clamp(1.7rem,4vw,2.3rem);line-height:1.15;margin-bottom:8px}
.sub{font-size:12px;font-weight:300;color:var(--white-dim);margin-bottom:34px;max-width:34ch;margin-left:auto;margin-right:auto}

/* campo de codigo */
.gate{margin-top:6px}
.gate form{display:flex;flex-direction:column;gap:10px}
.gate input{background:#0C0C0B;border:1px solid var(--gold-soft);color:var(--white);font-family:var(--serif);font-size:1.6rem;letter-spacing:.35em;text-align:center;text-transform:uppercase;padding:16px 12px;width:100%}
.gate input::placeholder{color:var(--white-faint);letter-spacing:.35em}
.gate input:focus{border-color:var(--gold);outline:none}
.gate button.go{background:var(--gold);color:var(--black);border:none;padding:14px;font-family:var(--sans);font-size:9px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;cursor:pointer;transition:opacity .2s}
.gate button.go:hover{opacity:.88}
.err{color:var(--neg);font-size:11px;margin-top:10px;min-height:1.2em}

.foot{margin-top:40px;font-size:8.5px;letter-spacing:.06em;color:var(--white-faint)}
.foot a{color:var(--white-dim);text-decoration:none;border-bottom:1px solid var(--gold-soft)}
.site-footer{flex-shrink:0;width:100%;padding:16px clamp(20px,5vw,56px);border-top:1px solid rgba(255,255,255,.07);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;background:transparent}
.site-footer .sf-brand{display:flex;align-items:center;gap:9px;text-decoration:none;font-family:var(--sans);font-size:10px;font-weight:500;letter-spacing:.32em;text-transform:uppercase;color:rgba(240,234,224,.4)}
.site-footer .sf-brand svg,.site-footer .sf-brand img{width:auto;height:15px;opacity:.7;flex-shrink:0}
.site-footer .sf-copy{font-size:8.5px;color:rgba(240,234,224,.28);letter-spacing:.06em}
.site-footer .sf-cross{color:var(--gold);font-size:15px;opacity:.55}
.home-link{position:fixed;top:20px;left:20px;z-index:5;display:inline-flex;align-items:center;gap:7px;font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--white-dim);text-decoration:none;padding:8px 12px;border:1px solid var(--gold-soft);background:rgba(11,11,10,.4);transition:color .2s,border-color .2s}
@media(max-width:560px){
  .wrap{padding:60px var(--pad) 18px}
  .mark{height:28px;margin-bottom:14px}
  h1{font-size:1.55rem}
  .sub{margin-bottom:18px}
  .foot{margin-top:18px}
  .site-footer{padding:14px var(--pad);justify-content:center;text-align:center}
  .home-link{top:14px;left:14px}
}
.home-link:hover{color:var(--gold);border-color:var(--gold)}
.lang-switch{display:flex;gap:1px}
.lang-switch button{background:none;border:none;color:var(--white-faint);font-family:var(--sans);font-size:9px;font-weight:600;letter-spacing:.12em;padding:5px 7px;cursor:pointer;transition:color .2s}
.lang-switch button:hover{color:var(--white-dim)}
.lang-switch button[aria-current="true"]{color:var(--gold)}
@media(max-width:560px){.site-footer .lang-switch{order:3;width:100%;justify-content:center}}
</style>
</head>
<body>
<a class="home-link" href="/" data-i18n="AC-HOME">&#8592; Voltar ao site</a>
<div class="wrap">
  <img class="mark" src="assets/logos/asteris.png" alt="Asteris">
  <div class="brand">Asteris</div>

  <h1 data-i18n="AC-H1">Área de acesso</h1>
  <p class="sub" data-i18n="AC-SUB">Insere o código de acesso que recebeste.</p>

  <div id="gate" class="gate">
    <form id="gate-form">
      <input id="code" name="code" inputmode="text" autocomplete="off" autocapitalize="characters"
             spellcheck="false" maxlength="16" placeholder="CÓDIGO" data-i18n-ph="AC-INPUT" data-i18n-aria="AC-INPUT-ARIA" aria-label="Código de acesso">
      <button class="go" type="submit" data-i18n="AC-ENTRAR">Entrar</button>
    </form>
    <div class="err" id="err" role="alert"></div>
  </div>

  <div class="foot"><span data-i18n="AC-FOOT-PRE">Problemas com o código? </span><a href="https://wa.me/351933829767" target="_blank" rel="noopener" data-i18n="AC-FOOT-LINK">Fala connosco</a></div>
</div>

<footer class="site-footer">
  <a class="sf-brand" href="/"><img src="assets/logos/asteris.png" alt="" aria-hidden="true">Asteris</a>
  <div class="lang-switch" data-lang-switch aria-label="Idioma / Language">
    <button type="button" data-lang-btn="pt">PT</button>
    <button type="button" data-lang-btn="en">EN</button>
    <button type="button" data-lang-btn="es">ES</button>
    <button type="button" data-lang-btn="fr">FR</button>
  </div>
  <span class="sf-copy" data-i18n="AC-FOOT-COPY">&copy; 2026 Asteris. Todos os direitos reservados.</span>
  <span class="sf-cross">&#10022;</span>
</footer>

<script>
var $ = function(s){ return document.querySelector(s); };
var input = $("#code"), err = $("#err");

input.focus();

$("#gate-form").addEventListener("submit", function(e){
  e.preventDefault();
  err.textContent = "";
  var code = input.value.trim().replace(/[^a-z0-9_-]/gi, "");
  if(code.length < 4){ err.textContent = I18N.t("AC-ERR-INCOMPLETO"); return; }
  // o código é o único identificador: abre /<codigo>, o portal deteta se é
  // seleção, entrega, portfólio ou proposta a partir dos dados da pasta
  window.location.href = "/" + encodeURIComponent(code);
});

// atalho: acesso.html?c=CODIGO entra directo
var pre = new URLSearchParams(location.search).get("c");
if(pre){ input.value = pre; }
</script>
</body>
</html>
