<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Asteris</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="/assets/i18n.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#C9A166; --gold-soft:rgba(201,161,102,.22);
  --neg:#D9705F;
  --black:#0B0B0A; --black2:#111110; --panel:#151412;
  --white:#F0EAE0; --white-dim:rgba(240,234,224,.82); --white-faint:rgba(240,234,224,.6);
  --serif:"Cormorant Garamond",Georgia,serif; --sans:"Montserrat",system-ui,sans-serif;
  --pad:clamp(20px,5vw,56px);
}
html{scroll-behavior:smooth}
body{background:var(--black);color:var(--white);font-family:var(--sans);line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh}
img,video{max-width:100%;display:block}
.tile img,.tile video,.mood img,.cx-card img,.lb-media,.phead .bg img,.phead .bg video{-webkit-user-drag:none;user-select:none;-webkit-touch-callout:none}
a{color:inherit}
::selection{background:var(--gold);color:var(--black)}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.hidden{display:none!important}

/* estados */
#loading,#notfound{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:var(--pad);gap:14px}
.mark{width:34px;height:34px}
#notfound h1{font-family:var(--serif);font-weight:300;font-size:clamp(1.6rem,3vw,2.2rem)}
#notfound p{font-size:12px;color:var(--white-dim);max-width:36ch}
#notfound a.home{margin-top:10px;border:1px solid var(--gold);color:var(--white);padding:12px 24px;font-size:9px;letter-spacing:.2em;text-transform:uppercase;text-decoration:none;transition:background .25s,color .25s}
#notfound a.home:hover{background:var(--gold);color:var(--black)}
.spin{width:26px;height:26px;border:2px solid var(--gold-soft);border-top-color:var(--gold);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}

/* header comum */
.phead{position:relative;min-height:clamp(220px,34vw,360px);display:flex;flex-direction:column;justify-content:flex-end;padding:var(--pad);overflow:hidden}
.phead .bg{position:absolute;inset:0;z-index:0}
.phead .bg img,.phead .bg video{width:100%;height:100%;object-fit:cover;filter:grayscale(.4) brightness(.4)}
.phead .bg.mosaico{display:flex}
.phead .bg.mosaico img{flex:1 1 0;min-width:0;height:100%;object-fit:cover;filter:grayscale(.55) brightness(.42) contrast(1.02)}
.phead.mosaic::before{content:"";position:absolute;inset:0;z-index:1;background:rgba(8,8,7,.55)}
.phead::after{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(to top,var(--black) 4%,rgba(11,11,10,.35) 60%,rgba(11,11,10,.55))}
.phead .in{position:relative;z-index:2}
.pbadge{width:clamp(76px,13vw,116px);height:clamp(76px,13vw,116px);display:flex;align-items:center;justify-content:center;padding:11px;border:1px solid var(--gold-soft);background:rgba(240,234,224,.05);backdrop-filter:blur(2px);margin-bottom:20px}
.pbadge img{max-width:100%;max-height:100%;width:auto;object-fit:contain;filter:none}
.pbrand{font-family:var(--sans);font-size:10px;font-weight:500;letter-spacing:.4em;text-transform:uppercase;color:var(--white);opacity:.8;margin-bottom:auto}
.peyebrow{font-size:8px;font-weight:600;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);margin-top:26px}
.pclient{font-family:var(--serif);font-weight:300;font-size:clamp(2rem,5vw,3.2rem);line-height:1.05;margin:6px 0 4px}
.ptitle{font-family:var(--serif);font-weight:300;font-style:italic;font-size:clamp(1.1rem,2.4vw,1.5rem);color:var(--white-dim)}
.pintro{font-size:12px;font-weight:300;line-height:1.9;color:var(--white-dim);max-width:60ch;margin-top:14px}
.pmeta{margin-top:16px;display:flex;flex-wrap:wrap;gap:8px}
/* proposta: cabeçalho centrado, sem marca nem rótulo */
.phead-prop{align-items:center;text-align:center}
.phead-prop .in{width:100%}
.phead-prop .pcol{display:flex;flex-direction:column;align-items:center}
.phead-prop .pintro{margin-left:auto;margin-right:auto}
.phead-prop .pmeta{justify-content:center}
.chip{border:1px solid var(--gold-soft);padding:5px 11px;font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:var(--white-dim)}
.chip.warn{border-color:var(--gold);color:var(--gold)}

#app{display:flex;flex-direction:column;min-height:100vh}
#app > .wrap,#app > .prop{flex:1 0 auto}
#app > .phead,#app > .selbar,#app > footer.pfoot{flex:0 0 auto}
.wrap{padding:clamp(30px,5vw,56px) var(--pad) 100px}

/* galeria / triagem — grelha uniforme (tipo ícones de pasta) */
.collage{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
@media(max-width:520px){.collage{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}}
.tile{position:relative;display:flex;flex-direction:column;padding:0;background:transparent;overflow:hidden;cursor:pointer;text-align:left}
.tile .thumb{position:relative;width:100%;aspect-ratio:4/5;overflow:hidden;background:#0c0c0b}
.tile .thumb img,.tile .thumb video{width:100%;height:100%;object-fit:cover;filter:grayscale(.12);transition:transform .4s cubic-bezier(.2,.7,.2,1),filter .3s}
.tile:hover .thumb img,.tile:hover .thumb video{transform:scale(1.05);filter:grayscale(0)}
@media (prefers-reduced-motion:reduce){.tile:hover .thumb img,.tile:hover .thumb video{transform:none}}
.tile .vtag{position:absolute;top:8px;left:8px;color:#fff;font-size:13px;opacity:.9;text-shadow:0 1px 6px rgba(0,0,0,.6);pointer-events:none;z-index:2}
/* botão selecionar */
.tile .selbtn{border:1px solid var(--gold-soft);background:transparent;color:var(--white-dim);font-family:var(--sans);font-size:8px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;padding:9px 6px;margin-top:5px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:background .18s,color .18s,border-color .18s}
.tile .selbtn svg{width:11px;height:11px}
.tile .selbtn:hover{color:var(--white);border-color:var(--white-dim)}
.tile.on .thumb::after{content:"";position:absolute;inset:0;background:rgba(217,112,95,.22);z-index:1}
.tile.on .thumb img,.tile.on .thumb video{filter:grayscale(.2) brightness(.85)}
.tile.on .selbtn{background:var(--neg);color:#fff;border-color:var(--neg)}
/* ver só as selecionadas: escurece as outras */
.collage.focus-sel .tile:not(.on){pointer-events:none}
.collage.focus-sel .tile:not(.on) .thumb::after{content:"";position:absolute;inset:0;background:rgba(6,6,5,.82);z-index:2;transition:background .3s}
.collage.focus-sel .tile:not(.on) .selbtn{opacity:.25}

/* barra de triagem */
.selbar{position:sticky;bottom:0;z-index:40;background:rgba(11,11,10,.92);backdrop-filter:blur(10px);border-top:1px solid var(--gold-soft);padding:12px var(--pad);display:flex;align-items:center;justify-content:space-between;gap:14px}
.selbar .count{font-family:var(--serif);font-size:16px;color:var(--gold)}
.selbar .count small{color:var(--white-faint);font-family:var(--sans);font-size:9px;letter-spacing:.1em;text-transform:uppercase;margin-left:8px}
.selbar .actions{display:flex;gap:8px;flex-wrap:wrap}
.selbar.centro{justify-content:center}
.btn{border:1px solid var(--gold-soft);background:transparent;color:var(--white);padding:11px 18px;font-family:var(--sans);font-size:8.5px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;transition:background .2s,color .2s,border-color .2s}
.btn:hover{border-color:var(--gold)}
.btn.gold{background:var(--gold);color:var(--black);border-color:var(--gold)}
.btn.gold:hover{opacity:.88}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.selmsg{padding:0 var(--pad) 30px;font-size:11px;color:var(--gold);letter-spacing:.03em}

/* download tudo */
.dlall{margin:0 0 26px}

/* lightbox */
.lb{position:fixed;inset:0;z-index:60;background:rgba(6,6,5,.95);backdrop-filter:blur(6px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:clamp(14px,4vw,50px);opacity:0;pointer-events:none;transition:opacity .25s}
.lb.open{opacity:1;pointer-events:auto}
.lb-top{width:100%;max-width:1200px;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px}
.lb-name{font-family:var(--sans);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--white-dim)}
.lb-x{background:none;border:1px solid var(--gold-soft);color:#fff;width:34px;height:34px;cursor:pointer;font-size:14px}
.lb-x:hover{background:var(--gold);color:var(--black)}
.lb-stage{flex:1;width:100%;max-width:1200px;display:flex;align-items:center;justify-content:center;position:relative;min-height:0}
.lb-media{max-width:100%;max-height:74vh;object-fit:contain;border:1px solid var(--gold-soft);background:#000}
.lb-vwrap{position:relative;display:inline-flex;max-width:100%;line-height:0}
.lb-vwrap video{max-width:100%;max-height:74vh;display:block}
.lb-play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:74px;height:74px;border-radius:50%;border:1px solid var(--gold);background:rgba(11,11,10,.5);backdrop-filter:blur(3px);color:var(--gold);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:opacity .3s,background .2s,color .2s,transform .15s}
.lb-play:hover{background:var(--gold);color:var(--black);transform:translate(-50%,-50%) scale(1.05)}
.lb-play svg{width:26px;height:26px;pointer-events:none}
.lb-play .ic-pause{display:none}
.lb-vwrap.playing .lb-play{opacity:0}
.lb-vwrap.playing:hover .lb-play{opacity:1}
.lb-vwrap.playing .lb-play .ic-play{display:none}
.lb-vwrap.playing .lb-play .ic-pause{display:block}
#prot-toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(12px);z-index:80;
  background:rgba(11,11,10,.92);border:1px solid var(--gold-soft);color:var(--white-dim);
  font-family:var(--sans);font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:10px 16px;
  opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
#prot-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;background:rgba(11,11,10,.7);border:1px solid var(--gold-soft);color:#fff;cursor:pointer;font-size:16px}
.lb-nav:hover{background:var(--gold);color:var(--black)}
.lb-nav.prev{left:0}.lb-nav.next{right:0}
.lb-bottom{margin-top:12px;display:flex;gap:10px;align-items:center}
.lb-count{font-family:var(--serif);font-size:14px;color:var(--white-dim)}

/* proposta — tudo centrado */
.prop section{padding:clamp(40px,7vw,80px) var(--pad);border-bottom:1px solid var(--gold-soft);text-align:center}
.prop .eyebrow{font-size:8px;font-weight:600;letter-spacing:.28em;text-transform:uppercase;color:var(--gold)}
.prop h2{font-family:var(--serif);font-weight:300;font-size:clamp(1.5rem,3vw,2.2rem);line-height:1.25;margin:12px auto 0;max-width:22ch}
.prop p.lead{font-size:13px;font-weight:300;line-height:1.95;color:var(--white-dim);max-width:62ch;margin:14px auto 0}
.prop ul.pts{list-style:none;margin:16px auto 0;max-width:62ch}
.prop ul.pts li{padding:9px 0;font-size:13px;font-weight:300;color:var(--white-dim);border-bottom:1px solid rgba(255,255,255,.05)}
.prop ul.pts li::before{content:"—  ";color:var(--gold)}
/* conceitos — carrossel coverflow */
.cx{position:relative;margin-top:26px;padding:8px 0 40px}
.cx-stage{position:relative;height:clamp(280px,44vw,430px)}
.cx-card{position:absolute;top:0;left:50%;width:min(80%,430px);height:100%;background:var(--panel);border:1px solid var(--gold-soft);overflow:hidden;
  transform:translateX(-50%);transition:transform .6s cubic-bezier(.4,0,.2,1),opacity .55s,filter .55s;will-change:transform,opacity;pointer-events:none}
.cx-card.mid{pointer-events:auto}
.cx-card img{width:100%;height:62%;object-fit:cover;filter:grayscale(.2)}
.cx-card .c-body{padding:16px}
.cx-card h3{font-family:var(--serif);font-weight:400;font-size:1.2rem;color:var(--white)}
.cx-card p{font-size:11px;font-weight:300;line-height:1.8;color:var(--white-dim);margin-top:6px}
.cx-nav{position:absolute;top:calc(50% - 20px);z-index:20;width:40px;height:40px;background:rgba(11,11,10,.72);border:1px solid var(--gold-soft);color:#fff;font-size:16px;cursor:pointer;transition:background .2s,color .2s}
.cx-nav:hover{background:var(--gold);color:var(--black)}
.cx-nav.prev{left:2px}.cx-nav.next{right:2px}
.cx-dots{position:absolute;left:0;right:0;bottom:12px;display:flex;justify-content:center;gap:7px}
.cx-dots button{width:6px;height:6px;border-radius:50%;border:0;background:var(--gold-soft);cursor:pointer;padding:0;transition:background .2s}
.cx-dots button.on{background:var(--gold)}
.mood{margin-top:24px;column-count:11;column-gap:4px}
@media(max-width:900px){.mood{column-count:8}}
@media(max-width:640px){.mood{column-count:6}}
@media(max-width:420px){.mood{column-count:5}}
.mood img{width:100%;height:auto;display:block;margin-bottom:4px;filter:grayscale(.25);break-inside:avoid;cursor:pointer;transition:filter .25s,opacity .25s}
.mood img:hover{filter:grayscale(0)}
.plans{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;margin-top:26px}
.plan{flex:0 1 calc((100% - (var(--cols,3) - 1) * 14px) / var(--cols,3));min-width:min(240px,100%)}
@media(max-width:520px){.plan{flex-basis:100%}}
.plan{position:relative;border:1px solid var(--gold-soft);background:var(--panel);padding:26px 20px;display:flex;flex-direction:column;overflow:hidden;isolation:isolate}
.plan.has-bg{min-height:clamp(320px,42vw,420px)}
.plan.hot{border-color:var(--acc,var(--gold));box-shadow:0 0 34px rgba(201,161,102,.14)}
.plan .p-bg{position:absolute;inset:0;z-index:-1}
.plan .p-bg img{width:100%;height:100%;object-fit:cover;filter:grayscale(.25)}
.plan .p-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,11,10,.5) 0%,rgba(11,11,10,.82) 55%,rgba(11,11,10,.94) 100%)}
.plan .p-flag{position:absolute;top:0;right:0;z-index:2;background:var(--acc,var(--gold));color:var(--black);font-size:7.5px;letter-spacing:.18em;text-transform:uppercase;padding:4px 9px;font-weight:600}
.plan .p-name{display:flex;align-items:center;gap:9px;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--acc,var(--gold))}
.plan .p-ico{width:22px;height:22px;flex-shrink:0}
.plan .p-price{font-family:var(--serif);font-weight:300;font-size:2rem;margin:10px 0 6px}
.plan h4{font-family:var(--serif);font-weight:400;font-size:1.2rem;color:var(--white);margin:8px 0 0}
.plan .p-resumo{font-size:10.5px;font-weight:300;line-height:1.7;color:var(--white-faint);margin:8px 0 14px}
.plan ul{list-style:none;display:flex;flex-direction:column;gap:8px;margin-top:auto}
.plan li{font-size:11px;font-weight:300;color:var(--white-dim);padding-left:16px;position:relative}
.plan li::before{content:"·";position:absolute;left:4px;color:var(--acc,var(--gold))}
.ico{width:16px;height:16px;display:inline-block;vertical-align:-3px}
.plan{text-align:left}
/* referências */
.refs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:26px;justify-content:center}
.ref{border:1px solid var(--gold-soft);background:var(--panel)}
.ref img{width:100%;aspect-ratio:4/3;object-fit:cover;filter:grayscale(.2)}
.ref figcaption{padding:11px 13px;font-size:10.5px;font-weight:300;line-height:1.7;color:var(--white-dim)}
/* galeria de ícones (?icons=1) */
.icongrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:22px}
.icocell{border:1px solid var(--gold-soft);background:var(--panel);padding:18px 10px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.icocell span{font-family:var(--sans);font-size:9px;letter-spacing:.06em;color:var(--white-dim)}
.ico-lg{width:30px;height:30px;color:var(--gold)}
.prop .cta-wrap{text-align:center;border-bottom:none}
.prop .cta-wrap h2{margin:0 auto}
.prop .fecho{font-size:12px;font-weight:300;line-height:1.95;color:var(--white-dim);max-width:52ch;margin:18px auto 0}
.btn-cta{display:inline-flex;align-items:center;gap:10px;margin-top:24px;border:1px solid var(--gold);background:transparent;color:var(--white);padding:16px 34px;font-size:9px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;text-decoration:none;transition:background .25s,color .25s}
.btn-cta:hover{background:var(--gold);color:var(--black)}

footer.pfoot{padding:22px var(--pad);border-top:1px solid rgba(255,255,255,.07);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
footer.pfoot .pf-brand{display:flex;align-items:center;gap:9px;text-decoration:none;color:rgba(240,234,224,.4);font-family:var(--sans);font-size:10px;font-weight:500;letter-spacing:.32em;text-transform:uppercase}
footer.pfoot .pf-brand svg,footer.pfoot .pf-brand img{width:auto;height:15px;opacity:.7;flex-shrink:0}
#notfound .mark{height:38px;width:auto}
footer.pfoot .pf-copy{font-size:8.5px;color:rgba(240,234,224,.28);letter-spacing:.06em}
footer.pfoot .pf-cross{color:var(--gold);font-size:15px;opacity:.55}
.lang-switch{display:flex;gap:1px}
.lang-switch button{background:none;border:none;color:var(--white-faint);font-family:var(--sans);font-size:9px;font-weight:600;letter-spacing:.12em;padding:5px 7px;cursor:pointer;transition:color .2s}
.lang-switch button:hover{color:var(--white-dim)}
.lang-switch button[aria-current="true"]{color:var(--gold)}
</style>
</head>
<body>

<div id="loading"><div class="spin"></div></div>

<div id="notfound" class="hidden">
  <img class="mark" src="/assets/logos/asteris.png" alt="Asteris">
  <h1 data-i18n="PT-NF-H1">Nada aqui.</h1>
  <p id="nf-msg" data-i18n="PT-NF-MSG">Este link não existe ou já expirou. Se recebeste um código de acesso, confirma que está completo.</p>
  <a class="home" href="/" data-i18n="PT-NF-HOME">Asteris</a>
</div>

<div id="app" class="hidden"></div>

<!-- lightbox -->
<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Ver peça">
  <div class="lb-top"><span class="lb-name" id="lb-name"></span><button class="lb-x" id="lb-x" data-i18n-aria="PT-LB-FECHAR" aria-label="Fechar">&#10005;</button></div>
  <div class="lb-stage">
    <button class="lb-nav prev" id="lb-prev" data-i18n-aria="PT-LB-ANT" aria-label="Anterior">&#8249;</button>
    <div id="lb-wrap"></div>
    <button class="lb-nav next" id="lb-next" data-i18n-aria="PT-LB-SEG" aria-label="Seguinte">&#8250;</button>
  </div>
  <div class="lb-bottom"><span class="lb-count" id="lb-count"></span><a class="btn" id="lb-dl" data-i18n="PT-LB-DL" download>Descarregar</a></div>
</div>

<script>
/* ============================================================
   PORTAL ASTERIS — 1 página, 3 modos (galeria / triagem / proposta)
   URL: asteris.pt/<CODIGO>   →  lê /data/<CODIGO>.json
   O JSON diz o "type". Ver /data/COMO-CRIAR.md
   ============================================================ */
var CONTACT_WA = "351933829767";                 // WhatsApp para CTAs de proposta
var TRIAGEM_FORMSPREE = "";                       // ID Formspree p/ receber as seleções (vazio = envia por email do browser)

var $ = function(s,r){ return (r||document).querySelector(s); };
var el = function(tag,cls,html){ var e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e; };
var T = function(k,v){ return window.I18N ? window.I18N.t(k,v) : k; };

/* --- biblioteca de ícones para os planos das propostas ---
   uso no JSON:  "icone": "diamante"   (ver lista completa em  asteris.pt/PROPOSTA?icons=1  ou COMO-CRIAR.md) */
var ICONS = {
  diamante:'<path d="M6 3h12l4 6-10 12L2 9z"/><path d="M2 9h20M9 3 7 9l5 12 5-12-2-6M9 9l3 12 3-12"/>',

/* --- código a partir do caminho --- */
var parts = location.pathname.split("/").filter(Boolean);
var repoBase = location.pathname.indexOf("/Asteris-Media-Website/") === 0 ? "/Asteris-Media-Website/" : "/";
var qc = new URLSearchParams(location.search).get("c");   // fallback: 404.html?c=CODIGO
var code = qc || (parts.length ? parts[parts.length-1].replace(/\.html?$/,"") : "");
var RESERVED = ["index","404","g","p","t","c","data","assets","acesso","exemplos","favicon"];

function fail(msg){
  $("#loading").classList.add("hidden");
  if(msg) $("#nf-msg").textContent = msg;
  $("#notfound").classList.remove("hidden");
}

if(new URLSearchParams(location.search).get("icons")){
  showIconGallery();
} else if(!code || RESERVED.indexOf(code) !== -1 || !/^[a-z0-9][a-z0-9_-]{3,}$/i.test(code)){
  fail();
} else {
  fetch(repoBase + "data/" + encodeURIComponent(code) + ".json", { cache:"no-store" })
    .then(function(r){ if(!r.ok) throw 0; return r.json(); })
    .then(render)
    .catch(function(){ fail(T("PT-NF-MSG2")); });
}

function expired(d){
  if(!d.expira) return false;
  var e = new Date(d.expira + "T23:59:59");
  return !isNaN(e) && Date.now() > e.getTime();
}

function render(d){
  document.title = d.cliente ? ("Asteris — " + d.cliente) : "Asteris";
  if(expired(d)){ fail(T("PT-NF-EXPIROU",{data:d.expira})); return; }
  $("#loading").classList.add("hidden");
  var app = $("#app"); app.classList.remove("hidden"); app.innerHTML = "";

  // modo anónimo: sem nome de cliente nem rótulo de tipo (portfolio / entrega discreta)
  var anon = d.anon === true || !d.cliente;
  var mosaic = d.type === "triagem" || d.capaColagem === true;

  var isVid = function(u){ return /\.(mp4|webm|mov|m4v)(\?|$)/i.test(u || ""); };
  var bgOne = function(u){
    return isVid(u)
      ? '<video src="'+u+'" muted loop autoplay playsinline preload="auto"></video>'
      : '<img src="'+u+'" alt="">';
  };
  var bgHTML = "";
  if(mosaic && d.itens){
    var fotos = d.itens.filter(function(it){ return it.tipo !== "video"; }).slice(0,6);
    if(fotos.length < 2 && d.capa) bgHTML = '<div class="bg">'+bgOne(d.capa)+'</div>';
    else bgHTML = '<div class="bg mosaico">' + fotos.map(function(it){
      return '<img src="'+(it.thumb||it.src)+'" alt="">';
    }).join("") + '</div>';
  } else if(d.capa){
    bgHTML = '<div class="bg">'+bgOne(d.capa)+'</div>';
  }

  var isProp = d.type === "proposta";
  var propLogo = (isProp && d.proposta && d.proposta.logo) ? d.proposta.logo : "";
  var badgeHTML = propLogo ? '<div class="pbadge"><img src="'+propLogo+'" alt=""></div>' : '';

  var head = el("div","phead" + (mosaic ? " mosaic" : "") + (isProp ? " phead-prop" : ""));
  head.innerHTML =
    bgHTML +
    '<div class="in">' +
      '<div class="pcol">' +
      (isProp ? badgeHTML : '') +
      (isProp ? '' : '<div class="pbrand">Asteris</div>') +
      (anon || isProp ? '' : '<div class="peyebrow">'+({galeria:T("PT-EYE-GALERIA"),triagem:T("PT-EYE-TRIAGEM"),proposta:T("PT-EYE-PROPOSTA")}[d.type]||"")+'</div>') +
      (mosaic
        ? (d.titulo ? '<div class="pclient">'+d.titulo+'</div>' : '') + (d.cliente ? '<div class="ptitle">'+d.cliente+'</div>' : '')
        : (d.cliente ? '<div class="pclient">'+d.cliente+'</div>' : '') + (d.titulo ? '<div class="ptitle">'+d.titulo+'</div>' : '')
      ) +
      (d.intro ? '<div class="pintro">'+d.intro+'</div>' : '') +
      '<div class="pmeta">' +
        (d.itens ? '<span class="chip">'+T("PT-CHIP-PECAS",{n:d.itens.length})+'</span>' : '') +
        ((d.type === "proposta" && d.proposta && d.proposta.validade) ? '<span class="chip warn">'+T("PT-CHIP-VALIDA",{x:d.proposta.validade})+'</span>' : '') +
        (d.expira ? '<span class="chip warn">'+T(d.type === "proposta" ? "PT-CHIP-ATE" : "PT-CHIP-DISPONIVEL",{data:d.expira})+'</span>' : '') +
      '</div>' +
      '</div>' +
    '</div>';
  app.appendChild(head);

  if(d.type === "proposta") return renderProposta(d, app);
  return renderGaleria(d, app, d.type === "triagem");
}

/* ---------------- GALERIA + TRIAGEM ---------------- */
var ITEMS = [], SEL = new Set(), MODO = "";  // MODO: "triagem" | "entrega" | ""
var IC_ADD = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';
var IC_X   = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';
function selBtn(on){
  return '<button class="selbtn" type="button">' + (on ? IC_X + T("PT-SEL-REMOVE") : IC_ADD + T("PT-SEL-ADD")) + '</button>';
}
function setTileBtn(tile, on){
  var b = tile.querySelector(".selbtn");
  if(b) b.innerHTML = on ? IC_X + T("PT-SEL-REMOVE") : IC_ADD + T("PT-SEL-ADD");
}

function renderGaleria(d, app, triagem){
  ITEMS = d.itens || [];
  var anon = d.anon === true || !d.cliente;
  var entrega = !triagem && d.type === "galeria" && !anon && d.selecao !== false;
  var picking = triagem || entrega;
  MODO = triagem ? "triagem" : (entrega ? "entrega" : "");
  var wrap = el("div","wrap");

  if(entrega && d.downloadTudo){
    var a = el("a","btn gold dlall",T("PT-DL-TUDO"));
    a.href = d.downloadTudo; a.setAttribute("download","");
    wrap.appendChild(a);
  }
  var msg = triagem ? (d.instrucoes || "")
          : (entrega ? T("PT-MSG-ENTREGA") : "");
  if(msg){ wrap.appendChild(el("p","selmsg", msg)); }

  var grid = el("div","collage");
  ITEMS.forEach(function(it, i){
    var t = el("div","tile"); t.dataset.i = i;
    var media = it.tipo === "video"
      ? '<span class="vtag">&#9654;</span><video src="'+(it.src)+'" muted loop playsinline preload="metadata"></video>'
      : '<img src="'+(it.thumb||it.src)+'" alt="'+(it.nome||"")+'" loading="lazy">';
    t.innerHTML = '<div class="thumb">'+media+'</div>'
      + (picking ? selBtn(false) : '');
    grid.appendChild(t);
  });
  wrap.appendChild(grid);
  app.appendChild(wrap);

  if(picking){
    var bar = el("div","selbar" + (entrega ? " centro" : ""));
    if(triagem){
      bar.innerHTML =
        '<span class="count"><span id="sc">0</span><small>'+T("PT-BAR-SELECIONADAS")+'</small></span>' +
        '<span class="actions">' +
          '<button class="btn" id="all">'+T("PT-BTN-ALL")+'</button>' +
          '<button class="btn" id="only">'+T("PT-BTN-ONLY")+'</button>' +
          '<button class="btn gold" id="save" disabled>'+T("PT-BTN-SAVE")+'</button>' +
        '</span>';
    } else {
      bar.innerHTML =
        '<span class="actions">' +
          '<button class="btn" id="all">'+T("PT-BTN-ALL")+'</button>' +
          '<button class="btn gold" id="dl" disabled>'+T("PT-BTN-DL")+'</button>' +
        '</span>';
    }
    app.appendChild(bar);
  }
  app.appendChild(footer(d));

  /* eventos */
  grid.addEventListener("click", function(e){
    var t = e.target.closest(".tile"); if(!t) return;
    var i = +t.dataset.i;
    if(picking && e.target.closest(".selbtn")){ toggle(i, t); return; }
    openLb(i, ITEMS);
  });
  playInView(grid);

  if(picking){
    var allBtn = $("#all"), allOn = false;
    allBtn.addEventListener("click", function(){
      allOn = !allOn;
      grid.querySelectorAll(".tile").forEach(function(t){
        var i = +t.dataset.i;
        if(allOn){ SEL.add(i); t.classList.add("on"); } else { SEL.delete(i); t.classList.remove("on"); }
        setTileBtn(t, allOn);
      });
      allBtn.textContent = allOn ? T("PT-BTN-ALL-CLEAR") : T("PT-BTN-ALL");
      refreshBar();
    });
  }
  if(triagem){
    var onlyBtn = $("#only"), focus = false;
    onlyBtn.addEventListener("click", function(){
      focus = !focus;
      grid.classList.toggle("focus-sel", focus);
      onlyBtn.textContent = focus ? T("PT-BTN-ONLY-BACK") : T("PT-BTN-ONLY");
    });
    $("#save").addEventListener("click", function(){ saveSelection(d); });
  }
  if(entrega){
    $("#dl").addEventListener("click", function(){ baixarSelecionadas(d); });
  }
}

function refreshBar(){
  if(MODO === "triagem"){ $("#sc").textContent = SEL.size; $("#save").disabled = SEL.size === 0; }
  if(MODO === "entrega"){
    var b = $("#dl");
    b.disabled = SEL.size === 0;
    b.textContent = SEL.size ? T("PT-BTN-DL-N",{n:SEL.size}) : T("PT-BTN-DL");
  }
}

function toggle(i, tile){
  var on = !SEL.has(i);
  if(on){ SEL.add(i); tile.classList.add("on"); }
  else { SEL.delete(i); tile.classList.remove("on"); }
  setTileBtn(tile, on);
  refreshBar();
}

function loadJSZip(){
  if(window.JSZip) return Promise.resolve(window.JSZip);
  return new Promise(function(res, rej){
    var s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js";
    s.onload = function(){ res(window.JSZip); };
    s.onerror = rej;
    document.head.appendChild(s);
  });
}
function extOf(url, tipo){
  var m = (url || "").split("?")[0].match(/\.([a-z0-9]{2,4})$/i);
  if(m) return "." + m[1].toLowerCase();
  return tipo === "video" ? ".mp4" : ".jpg";
}
function saveBlob(blob, name){
  var u = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = u; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(u); }, 4000);
}
function baixarSelecionadas(d){
  var lista = [...SEL].map(function(i){ return ITEMS[i]; });
  if(!lista.length) return;
  var btn = $("#dl"); btn.disabled = true;
  var base = "asteris-" + ((d && d.cliente ? d.cliente : "entrega").toLowerCase().replace(/[^a-z0-9]+/g, "-"));

  // 1 peça: download direto
  if(lista.length === 1){
    var it0 = lista[0], url0 = it0.download || it0.src;
    btn.textContent = T("PT-DL-1");
    fetch(url0, { mode: "cors" }).then(function(r){ if(!r.ok) throw new Error(r.status); return r.blob(); })
      .then(function(b){ saveBlob(b, (it0.nome || base) + extOf(url0, it0.tipo)); doneDl(btn); })
      .catch(function(){ doneDl(btn); alert(T("PT-DL-ERR1")); });
    return;
  }

  // várias: junta tudo num .zip (resiliente — uma peça que falhe não quebra o resto)
  var done = 0, falhas = 0;
  btn.textContent = T("PT-DL-PREP",{done:0,total:lista.length});
  loadJSZip().then(function(JSZip){
    var zip = new JSZip();
    return Promise.all(lista.map(function(it, k){
      var url = it.download || it.src;
      return fetch(url, { mode: "cors" }).then(function(r){
        if(!r.ok) throw new Error(r.status);
        return r.blob();
      }).then(function(blob){
        zip.file((String(k+1).padStart(2,"0")) + "-" + (it.nome || "peca") + extOf(url, it.tipo), blob);
      }).catch(function(){
        falhas++;
      }).then(function(){
        done++; btn.textContent = T("PT-DL-PREP",{done:done,total:lista.length});
      });
    })).then(function(){
      if(done - falhas <= 0) throw new Error("nada");
      btn.textContent = T("PT-DL-ZIP");
      return zip.generateAsync({ type: "blob" });
    }).then(function(zipBlob){
      saveBlob(zipBlob, base + ".zip");
      doneDl(btn);
      if(falhas) alert(T("PT-DL-ERR-PARCIAL",{n:falhas}));
    });
  }).catch(function(){
    doneDl(btn);
    alert(T("PT-DL-ERR-TUDO"));
  });
}
function doneDl(btn){ btn.disabled = false; refreshBar(); }

function saveSelection(d){
  var chosen = [...SEL].map(function(i){ return ITEMS[i].nome || ("item-"+(i+1)); });
  var payload = { codigo: code, cliente: d.cliente, total: ITEMS.length, escolhidas: chosen.length, lista: chosen.join(", ") };
  var btn = $("#save"); btn.disabled = true; btn.textContent = T("PT-SEND");
  var fid = d.formspree || TRIAGEM_FORMSPREE;
  if(fid){
    fetch("https://formspree.io/f/" + fid, {
      method:"POST", headers:{ "Content-Type":"application/json", Accept:"application/json" },
      body: JSON.stringify(payload)
    }).then(function(r){
      done(r.ok);
    }).catch(function(){ done(false); });
  } else {
    var body = encodeURIComponent("Seleção — " + d.cliente + " (" + code + ")\n\n" + chosen.length + " de " + ITEMS.length + "\n\n" + chosen.join("\n"));
    window.location.href = "mailto:asteris.media@hotmail.com?subject=" + encodeURIComponent("Seleção — " + d.cliente) + "&body=" + body;
    done(true);
  }
  function done(ok){
    var bar = $(".selbar");
    bar.innerHTML = ok
      ? '<span class="count" style="color:var(--gold)">'+T("PT-SENT-OK")+'<small>'+T("PT-SENT-OK-SUB",{n:chosen.length})+'</small></span>'
      : '<span class="count" style="color:#FF5B4C">'+T("PT-SENT-FAIL")+'<small>'+T("PT-SENT-FAIL-SUB")+'</small></span>';
    if(!ok){ btn.disabled = false; btn.textContent = T("PT-BTN-SAVE"); }
  }
}

/* ---------------- LIGHTBOX ---------------- */
var lb=$("#lb"), lbWrap=$("#lb-wrap"), lbi=0, lbOpen=false, LBSET=[];
function openLb(i, list){
  if(list) LBSET = list; else if(!LBSET.length) LBSET = ITEMS;
  lbi=i; lbOpen=true; var it=LBSET[i];
  if(it.tipo==="video"){
    lbWrap.innerHTML =
      '<div class="lb-vwrap">' +
        '<video class="lb-media" src="'+it.src+'" playsinline preload="auto" disablePictureInPicture oncontextmenu="return false"></video>' +
        '<button class="lb-play" type="button" aria-label="Play/Pausa">' +
          '<svg class="ic-play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5l12 7-12 7z"/></svg>' +
          '<svg class="ic-pause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>' +
        '</button>' +
      '</div>';
    var vw = lbWrap.querySelector(".lb-vwrap"), vid = vw.querySelector("video"), pb = vw.querySelector(".lb-play");
    var sync = function(){ vw.classList.toggle("playing", !vid.paused && !vid.ended); };
    var tog = function(){ vid.paused ? vid.play() : vid.pause(); };
    pb.addEventListener("click", tog);
    vid.addEventListener("click", tog);
    vid.addEventListener("play", sync); vid.addEventListener("pause", sync); vid.addEventListener("ended", sync);
    sync();
  } else {
    lbWrap.innerHTML = '<img class="lb-media" src="'+it.src+'" alt="'+(it.nome||"")+'" oncontextmenu="return false" draggable="false">';
  }
  $("#lb-name").textContent = it.nome || "";
  $("#lb-count").textContent = (i+1) + " / " + LBSET.length;
  var dl=$("#lb-dl");
  if(it.download){ dl.href=it.download; dl.classList.remove("hidden"); } else { dl.classList.add("hidden"); }
  lb.classList.add("open"); document.body.style.overflow="hidden";
}
function closeLb(){ lb.classList.remove("open"); lbWrap.innerHTML=""; lbOpen=false; document.body.style.overflow=""; }
function step(n){ lbi=(lbi+n+LBSET.length)%LBSET.length; openLb(lbi); }
$("#lb-x").onclick=closeLb; $("#lb-prev").onclick=function(){step(-1)}; $("#lb-next").onclick=function(){step(1)};
lb.addEventListener("click",function(e){ if(e.target===lb) closeLb(); });
document.addEventListener("keydown",function(e){
  if(!lbOpen) return;
  if(e.key==="Escape") closeLb();
  if(e.key==="ArrowLeft") step(-1);
  if(e.key==="ArrowRight") step(1);
});

/* proteção leve: bloqueia botão direito / arrastar sobre o material */
var toastT;
function protToast(){
  var t = $("#prot-toast");
  if(!t){
    t = el("div"); t.id = "prot-toast";
    t.textContent = T("PT-PROT");
    document.body.appendChild(t);
  }
  t.classList.add("show");
  clearTimeout(toastT);
  toastT = setTimeout(function(){ t.classList.remove("show"); }, 1800);
}
document.addEventListener("contextmenu", function(e){
  if(e.target.closest(".tile, .lb, .mood, .cx, .phead, .prop, #app img, #app video")){
    e.preventDefault();
    protToast();
  }
});
document.addEventListener("dragstart", function(e){
  if(e.target.closest("#app img, #app video")) e.preventDefault();
});

/* vídeos só tocam quando visíveis */
function playInView(grid){
  var vs = grid.querySelectorAll("video");
  if(!("IntersectionObserver" in window)){ vs.forEach(function(v){ v.play().catch(function(){}); }); return; }
  var io = new IntersectionObserver(function(en){
    en.forEach(function(x){ if(x.isIntersecting) x.target.play().catch(function(){}); else x.target.pause(); });
  }, { threshold:.2 });
  vs.forEach(function(v){ io.observe(v); });
}

/* ---------------- PROPOSTA (secções flexíveis) ---------------- */
function legacyToSecoes(pr){
  var s = [];
  if(pr.ondeEstao) s.push({ tipo:"texto", eyebrow:T("PT-PROP-EYE-ONDE"), paragrafos:[pr.ondeEstao] });
  if(pr.oQueVimos && pr.oQueVimos.length) s.push({ tipo:"texto", eyebrow:T("PT-PROP-EYE-VIMOS"), bullets:pr.oQueVimos });
  if(pr.ondePodemChegar) s.push({ tipo:"texto", eyebrow:T("PT-PROP-EYE-CHEGAR"), paragrafos:[pr.ondePodemChegar] });
  if(pr.conceitos && pr.conceitos.length) s.push({ tipo:"cards", eyebrow:T("PT-PROP-EYE-CONCEITOS"), modo:"carrossel",
    cards: pr.conceitos.map(function(c){ return { img:c.img, titulo:c.titulo, resumo:c.desc }; }) });
  if(pr.moodboard && pr.moodboard.length) s.push({ tipo:"galeria", eyebrow:T("PT-PROP-EYE-MOOD"), modo:"colagem",
    itens: pr.moodboard.map(function(u){ return { src:u, tipo:"foto" }; }) });
  if(pr.referencias && pr.referencias.length) s.push({ tipo:"cards", eyebrow:T("PT-PROP-EYE-REF"), modo:"carrossel",
    cards: pr.referencias.map(function(r){ return { img:r.img, resumo:r.nota }; }) });
  if(pr.planos && pr.planos.length) s.push({ tipo:"cards", eyebrow:T("PT-PROP-EYE-INVEST"), modo:"grelha", colunas:pr.planos.length,
    cards: pr.planos.map(function(p){ return { titulo:p.nome, icone:p.icone, preco:p.preco, resumo:p.resumo, linhas:p.inclui, destaque:p.destaque }; }) });
  var fecho = pr.fecho || T("PT-PROP-FECHO");
  s.push({ tipo:"texto", classe:"cta-wrap", eyebrow:T("PT-PROP-EYE-OBRIGADO"), titulo: pr.cta || T("PT-PROP-CTA"), paragrafos:[fecho], fechoStyle:true });
  return s;
}

function secTextoHTML(s){
  var h = '<section'+(s.classe?' class="'+s.classe+'"':'')+'>';
  if(s.eyebrow) h += '<p class="eyebrow">'+s.eyebrow+'</p>';
  if(s.titulo) h += '<h2>'+s.titulo+'</h2>';
  (s.paragrafos||[]).forEach(function(p){ if(p) h += '<p class="'+(s.fechoStyle?"fecho":"lead")+'">'+p+'</p>'; });
  if(s.bullets && s.bullets.length){
    h += '<ul class="pts">'+s.bullets.map(function(b){ return '<li>'+b+'</li>'; }).join("")+'</ul>';
  }
  return h + '</section>';
}
function secGaleriaHTML(s, idx){
  var h = '<section>'+(s.eyebrow?'<p class="eyebrow">'+s.eyebrow+'</p>':'');
  var itens = s.itens || [];
  if(s.modo === "carrossel"){
    h += '<div class="cx" data-lb="prop'+idx+'"><div class="cx-stage">' +
      itens.map(function(it){ return '<article class="cx-card"><img src="'+(it.thumb||it.src)+'" alt=""></article>'; }).join("") +
      '</div>' + (itens.length > 1 ? '<button class="cx-nav prev" aria-label="Anterior">&#8249;</button><button class="cx-nav next" aria-label="Seguinte">&#8250;</button><div class="cx-dots"></div>' : '') + '</div>';
  } else {
    h += '<div class="mood" data-lb="prop'+idx+'">' + itens.map(function(it){ return '<img src="'+(it.thumb||it.src)+'" alt="">'; }).join("") + '</div>';
  }
  return h + '</section>';
}
function secCardsHTML(s){
  var cards = s.cards || [];
  var inner = cards.map(function(c){
    var acc = c.cor ? ' style="--acc:'+c.cor+'"' : '';
    return '<div class="plan'+(c.destaque?" hot":"")+(c.img?" has-bg":"")+'"'+acc+'>' +
      (c.img ? '<div class="p-bg"><img src="'+c.img+'" alt=""></div>' : '') +
      (c.destaque ? '<span class="p-flag">'+(c.flag||T("PT-PROP-FLAG"))+'</span>' : '') +
      (c.titulo ? '<span class="p-name">'+(c.icone?svgIcon(c.icone,"p-ico"):"")+'<span>'+c.titulo+'</span></span>' : '') +
      (c.preco ? '<span class="p-price">'+c.preco+'</span>' : '') +
      (c.resumo ? '<p class="p-resumo">'+c.resumo+'</p>' : '') +
      ((c.linhas && c.linhas.length) ? '<ul>'+c.linhas.map(function(l){ return '<li>'+l+'</li>'; }).join("")+'</ul>' : '') +
    '</div>';
  }).join("");
  if(s.modo === "carrossel"){
    return '<section>'+(s.eyebrow?'<p class="eyebrow">'+s.eyebrow+'</p>':'') +
      '<div class="cx cx-cards"><div class="cx-stage">' +
      cards.map(function(c){
        return '<article class="cx-card">'+(c.img?'<img src="'+c.img+'" alt="">':'')+
          '<div class="c-body">'+(c.titulo?'<h3>'+c.titulo+'</h3>':'')+(c.resumo?'<p>'+c.resumo+'</p>':'')+'</div></article>';
      }).join("") + '</div>' +
      (cards.length > 1 ? '<button class="cx-nav prev" aria-label="Anterior">&#8249;</button><button class="cx-nav next" aria-label="Seguinte">&#8250;</button><div class="cx-dots"></div>' : '') +
      '</div></section>';
  }
  return '<section>'+(s.eyebrow?'<p class="eyebrow">'+s.eyebrow+'</p>':'') +
    '<div class="plans" style="--cols:'+(s.colunas || cards.length || 3)+'">'+inner+'</div></section>';
}

function renderProposta(d, app){
  var pr = d.proposta || {};
  var secoes = (pr.secoes && pr.secoes.length) ? pr.secoes : legacyToSecoes(pr);
  var box = el("div","prop");
  var html = "";
  secoes.forEach(function(s, i){
    if(s.tipo === "texto") html += secTextoHTML(s);
    else if(s.tipo === "galeria") html += secGaleriaHTML(s, i);
    else if(s.tipo === "cards") html += secCardsHTML(s);
  });
  box.innerHTML = html;
  app.appendChild(box);
  app.appendChild(footer(d));
  document.querySelectorAll(".cx").forEach(initCoverflow);

  // galerias em colagem: clicar abre a galeria de passar
  box.querySelectorAll('.mood[data-lb]').forEach(function(grid){
    var imgs = [].slice.call(grid.querySelectorAll("img"));
    var SET = imgs.map(function(im){ return { src: im.src, tipo: "foto" }; });
    imgs.forEach(function(im, i){ im.addEventListener("click", function(){ openLb(i, SET); }); });
  });
}

function initCoverflow(cx){
  var cards = [].slice.call(cx.querySelectorAll(".cx-card"));
  var N = cards.length; if(N < 2) return;
  var cur = 0, timer;

  function place(){
    cards.forEach(function(c, i){
      var dd = i - cur;
      if(dd >  N/2) dd -= N;
      if(dd < -N/2) dd += N;
      var a = Math.abs(dd);
      c.style.transform = "translateX(calc(-50% + " + (dd * 58) + "%)) scale(" + Math.max(0.55, 1 - a*0.24) + ")";
      c.style.opacity = a === 0 ? 1 : Math.max(0, 0.42 - (a-1)*0.22);
      c.style.filter = a === 0 ? "none" : "blur(1.5px)";
      c.style.zIndex = 20 - a;
      c.classList.toggle("mid", a === 0);
    });
    var dots = cx.querySelectorAll(".cx-dots button");
    dots.forEach(function(b, i){ b.classList.toggle("on", i === cur); });
  }
  function go(n){ cur = (n + N) % N; place(); }
  function next(){ go(cur + 1); }
  function prev(){ go(cur - 1); }
  function restart(){ clearInterval(timer); timer = setInterval(next, 10000); }

  var dotsWrap = cx.querySelector(".cx-dots");
  if(dotsWrap){
    for(var k = 0; k < N; k++){
      var b = document.createElement("button"); b.type = "button";
      b.setAttribute("aria-label", "Ver " + (k+1));
      (function(idx){ b.addEventListener("click", function(){ go(idx); restart(); }); })(k);
      dotsWrap.appendChild(b);
    }
  }
  var pv = cx.querySelector(".cx-nav.prev"), nx = cx.querySelector(".cx-nav.next");
  if(pv) pv.addEventListener("click", function(){ prev(); restart(); });
  if(nx) nx.addEventListener("click", function(){ next(); restart(); });
  cx.addEventListener("pointerenter", function(){ clearInterval(timer); });
  cx.addEventListener("pointerleave", restart);

  place(); restart();
}

function footer(d){
  var f = el("footer","pfoot");
  f.innerHTML =
    '<a class="pf-brand" href="/"><img src="/assets/logos/asteris.png" alt="" aria-hidden="true">Asteris</a>' +
    '<span class="lang-switch" data-lang-switch aria-label="Idioma / Language">' +
      '<button type="button" data-lang-btn="pt">PT</button>' +
      '<button type="button" data-lang-btn="en">EN</button>' +
      '<button type="button" data-lang-btn="es">ES</button>' +
      '<button type="button" data-lang-btn="fr">FR</button>' +
    '</span>' +
    '<span class="pf-copy">' + T("PT-FOOT-COPY",{ano:new Date().getFullYear()}) + '</span>' +
    '<span class="pf-cross">&#10022;</span>';
  markLangSwitch(f);
  return f;
}

/* o portal constrói o conteúdo uma vez a partir do JSON; trocar de língua recarrega */
function markLangSwitch(root){
  root.querySelectorAll("[data-lang-btn]").forEach(function(b){
    b.setAttribute("aria-current", b.getAttribute("data-lang-btn") === window.I18N.lang() ? "true" : "false");
  });
}
document.addEventListener("click", function(e){
  var b = e.target.closest("[data-lang-switch] [data-lang-btn]");
  if(!b) return;
  var l = b.getAttribute("data-lang-btn");
  if(l === window.I18N.lang()) return;
  window.I18N.setLang(l);
  location.reload();
});
</script>
